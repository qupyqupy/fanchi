  contentArr.push('<div class="title_text">阿瓦隆的小偷貓、建造打鐵舖</div> <p>在皇帝<span class="global_name_span">傑拉爾</span>平定［北巴雷努］並著手建設首都［阿瓦隆］的同時，城鎮裡卻悄然流傳起［小偷貓］頻繁出沒作案的傳聞。</p> <p>為了查明真相，皇帝在白天向［阿瓦隆］居民打聽情報後，特地返回城堡寢室休息至深夜，隨即在黑夜中展開巡查，並根據目擊者的線索爬上武器店的屋頂展開追緝。</p> <p>在屋頂的盡頭，皇帝不僅親眼見到了身手矯健的女飛賊<span class="global_name_span">小貓</span>，更目睹她正遭到兇惡魔物的圍攻，皇帝毫不猶豫地出手相助擊退魔物，救下了陷入危機的<span class="global_name_span">小貓</span>。</p> <p>心存感激的<span class="global_name_span">小貓</span>在臨走前留下了暗號，隔天清晨，皇帝前往酒館對酒保說出暗號，隨後便在酒保的指引下來到城鎮墓園，見到了隱身於地底的［盜賊公會］。</p> <p>在［盜賊公會］的基地裡，公會首領與向皇帝提出請求，希望帝國能幫忙剷除盤踞在［阿瓦隆］地下水道深處、嚴重威脅公會成員安危的強大魔物。</p> <p>皇帝欣然接下委託並深入陰暗的下水道迷宮，成功討伐魔物，不僅贏得了［盜賊公會］的信賴與效忠，更獲得了攻略［運河要塞］時由<span class="global_name_span">小貓</span>親自帶路潛入的關鍵協助。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/kGfUrS6AFJE?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">無敵格鬥家、建造法術研究所、七英雄的記憶2</div> <p>皇帝帶領帝國軍南下進入［南巴雷努］的［尼貝爾］村落，從村民口中得知當地一向由［龍穴］的格鬥家們負責守護，然而近期附近［怪物的巢穴］卻魔物猖獗，連向來驕傲的格鬥家們也陷入苦戰。</p> <p>皇帝親自前往［龍穴］拜訪格鬥家首領<span class="global_name_span">卡爾</span>並主動提出協助，隨後深入［怪物的巢穴］討伐魔物，並在洞窟深處跟隨藍色流光觸發了［七英雄記憶］的第二段。</p> <p>在記憶畫面中，年輕的<span class="global_name_span">奧艾薇</span>與<span class="global_name_span">諾維爾</span>回憶起童年往事並感慨彼此都已成長，當得知<span class="global_name_span">諾維爾</span>即將擔任白蟻討伐部隊隊長出征時，心懷擔憂的<span class="global_name_span">奧艾薇</span>只能默默在心中祈禱這位摯友能平安歸來。</p> <p>結束記憶探索並繼續深入［怪物的巢穴］最底層，皇帝迎戰了盤踞在深處的魔物首領［巨大膠質物］並成功將其徹底消滅。</p> <p>當皇帝返回［龍穴］回報戰果時，<span class="global_name_span">卡爾</span>隨即帶領武者前往［怪物的巢穴］消滅最後的BOSS，對於解決怪物問題又保存了自己顏面的皇帝，<span class="global_name_span">卡爾</span>心服口服的率領［龍穴］一族宣誓效忠並加入［巴雷努帝國］的行列，同時也為帝國開啟了通往礦鎮［緹法爾］的新道路。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/XgGemavzA80?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">掌控珠寶礦山、七英雄的記憶3</div> <p>在收服［龍穴］格鬥家並打通前往［路敦］地區的道路後，皇帝抵達了以採礦聞名的城鎮［緹法爾］，卻從當地酒館與居民口中得知，鎮上賴以為生的［寶石礦山］近期遭到大量魔物佔據而徹底停擺。</p> <p>為了確保［巴雷努帝國］的龐大財政收入並解救生計受困的礦工，皇帝毅然前往［寶石礦山］入口，在礦山守衛驚訝的目光下主動接下了驅逐魔物的重任。</p> <p>搭乘礦坑升降梯深入黑暗的地下坑道後，皇帝在礦山中層跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第三段。</p> <p>在記憶畫面中，當時尚未成為七英雄的<span class="global_name_span">瓦古納斯</span>正與身為王國軍最強槍兵的<span class="global_name_span">蘇比耶</span>在海邊商議對策。</p> <p>面對［白蟻］魔物不斷毀滅人類城鎮的危機，<span class="global_name_span">瓦古納斯</span>決定組建一支精銳敢死隊並力邀<span class="global_name_span">蘇比耶</span>入隊，而原本打算隨波逐流直至死亡的<span class="global_name_span">蘇比耶</span>則與他約定，只要自己能順利乘上傳說中的大浪，便會將性命託付給表兄並肩作戰。</p> <p>結束記憶探索並繼續深入礦山最底層，皇帝迎戰了盤踞在寶石礦脈深處的魔物首領［蜥蜴怪］並成功將其徹底討伐。</p> <p>隨著［寶石礦山］恢復安全並重新開採，整個［路敦］地區正式納入［巴雷努帝國］的勢力版圖，不僅為帝國帶來了豐厚的長期稅收，也為日後［阿瓦隆］的各項大型建設奠定了堅實的經濟基礎。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/siPxovaSkxo?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">武裝商船事件</div> <p>為了打通北海航線的海上通道，皇帝前往港都［蒙貝魯恩］與壟斷海運的［武裝商船團］進行交涉，卻發現這群桀驁不馴的海上霸主不僅拒絕對［巴雷努帝國］妥協，還將大本營［努歐諾］的海路嚴密封鎖。</p> <p>為了找出［努歐諾］的防衛破口，皇帝潛入［蒙貝魯恩］的商船團秘密據點，在與屋內的守衛交涉並趁機將其打暈後，皇帝貼在牆邊成功［偷聽］到了隔壁房間內幹部們的秘密對話。</p> <p>從幹部們的談話中，皇帝意外得知除了戒備森嚴的［迷宮水路］之外，其實還有一條鮮為人知的陸路秘道可以繞過險峻的［哈利亞半島］，直接從後方奇襲［努歐諾］。</p> <p>掌握這項關鍵情報後，皇帝立刻率領精銳部隊啟程前往［哈利亞半島］，沿途披荊斬棘穿越險峻的岩山與魔物盤踞的山道，順利走［陸路］繞到了防備最空虛的［努歐諾］後方高地。</p> <p>當皇帝帶著帝國軍從天而降、突然出現在［努歐諾］港口並包圍首領據點時，原本以為海上天險萬無一失的［武裝商船團］首領大為震驚。</p> <p>面對皇帝展現出的驚人智謀與強大武力，自知無路可退的首領在皇帝的威嚴要求下徹底心服口服，當場宣告全面［服從］，正式將整支無敵艦隊與地區的制海權獻給了［巴雷努帝國］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/FzL7MKbuA8I?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');

  (function(){

  contentArr.push('<div class="title_text">傑拉爾篇</div> <p>故事開端於傳說中被稱為救世主的［七英雄］再度現身之際，然而他們並非前來拯救世界，而是化身為帶來毀滅與災厄的復仇者。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/WgSsPnOjXRo?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <p>在［巴雷努帝國］的首都［阿瓦隆］，皇帝<span class="global_name_span">雷昂</span>帶領著勇猛的長子<span class="global_name_span">維克托</span>以及性格溫厚、不擅長戰鬥的次子<span class="global_name_span">傑拉爾</span>，一同在帝國邊境討伐作亂的魔物。</p> <p>就在<span class="global_name_span">雷昂</span>與<span class="global_name_span">傑拉爾</span>外出征戰之際，七英雄之一的<span class="global_name_span">庫吉辛</span>突然襲擊了留守［阿瓦隆］的<span class="global_name_span">維克托</span>，並以詭異的必殺技［奪魂］無情地奪走了他的性命。</p> <p>得知長子慘死的噩耗後，<span class="global_name_span">雷昂</span>悲憤交加，為了向<span class="global_name_span">庫吉辛</span>復仇，他與神秘的魔女<span class="global_name_span">歐艾薇</span>立下契約，獲得了能將記憶與能力代代相傳的禁忌秘術［傳承法］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/6ESttsAZpyA?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <p><span class="global_name_span">雷昂</span>帶著<span class="global_name_span">傑拉爾</span>殺入<span class="global_name_span">庫吉辛</span>所在的［索蒙］，雖然父子倆聯手重創了強敵，但<span class="global_name_span">雷昂</span>卻在親自承受<span class="global_name_span">庫吉辛</span>的［靈魂強奪］時耗盡生命，臨終前發動［傳承法］將畢生力量與復仇的意志託付給了次子<span class="global_name_span">傑拉爾</span>。</p> <p>繼承父親遺志的<span class="global_name_span">傑拉爾</span>正式登基成為新任皇帝，他一改過去懦弱的性格，迅速整合帝國軍力，首先帶兵出擊並成功掃蕩了趁亂襲擊首都［阿瓦隆］的［哥布林］巢穴，邁出了對抗七英雄的第一步。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/e1iNp_EiLa4?wmode=transparent" title="YouTube video player" width="560"></iframe></p><p>在順利掃蕩［哥布林］巢穴並穩固首都［阿瓦隆］的防線後，繼承了［傳承法］與父兄遺志的新任皇帝<span class="global_name_span">傑拉爾</span>，率領重整旗鼓的帝國軍隊再度進軍［索蒙］，誓言徹底討伐七英雄之一的<span class="global_name_span">庫吉辛</span>。</p> <p>在深入［索蒙］宅邸的過程中，<span class="global_name_span">傑拉爾</span>跟隨藍色流光走進壁爐後的密室，觸發了塵封已久的［七英雄記憶］第一段，看見過去的<span class="global_name_span">瓦古納斯</span>與學者<span class="global_name_span">沙格薩</span>正神色凝重地討論著世界各地異常的氣象觀測數據，並商議著應對即將到來的［大災厄］以及時空轉移等重大危機。</p> <p>帶著對這段神秘過往的疑問，<span class="global_name_span">傑拉爾</span>繼續突破重重防線，終於在宅邸深處再度與<span class="global_name_span">庫吉辛</span>正面交鋒。</p> <p>面對曾經無情奪走兄長<span class="global_name_span">維克托</span>與父親<span class="global_name_span">雷昂</span>性命的必殺技［靈魂強奪］，已經學會見切技的<span class="global_name_span">傑拉爾</span>完美化解了這招致命一擊，並憑藉歷代傳承的力量將狂妄的<span class="global_name_span">庫吉辛</span>徹底擊敗。</p> <p>隨著<span class="global_name_span">庫吉辛</span>化為灰燼消散，［北巴雷努］地區終於從恐懼與威脅中解放，正式納入了［巴雷努帝國］的版圖。</p> <p>大獲全勝的<span class="global_name_span">傑拉爾</span>凱旋返回［阿瓦隆］，轉眼間［一年後］，［巴雷努帝國］迎來了前所未有的繁榮與安定，然而對抗其餘［七英雄］的漫長征途才正要全面展開。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/2UB9hgYhJVc?wmode=transparent" title="YouTube video player" width="560"></iframe></p><p>為了打通［巴雷努帝國］通往［南巴雷努］與大陸內陸的海上與陸路要道，皇帝決定出兵奪回［運河要塞］。</p> <p>鑑於要塞正面大門重兵把守且設有水門機關，強行攻堅勢必造成帝國軍慘重傷亡，皇帝在<span class="global_name_span">凱特</span>親自帶領下避開正面守軍的視線，從隱秘的側翼路徑一路潛入［運河要塞］內部。</p> <p>在<span class="global_name_span">凱特</span>精準的引路與掩護下，帝國軍順利避開了層層重兵巡邏，並在要塞高塔處巧妙地繞過守衛，一路直搗要塞的核心指揮室。</p> <p>面對企圖負隅頑抗的要塞指揮官與魔物守衛，皇帝率領夥伴展開猛烈攻勢並成功將敵軍首領徹底擊潰。</p> <p>隨著［運河要塞］重回［巴雷努帝國］的掌控，原本遭到封鎖的運河航道與［南巴雷努］地區全境正式解放，帝國的領土與影響力也隨之大步向南方推進。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/FlS1tl0pKxM?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">皇位繼承問題、七英雄的記憶5</div> <p>皇帝率領帝國軍跨越國境來到［坎伯蘭］的首都［道格拉斯］，在探索［道格拉斯城］一樓西側的小房間時跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第五段。</p> <p>在記憶畫面中，過去的<span class="global_name_span">瓦古納斯</span>與夥伴們正神色凝重地制定針對［白蟻］的奇襲作戰計畫，並由<span class="global_name_span">瓦古納斯</span>親自向眾人介紹擁有卓越智謀的新夥伴<span class="global_name_span">博庫歐</span>正式加入部隊。</p> <p>結束記憶探索後皇帝進入謁見廳晉見年邁病重的國王<span class="global_name_span">哈羅德</span>，國王在與皇帝相談甚歡後，向皇帝徵詢該由性格耿直的長子<span class="global_name_span">葛爾洛克</span>、聰慧冷靜的長女<span class="global_name_span">蘇菲亞</span>，或是年幼善良的次子<span class="global_name_span">托馬</span>繼承王位，而皇帝則建議由受人愛戴的<span class="global_name_span">托馬</span>繼承大統。</p> <p>就在<span class="global_name_span">哈羅德</span>國王採納建言並於當晚因病驟逝後，年幼的<span class="global_name_span">托馬</span>正式登基，然而不滿此決定且懷疑有奸臣操弄的長兄<span class="global_name_span">葛爾洛克</span>隨即舉兵集結，準備進攻首都奪回政權。</p> <p>為了阻止［坎伯蘭］陷入骨肉相殘的內戰，皇帝接受了<span class="global_name_span">托馬</span>的請託，主動擔任和平使者前往拜會<span class="global_name_span">葛爾洛克</span>進行調停。</p> <p>面對心存戒備的<span class="global_name_span">葛爾洛克</span>，皇帝親自前往防衛吃緊的［長城］，深入地下討伐了不斷侵襲城牆的巨大魔物［沙丘蠕蟲］，以實際行動贏得了長兄的徹底信賴並成功促成兄弟和解。</p> <p>然而就在兩人化干戈為玉帛之際，居心叵測的大臣<span class="global_name_span">賽弗里特</span>卻趁著首都空虛發動政變並綁架了<span class="global_name_span">托馬</span>，迫使皇帝立刻與<span class="global_name_span">葛爾洛克</span>聯手出兵，直搗首都［道格拉斯］救回<span class="global_name_span">托馬</span>。</p> <p>接著皇帝深入［賽弗里特要塞］徹底擊敗了勾結魔物的叛徒<span class="global_name_span">賽弗里特</span>，不僅平息了［坎伯蘭］的內亂，更贏得了［神聖騎士團］與整個王國的忠誠歸順。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/WC-rAA6II9w?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">草原的巨大戰艦、七英雄的記憶6</div> <p>皇帝率領帝國軍來到廣闊的［史特普］大草原，在探索草原深處時跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第六段。</p> <p>在記憶畫面中，過去的<span class="global_name_span">諾維爾</span>與士兵們在撤退途中遭到［白蟻］大軍包圍而陷入苦戰，就在全軍即將覆沒的千鈞一髮之際，<span class="global_name_span">博庫歐</span>與<span class="global_name_span">蘇比耶</span>及時率軍趕到並成功掩護眾人撤退，而經歷這場慘烈戰役的<span class="global_name_span">諾維爾</span>也因此萌生了
