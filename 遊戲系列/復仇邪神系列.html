  contentArr.push('<div class="title_text">阿瓦隆的小偷貓、建造打鐵舖</div> <p>在皇帝<span class="global_name_span">傑拉爾</span>平定［北巴雷努］並著手建設首都［阿瓦隆］的同時，城鎮裡卻悄然流傳起［小偷貓］頻繁出沒作案的傳聞。</p> <p>為了查明真相，皇帝在白天向［阿瓦隆］居民打聽情報後，特地返回城堡寢室休息至深夜，隨即在黑夜中展開巡查，並根據目擊者的線索爬上武器店的屋頂展開追緝。</p> <p>在屋頂的盡頭，皇帝不僅親眼見到了身手矯健的女飛賊<span class="global_name_span">小貓</span>，更目睹她正遭到兇惡魔物的圍攻，皇帝毫不猶豫地出手相助擊退魔物，救下了陷入危機的<span class="global_name_span">小貓</span>。</p> <p>心存感激的<span class="global_name_span">小貓</span>在臨走前留下了暗號，隔天清晨，皇帝前往酒館對酒保說出暗號，隨後便在酒保的指引下來到城鎮墓園，見到了隱身於地底的［盜賊公會］。</p> <p>在［盜賊公會］的基地裡，公會首領與向皇帝提出請求，希望帝國能幫忙剷除盤踞在［阿瓦隆］地下水道深處、嚴重威脅公會成員安危的強大魔物。</p> <p>皇帝欣然接下委託並深入陰暗的下水道迷宮，成功討伐魔物，不僅贏得了［盜賊公會］的信賴與效忠，更獲得了攻略［運河要塞］時由<span class="global_name_span">小貓</span>親自帶路潛入的關鍵協助。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/kGfUrS6AFJE?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">無敵格鬥家、建造法術研究所、七英雄的記憶2</div> <p>皇帝帶領帝國軍南下進入［南巴雷努］的［尼貝爾］村落，從村民口中得知當地一向由［龍穴］的格鬥家們負責守護，然而近期附近［怪物的巢穴］卻魔物猖獗，連向來驕傲的格鬥家們也陷入苦戰。</p> <p>皇帝親自前往［龍穴］拜訪格鬥家首領<span class="global_name_span">卡爾</span>並主動提出協助，隨後深入［怪物的巢穴］討伐魔物，並在洞窟深處跟隨藍色流光觸發了［七英雄記憶］的第二段。</p> <p>在記憶畫面中，年輕的<span class="global_name_span">奧艾薇</span>與<span class="global_name_span">諾維爾</span>回憶起童年往事並感慨彼此都已成長，當得知<span class="global_name_span">諾維爾</span>即將擔任白蟻討伐部隊隊長出征時，心懷擔憂的<span class="global_name_span">奧艾薇</span>只能默默在心中祈禱這位摯友能平安歸來。</p> <p>結束記憶探索並繼續深入［怪物的巢穴］最底層，皇帝迎戰了盤踞在深處的魔物首領［巨大膠質物］並成功將其徹底消滅。</p> <p>當皇帝返回［龍穴］回報戰果時，<span class="global_name_span">卡爾</span>隨即帶領武者前往［怪物的巢穴］消滅最後的BOSS，對於解決怪物問題又保存了自己顏面的皇帝，<span class="global_name_span">卡爾</span>心服口服的率領［龍穴］一族宣誓效忠並加入［巴雷努帝國］的行列，同時也為帝國開啟了通往礦鎮［緹法爾］的新道路。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/XgGemavzA80?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">掌控珠寶礦山、七英雄的記憶3</div> <p>在收服［龍穴］格鬥家並打通前往［路敦］地區的道路後，皇帝抵達了以採礦聞名的城鎮［緹法爾］，卻從當地酒館與居民口中得知，鎮上賴以為生的［寶石礦山］近期遭到大量魔物佔據而徹底停擺。</p> <p>為了確保［巴雷努帝國］的龐大財政收入並解救生計受困的礦工，皇帝毅然前往［寶石礦山］入口，在礦山守衛驚訝的目光下主動接下了驅逐魔物的重任。</p> <p>搭乘礦坑升降梯深入黑暗的地下坑道後，皇帝在礦山中層跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第三段。</p> <p>在記憶畫面中，當時尚未成為七英雄的<span class="global_name_span">瓦古納斯</span>正與身為王國軍最強槍兵的<span class="global_name_span">蘇比耶</span>在海邊商議對策。</p> <p>面對［白蟻］魔物不斷毀滅人類城鎮的危機，<span class="global_name_span">瓦古納斯</span>決定組建一支精銳敢死隊並力邀<span class="global_name_span">蘇比耶</span>入隊，而原本打算隨波逐流直至死亡的<span class="global_name_span">蘇比耶</span>則與他約定，只要自己能順利乘上傳說中的大浪，便會將性命託付給表兄並肩作戰。</p> <p>結束記憶探索並繼續深入礦山最底層，皇帝迎戰了盤踞在寶石礦脈深處的魔物首領［蜥蜴怪］並成功將其徹底討伐。</p> <p>隨著［寶石礦山］恢復安全並重新開採，整個［路敦］地區正式納入［巴雷努帝國］的勢力版圖，不僅為帝國帶來了豐厚的長期稅收，也為日後［阿瓦隆］的各項大型建設奠定了堅實的經濟基礎。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/siPxovaSkxo?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">武裝商船事件</div> <p>為了打通北海航線的海上通道，皇帝前往港都［蒙貝魯恩］與壟斷海運的［武裝商船團］進行交涉，卻發現這群桀驁不馴的海上霸主不僅拒絕對［巴雷努帝國］妥協，還將大本營［努歐諾］的海路嚴密封鎖。</p> <p>為了找出［努歐諾］的防衛破口，皇帝潛入［蒙貝魯恩］的商船團秘密據點，在與屋內的守衛交涉並趁機將其打暈後，皇帝貼在牆邊成功［偷聽］到了隔壁房間內幹部們的秘密對話。</p> <p>從幹部們的談話中，皇帝意外得知除了戒備森嚴的［迷宮水路］之外，其實還有一條鮮為人知的陸路秘道可以繞過險峻的［哈利亞半島］，直接從後方奇襲［努歐諾］。</p> <p>掌握這項關鍵情報後，皇帝立刻率領精銳部隊啟程前往［哈利亞半島］，沿途披荊斬棘穿越險峻的岩山與魔物盤踞的山道，順利走［陸路］繞到了防備最空虛的［努歐諾］後方高地。</p> <p>當皇帝帶著帝國軍從天而降、突然出現在［努歐諾］港口並包圍首領據點時，原本以為海上天險萬無一失的［武裝商船團］首領大為震驚。</p> <p>面對皇帝展現出的驚人智謀與強大武力，自知無路可退的首領在皇帝的威嚴要求下徹底心服口服，當場宣告全面［服從］，正式將整支無敵艦隊與地區的制海權獻給了［巴雷努帝國］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/FzL7MKbuA8I?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">加侖的叛亂</div> <p>在［武裝商船團］歸順［巴雷努帝國］並經過數個世代的漫長歲月後，原本平靜的［北隆基特］地區再度傳出變故，原本穩定上繳的帝國稅收突然遭到中斷。</p> <p>皇帝親自前往港都［蒙貝魯恩］的商船團據點查明原因，從遭驅逐的商船團前首領口中得知，野心勃勃的團員<span class="global_name_span">加侖</span>在七英雄之一的<span class="global_name_span">蘇比耶</span>暗中煽動與撐腰下發動了叛亂，奪取了大本營［努歐諾］並宣布脫離［巴雷努帝國］。</p> <p>為了平定這場叛亂並奪回［北隆基特］的制海權，皇帝在商船團前首領的指引下開啟了［迷宮水路］的航道，親自駕駛戰船穿越暗礁與海流封鎖，一路殺向戒備森嚴的［努歐諾］港口。</p> <p>登陸［努歐諾］後，皇帝率領帝國軍突破叛軍與魔物的重重防線，直搗首領據點與狂妄的叛軍首領<span class="global_name_span">加侖</span>正面交鋒，並憑藉強大武力將其徹底擊敗。</p> <p>眼見大勢已去，<span class="global_name_span">加侖</span>倉皇逃向港口企圖乘船遁入大海，隨著<span class="global_name_span">加侖</span>的逃跑，［武裝商船團］重新宣誓效忠並再度加入［巴雷努帝國］，而皇帝也從這場背後的陰謀中，深刻感受到<span class="global_name_span">蘇比耶</span>正一步步向帝國逼近的巨大威脅。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/MLOfVYVyuJI?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">沙瓦納的惡夢、地底下的幫手、七英雄的記憶9</div> <p>皇帝率領帝國軍穿過［史特普］草原來到［沙瓦納］地區，得知這裡遭到神秘蟲怪攻擊，於是前往［南聚落］的旅店休息過夜。</p> <p>然而就在深夜時分，［南聚落］突然遭到大量白蟻魔物襲擊，皇帝立刻起身並與當地［獵人］並肩作戰擊退入侵的白蟻，隨後透過聚落中央出現的地洞深入［白蟻的巢穴］展開全面掃蕩。</p> <p>在探索［白蟻的巢穴］東北側通路的過程中，皇帝跟隨藍色流光觸發了塵封已久的［七英雄記憶］第九段。</p> <p>在記憶畫面中，已經修習禁忌［吸收之法］的<span class="global_name_span">瓦古納斯</span>與<span class="global_name_span">諾維爾</span>等人正準備前往討伐白蟻蟻后，卻遇見前來會合的<span class="global_name_span">諾維爾</span>妹妹<span class="global_name_span">洛克布凱</span>；儘管<span class="global_name_span">諾維爾</span>擔心禁忌之法會侵蝕肉體與心智而不願將妹妹捲入，但<span class="global_name_span">洛克布凱</span>仍堅決要求並肩作戰，隨後趕到的<span class="global_name_span">庫吉辛</span>也一同同行。</p> <p>結束記憶探索並繼續深入巢穴底層，皇帝在途中發現了與白蟻相連的［摩爾的洞穴］，並解救了遭到白蟻圍攻的地底居民［摩爾族］。</p> <p>為了徹底解決［沙瓦納］與［摩爾族］的生存危機，皇帝直搗［白蟻的巢穴］最深處，激戰並討伐了所有白蟻的源頭［蟻后］，隨後返回［南聚落］向［獵人］回報戰果，成功平息了［沙瓦納的惡夢］並將整個［沙瓦納］納入［巴雷努帝國］的版圖，之後幾年［摩爾族］成功復興，感恩皇帝救命之恩，所以誓死效忠帝國。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/Q7Jap04vfRo?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">叢林的戰士、七英雄的記憶11</div> <p>在［巴雷努帝國］由英姿颯爽的女皇帝繼承大統後，帝國軍跨越［沙瓦納］進入茂密的熱帶叢林地區［撒拉蔓特］展開探索。</p> <p>在穿梭於［撒拉蔓特］錯綜複雜的樹海與藤蔓梯道時，女皇帝跟隨藍色流光觸發了塵封已久的［七英雄記憶］第十一段。</p> <p>在記憶畫面中，成功討伐白蟻蟻后並凱旋歸來的<span class="global_name_span">瓦古納斯</span>一行人，在城中百姓的歡呼聲中正式獲得了［七英雄］的崇高讚譽。</p> <p>然而，就在民眾夾道歡迎英雄歸來的同時，城堡內的［大神官］卻密令學者<span class="global_name_span">沙格薩</span>單獨啟動轉移裝置企圖將［阿拉巴坎山丘］送往異世界，企圖藉此抹除功高震主的七英雄並自立為神，而這場卑鄙的陰謀全被門外偷聽的女兒<span class="global_name_span">奧艾薇</span>聽在耳裡。</p> <p>結束記憶探索並繼續深入［撒拉蔓特］東南方的叢林深處後，女皇帝撞見一名身手矯健的［亞馬遜勇士］正遭到兇惡魔物圍攻，女皇帝毫不猶豫地出手相助擊退魔物，成功救下了陷入危機的女戰士。</p> <p>隨後女皇帝受邀前往只允許女性踏入的隱世聚落［亞馬遜之村］，同為女性的女皇帝不僅赢得了整座村落的信賴，獲得了強悍的［亞馬遜勇士］加入帝國軍並肩作戰，為接下來對抗<span class="global_name_span">洛克布凱</span>的戰役做好了萬全準備。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/slsqDYwRGaM?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">七英雄的記憶7、阻止火山爆發、帝國鐵匠加入</div> <p>皇帝率領帝國軍穿過險惡的［哥姆倫海峽］登上［哥姆倫島］，從［月嶋］村長口中得知島上的［哥姆倫火山］近期活動劇烈且火山灰不斷飄落，隨後便前往［魔導士的堡壘］拜訪前來研究火山的神秘魔導士。</p> <p>在踏入［魔導士的堡壘］前，皇帝在堡壘右側的崖邊跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第七段。</p> <p>在記憶畫面中，過去的<span class="global_name_span">瓦古納斯</span>與［大神官］正在王城內激烈爭執，儘管［赤龍隊］的奇襲成功卻仍未能消滅蟻后，白蟻大軍更已突破［阿迪納河］防線逼近都城，<span class="global_name_span">瓦古納斯</span>急欲疏散居民並召回在外應敵的<span class="global_name_span">諾維爾</span>，冷酷無情的［大神官］卻下令緊閉城門、打算犧牲城外百姓來爭取時間。</p> <p>結束記憶探索並進入堡壘解開機關後，皇帝見到了魔導士並從他手中取得了能夠冷卻岩漿的特殊道具［冰凍種子］，隨即動身攀登危機四伏的［哥姆倫火山］。</p> <p>在一路攀升至［哥姆倫火山］山頂的過程中，皇帝在沸騰的火山口前擊敗了盤踞於此的強大魔物首領，並果斷投入［冰凍種子］將熾熱的岩漿徹底凍結，成功阻止了火山爆發並將整個［哥姆倫島］納入［巴雷努帝國］的版圖。</p> <p>在返回［月嶋］向村長回報戰果之後，皇帝帶著在［哥姆倫火山］與世界各地集齊的五顆［純鐵石］回到［阿瓦隆］的鐵匠舖，將這批頂級礦石全數交給了傳承法布利家鍛造技藝的女鐵匠<span class="global_name_span">弗洛斯帝</span>。</p> <p>見證了皇帝對鍛造工藝的重視與支援，感動不已的<span class="global_name_span">弗洛斯帝</span>率領技藝精湛的［帝國鐵匠］一族加入帝國軍並肩作戰，為［巴雷努帝國］增添了全新的戰力與陣形。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/VrrDJ0IIjvA?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">七英雄的記憶8、人魚支線集合</div> <p>皇帝率領帝國軍來到［南隆基特］的港鎮［瑪魅朵］，被酒館中一名舞姿曼妙、氣質神秘的舞孃深深吸引，連續三天三夜前往酒館觀賞她的舞蹈。</p> <p>在第三晚舞曲結束後，皇帝悄悄尾隨舞孃走出酒館後門一路追至海邊，竟親眼目睹她躍入海中化為傳說中的［人魚］，從此對這名神秘的人魚少女念念不忘。</p> <p>為了獲得能夠在海中自由呼吸並與她重逢的［人魚藥］，皇帝前往［南隆基特］深處的［魔女的祠堂］拜訪隱居的魔女，並在祠堂最深處跟隨藍色流光觸發了［七英雄記憶］第八段。</p> <p>在記憶畫面中，面對［白蟻］大軍逼近且［大神官］僅下令死守以拖延次元轉移裝置完工的絕境，焦急不已的<span class="global_name_span">諾維爾</span>與<span class="global_name_span">瓦古納斯</span>決定打破禁忌，研習能將對手肉體與能力納為己用的［吸收之法］，即便明知心智可能會遭吸收對象的人格反噬，兩人仍為了守護國家而毅然踏上非人之路。</p> <p>結束記憶探索並向魔女取得［人魚藥］的配方後，皇帝隨即展開奔波各地的尋藥之旅，先是前往［沙瓦納］擊敗強大的［多頭蛇］取得了第一份材料［蛋殼］。</p> <p>接著皇帝前往［阿庫亞湖］取水卻遭到水精靈族［涅瑞伊得斯］的戒備與驅逐，皇帝便轉往［摩爾的洞穴］委託［摩爾族］工匠打造出閃耀著月華的［月光髮梳］，成功化解了［涅瑞伊得斯］的心結並順利取得［阿庫亞湖水］，更讓［涅瑞伊得斯］一族加入了［巴雷努帝國］。</p> <p>最後皇帝前往暴風頻仍的港鎮［托巴］，冒險攀登陡峭的懸崖採集到了稀有的［海燕窩］，隨即返回［魔女的祠堂］將三種材料交給魔女，成功煉製出夢寐以求的［人魚藥］。</p> <p>飲下［人魚藥］的皇帝潛入深海，終於與心愛的［人魚］重逢並共度了永生難忘的浪漫時光，在接連飲用三次藥水後，皇帝的身體徹底適應了海洋並選擇留在海底與摯愛相守一生，也為［巴雷努帝國］留下了這段流傳千古的浪漫傳說與［瑪魅朵舞孃］的助力。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/lJDwF2CfvXo?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">開拓哥姆倫海峽航路、火山大爆發的危機</div> <p>為了打通［坎伯蘭］與［哥姆倫島］之間的海上貿易路線，精熟航海術的［武裝商船團］皇帝，親自前往［坎伯蘭］的港鎮［弗福爾］籌備遠航計畫。</p> <p>這片名為［哥姆倫海峽］的海域自古便以暗礁密布、漩渦與暴風雨肆虐而聞名，過去從未有任何船隻能夠平安橫渡，因此被世人視為無法逾越的海上禁區。</p> <p>面對驚濤駭浪與海怪的雙重阻撓，身經百戰的商船團皇帝親自掌舵，憑藉過人的航海直覺與帝國軍的強大武力，在狂風巨浪中接連擊退襲擊船隻的海中魔物。</p> <p>最終，帝國艦隊成功突破重重天險抵達彼岸的［月嶋］，正式開闢了連接［弗福爾］與［月嶋］的［哥姆倫海峽航路］，不僅大幅拓展了［巴雷努帝國］的海上版圖，更為日後探索［哥姆倫島］奠定了關鍵交通基礎。</p> <p>在首次用［冰凍種子］凍結［哥姆倫火山］並經過數個世代的漫長歲月後，原本沉寂的［哥姆倫火山］再度傳出劇烈地鳴，面臨隨時可能［火山大爆發］的毀滅性危機。</p> <p>皇帝火速趕往［月嶋］打聽情報，得知當年用來封印岩漿的冰塊已徹底凝固成堅硬無比的巨大岩石，反而死死堵住了地底能量，若不及時釋放壓力，整座［哥姆倫島］都會在爆發中灰飛煙滅。</p> <p>為了尋求解決之道，皇帝立刻前往居住在［澤米奧］的［沙羅曼達］聚落拜訪族長，在了解情況後，族長將代代相傳、唯有勇者才能揮動的傳說兵器［哥姆倫鎚］鄭重託付給了皇帝。</p> <p>手持［哥姆倫鎚］的皇帝隨即冒著漫天火山灰與滾燙熱浪一路向上攀登［哥姆倫火山］，突破暴走的火屬性魔物防線直達山頂火山口。</p> <p>在火山口最深處，皇帝迎戰了受地熱感召而現身的強大魔物［岩漿怪］並將其徹底討伐，隨即揮動［哥姆倫鎚］奮力擊碎了堵住火山口的巨大岩石，順利釋放地底壓力並解除了［火山大爆發的危機］。</p> <p>隨著［哥姆倫島］與［澤米奧］平安獲救，居住在火山之畔的亞人種族［沙羅曼達］對皇帝的救命之恩感激不已，正式宣誓效忠並加入［巴雷努帝國］的陣營並肩作戰。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/pgp_4VRVLp8?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">組織皇帝護衛、礦工猝死事件、搭建雷昂大橋</div> <p>隨著［巴雷努帝國］的領土不斷向外擴張、與［七英雄］之間的戰事日益激烈，為了全方位守護歷代皇帝的安全並提升帝國軍的精銳戰力，皇帝在首都［阿瓦隆］的王座上正式下令編組全新的直屬近衛軍團——［皇帝護衛］。</p> <p>在［寶石礦山］恢復開採並經過數個世代的漫長歲月後，原本為［巴雷努帝國］帶來龐大財富的礦山卻突然傳出接連有［礦工猝死］的詭異事件。</p> <p>皇帝火速趕往［緹法爾］查明真相，從酒館與礦工口中得知這並非單純的意外，而是礦山最深處出現了散發不祥氣息的神秘異物，迫使整座礦場再度全面停工。</p> <p>為了平息這場離奇災厄，皇帝再次搭乘升降梯深入［寶石礦山］最底層，一路突破盤踞在黑暗坑道中的不死系魔物防線。</p> <p>在礦脈最深處，皇帝迎戰魔物首領並將其徹底討伐，隨後在角落發現了不斷吸取周遭生靈生命力的詛咒根源——［魔石］。</p> <p>皇帝果斷出手擊碎了這顆邪惡的［魔石］並帶走殘留的［魔石碎片］，不僅徹底解除了［寶石礦山］的致命詛咒、讓［礦工猝死事件］畫下句點，更為日後前往［摩爾的洞穴］委託打造強力飾品［魔石戒指］取得了關鍵材料。</p> <p>在平定［運河要塞］並讓［南巴雷努］與［北巴雷努］正式連成一氣後，為了讓［巴雷努帝國］的軍隊與商旅能夠更加順暢地往來兩岸，皇帝前往［索蒙］拜訪世代鑽研機械工藝的天才發明家<span class="global_name_span">平賀</span>。</p> <p>聽聞皇帝有意在運河水道上興建一座大型橋樑，充滿熱血與創造力的<span class="global_name_span">平賀</span>立刻提出了絕妙構想——打造一座既能讓行人與馬車通行、又能在船隻經過時升起橋面的機關吊橋。</p> <p>皇帝毫不猶豫地批准了這項耗資一百萬克朗的龐大工程，隨著時間推移與工程顺利完工，皇帝親自前往［米拉瑪］視察這座橫跨運河的壯麗建築。</p> <p>在<span class="global_name_span">平賀</span>得意地展示機關吊橋的穩固與精巧後，心懷感激的皇帝以先帝之名將這座連接帝國命脈的偉大建築正式命名為［雷昂大橋］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/10C3MIFxI-8?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">機關人偶、救出塞古族的孩子、漂浮在運河的神祕之影</div> <p>皇帝再次前往［索蒙］拜訪發明家一族的<span class="global_name_span">平賀</span>，見證了他耗盡畢生心血打造的夢想結晶——使用發條驅動的全自動人偶<span class="global_name_span">柯蓓莉亞</span>正式誕生。</p> <p>儘管<span class="global_name_span">柯蓓莉亞</span>擁有精緻的芭蕾舞裙外型與強悍的戰鬥能力，但最初沒有靈魂的她不僅對誰都出言不遜，加入帝國軍隊時更會完全無視皇帝的指令、全憑自身演算自行行動。</p> <p>然而就在世代交替、啟動［傳承法］的奇蹟時刻，原本只是冰冷機械的<span class="global_name_span">柯蓓莉亞</span>竟成功承接了歷代皇帝的記憶與靈魂，正式登基成為［巴雷努帝國］史上最獨特的［人偶皇帝］。</p> <p>在［納澤爾］地區協助［賽古族］與巨獸［牟］完成遷移並經過數個世代後，［賽古族］聚落卻突然傳出有年幼的孩子與［小牟］一同走失的緊急消息。</p> <p>皇帝火速趕往［納澤爾］的［牟的過冬地］與［牟的棲息地］打聽情報，得知貪玩的孩子與［小牟］誤闖進了魔物盤踞的危險洞窟之中。</p> <p>為了守護［巴雷努帝國］子民的安危，皇帝毫不猶豫地深入洞窟展開地毯式搜索，一路突破洞窟內錯綜複雜的冰冷通道與魔物防線。</p> <p>在洞窟最深處，皇帝迎戰了企圖襲擊孩子與［小牟］的強大魔物首領並將其徹底討伐，平安救出了受困的［賽古族］孩子與［小牟］，讓心懷感激的［賽古族］得以重新遷回［牟的棲息地］安居樂業。</p> <p>在［雷昂大橋］完工並造福兩岸百姓數個世代後，［米拉瑪］的運河水面卻突然不時浮現詭異的巨大黑影，緊接著［雷昂大橋］竟遭到不明巨獸猛烈撞擊而徹底毀損。</p> <p>皇帝得知消息後立刻前往［索蒙］找發明家<span class="global_name_span">平賀</span>商議對策，在勘查橋樑受損的痕跡後，決定追查這道神祕之影的真實身分。</p> <p>皇帝搭乘小船駛入廣闊的［懷林格湖］，在湖泊深處的水底洞窟中見到了傳說中掌管水域的巨大生靈［海之主］。</p> <p>面對散發著龐大威壓的［海之主］，皇帝沒有貿然動武，而是拿出了先前在［賽古族之村］購得的珍貴寶物［海風貝］並吹響音色，成功與［海之主］展開了跨越種族的溝通。</p> <p>在確認［海之主］並非出於惡意撞毀橋樑後，雙方順利化解誤會並締結了和平約定，而皇帝也在返回［索蒙］向<span class="global_name_span">平賀</span>回報真相後，順利讓［雷昂大橋］重新修復。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/9ZF2gAQbrQU?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">隱居的古代人、七英雄的記憶14</div> <p>皇帝在探索［被遺忘的城鎮］的過程中，在鎮內房屋後方跟隨藍色流光觸發了塵封已久的［七英雄的記憶］第十四段。</p> <p>在記憶畫面中，七英雄遭到次元轉移流放後，［大神官］如願以償地獨攬大權，而學者<span class="global_name_span">沙格薩</span>與<span class="global_name_span">奧艾薇</span>則在房間內為背叛摯友而痛苦懺悔；回憶尾聲，<span class="global_name_span">奧艾薇</span>想起了兒時在黑暗洞穴迷路時被<span class="global_name_span">諾維爾</span>溫柔救出的往事，堅信<span class="global_name_span">諾維爾</span>必定會在異世界活下來，因而立誓要留在這個世界漫長等待他的歸來。</p> <p>結束記憶探索後，皇帝走進鎮內建築見到了當年將［傳承法］傳授給先帝<span class="global_name_span">雷昂</span>的神秘魔女<span class="global_name_span">奧艾薇</span>，並在對話中徹底揭開了跨越數千年的歷史真相。</p> <p><span class="global_name_span">奧艾薇</span>坦承自己正是當年背叛七英雄的［大神官］之女，並道出古代人因畏懼七英雄的力量而將他們流放至異次元，如今七英雄帶著無盡怨恨回歸復仇，她才決定將［傳承法］託付給［巴雷努帝國］皇帝，藉助現代人類的力量來平息這場由古代人親手釀成的災厄並完成贖罪。</p> <p>在聆聽完<span class="global_name_span">奧艾薇</span>沉重的告白並承接這份跨越千年的宿命後，皇帝獲得了專屬能力［不老不死］，為即將到來的最終決戰做好了心理與戰力上的萬全準備。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/ZfCnmIObSEU?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');

  contentArr.push('<div class="title_text">傑拉爾篇</div> <p>故事開端於傳說中被稱為救世主的［七英雄］再度現身之際，然而他們並非前來拯救世界，而是化身為帶來毀滅與災厄的復仇者。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/WgSsPnOjXRo?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <p>在［巴雷努帝國］的首都［阿瓦隆］，皇帝<span class="global_name_span">雷昂</span>帶領著勇猛的長子<span class="global_name_span">維克托</span>以及性格溫厚、不擅長戰鬥的次子<span class="global_name_span">傑拉爾</span>，一同在帝國邊境討伐作亂的魔物。</p> <p>就在<span class="global_name_span">雷昂</span>與<span class="global_name_span">傑拉爾</span>外出征戰之際，七英雄之一的<span class="global_name_span">庫吉辛</span>突然襲擊了留守［阿瓦隆］的<span class="global_name_span">維克托</span>，並以詭異的必殺技［奪魂］無情地奪走了他的性命。</p> <p>得知長子慘死的噩耗後，<span class="global_name_span">雷昂</span>悲憤交加，為了向<span class="global_name_span">庫吉辛</span>復仇，他與神秘的魔女<span class="global_name_span">奧艾薇</span>立下契約，獲得了能將記憶與能力代代相傳的禁忌秘術［傳承法］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/6ESttsAZpyA?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <p><span class="global_name_span">雷昂</span>帶著<span class="global_name_span">傑拉爾</span>殺入<span class="global_name_span">庫吉辛</span>所在的［索蒙］，雖然父子倆聯手重創了強敵，但<span class="global_name_span">雷昂</span>卻在親自承受<span class="global_name_span">庫吉辛</span>的［靈魂強奪］時耗盡生命，臨終前發動［傳承法］將畢生力量與復仇的意志託付給了次子<span class="global_name_span">傑拉爾</span>。</p> <p>繼承父親遺志的<span class="global_name_span">傑拉爾</span>正式登基成為新任皇帝，他一改過去懦弱的性格，迅速整合帝國軍力，首先帶兵出擊並成功掃蕩了趁亂襲擊首都［阿瓦隆］的［哥布林］巢穴，邁出了對抗七英雄的第一步。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/e1iNp_EiLa4?wmode=transparent" title="YouTube video player" width="560"></iframe></p><p>在順利掃蕩［哥布林］巢穴並穩固首都［阿瓦隆］的防線後，繼承了［傳承法］與父兄遺志的新任皇帝<span class="global_name_span">傑拉爾</span>，率領重整旗鼓的帝國軍隊再度進軍［索蒙］，誓言徹底討伐七英雄之一的<span class="global_name_span">庫吉辛</span>。</p> <p>在深入［索蒙］宅邸的過程中，<span class="global_name_span">傑拉爾</span>跟隨藍色流光走進壁爐後的密室，觸發了塵封已久的［七英雄記憶］第一段，看見過去的<span class="global_name_span">瓦古納斯</span>與學者<span class="global_name_span">沙格薩</span>正神色凝重地討論著世界各地異常的氣象觀測數據，並商議著應對即將到來的［大災厄］以及時空轉移等重大危機。</p> <p>帶著對這段神秘過往的疑問，<span class="global_name_span">傑拉爾</span>繼續突破重重防線，終於在宅邸深處再度與<span class="global_name_span">庫吉辛</span>正面交鋒。</p> <p>面對曾經無情奪走兄長<span class="global_name_span">維克托</span>與父親<span class="global_name_span">雷昂</span>性命的必殺技［靈魂強奪］，已經學會見切技的<span class="global_name_span">傑拉爾</span>完美化解了這招致命一擊，並憑藉歷代傳承的力量將狂妄的<span class="global_name_span">庫吉辛</span>徹底擊敗。</p> <p>隨著<span class="global_name_span">庫吉辛</span>化為灰燼消散，［北巴雷努］地區終於從恐懼與威脅中解放，正式納入了［巴雷努帝國］的版圖。</p> <p>大獲全勝的<span class="global_name_span">傑拉爾</span>凱旋返回［阿瓦隆］，轉眼間［一年後］，［巴雷努帝國］迎來了前所未有的繁榮與安定，然而對抗其餘［七英雄］的漫長征途才正要全面展開。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/2UB9hgYhJVc?wmode=transparent" title="YouTube video player" width="560"></iframe></p><p>為了打通［巴雷努帝國］通往［南巴雷努］與大陸內陸的海上與陸路要道，皇帝決定出兵奪回［運河要塞］。</p> <p>鑑於要塞正面大門重兵把守且設有水門機關，強行攻堅勢必造成帝國軍慘重傷亡，皇帝在<span class="global_name_span">凱特</span>親自帶領下避開正面守軍的視線，從隱秘的側翼路徑一路潛入［運河要塞］內部。</p> <p>在<span class="global_name_span">凱特</span>精準的引路與掩護下，帝國軍順利避開了層層重兵巡邏，並在要塞高塔處巧妙地繞過守衛，一路直搗要塞的核心指揮室。</p> <p>面對企圖負隅頑抗的要塞指揮官與魔物守衛，皇帝率領夥伴展開猛烈攻勢並成功將敵軍首領徹底擊潰。</p> <p>隨著［運河要塞］重回［巴雷努帝國］的掌控，原本遭到封鎖的運河航道與［南巴雷努］地區全境正式解放，帝國的領土與影響力也隨之大步向南方推進。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/FlS1tl0pKxM?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">皇位繼承問題、七英雄的記憶5</div> <p>皇帝率領帝國軍跨越國境來到［坎伯蘭］的首都［道格拉斯］，在探索［道格拉斯城］一樓西側的小房間時跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第五段。</p> <p>在記憶畫面中，過去的<span class="global_name_span">瓦古納斯</span>與夥伴們正神色凝重地制定針對［白蟻］的奇襲作戰計畫，並由<span class="global_name_span">瓦古納斯</span>親自向眾人介紹擁有卓越智謀的新夥伴<span class="global_name_span">博庫歐</span>正式加入部隊。</p> <p>結束記憶探索後皇帝進入謁見廳晉見年邁病重的國王<span class="global_name_span">哈羅德</span>，國王在與皇帝相談甚歡後，向皇帝徵詢該由性格耿直的長子<span class="global_name_span">葛爾洛克</span>、聰慧冷靜的長女<span class="global_name_span">蘇菲亞</span>，或是年幼善良的次子<span class="global_name_span">托馬</span>繼承王位，而皇帝則建議由受人愛戴的<span class="global_name_span">托馬</span>繼承大統。</p> <p>就在<span class="global_name_span">哈羅德</span>國王採納建言並於當晚因病驟逝後，年幼的<span class="global_name_span">托馬</span>正式登基，然而不滿此決定且懷疑有奸臣操弄的長兄<span class="global_name_span">葛爾洛克</span>隨即舉兵集結，準備進攻首都奪回政權。</p> <p>為了阻止［坎伯蘭］陷入骨肉相殘的內戰，皇帝接受了<span class="global_name_span">托馬</span>的請託，主動擔任和平使者前往拜會<span class="global_name_span">葛爾洛克</span>進行調停。</p> <p>面對心存戒備的<span class="global_name_span">葛爾洛克</span>，皇帝親自前往防衛吃緊的［長城］，深入地下討伐了不斷侵襲城牆的巨大魔物［沙丘蠕蟲］，以實際行動贏得了長兄的徹底信賴並成功促成兄弟和解。</p> <p>然而就在兩人化干戈為玉帛之際，居心叵測的大臣<span class="global_name_span">賽弗里特</span>卻趁著首都空虛發動政變並綁架了<span class="global_name_span">托馬</span>，迫使皇帝立刻與<span class="global_name_span">葛爾洛克</span>聯手出兵，直搗首都［道格拉斯］救回<span class="global_name_span">托馬</span>。</p> <p>接著皇帝深入［賽弗里特要塞］徹底擊敗了勾結魔物的叛徒<span class="global_name_span">賽弗里特</span>，不僅平息了［坎伯蘭］的內亂，更贏得了［神聖騎士團］與整個王國的忠誠歸順。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/WC-rAA6II9w?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">草原的巨大戰艦、七英雄的記憶6</div> <p>皇帝率領帝國軍來到廣闊的［史特普］大草原，在探索草原深處時跟隨藍色流光，觸發了塵封已久的［七英雄記憶］第六段。</p> <p>在記憶畫面中，過去的<span class="global_name_span">諾維爾</span>與士兵們在撤退途中遭到［白蟻］大軍包圍而陷入苦戰，就在全軍即將覆沒的千鈞一髮之際，<span class="global_name_span">博庫歐</span>與<span class="global_name_span">蘇比耶</span>及時率軍趕到並成功掩護眾人撤退，而經歷這場慘烈戰役的<span class="global_name_span">諾維爾</span>也因此萌生了必須獲得［超越人類的力量］才能消滅白蟻的念頭。</p> <p>結束記憶探索後，皇帝前往［遊牧民村］拜訪飽受欺壓的遊牧民族，得知七英雄之一的<span class="global_name_span">博庫歐</span>正駕駛著一艘在草原上橫行霸道的［陸上戰艦］，四處掠奪資源並製造害人的禁藥。</p> <p>面對防禦滴水不漏且不斷在草原上移動的［陸上戰艦］，皇帝決定不硬闖，而是返回［阿瓦隆］向［帝國大學］的天才軍師<span class="global_name_span">士元</span>請教破敵之策。</p> <p>足智多謀的<span class="global_name_span">士元</span>隨即獻上一計，在［史特普］草原上建造了一艘外觀龐大的［帝國戰艦］作為誘餌，算準生性多疑的<span class="global_name_span">博庫歐</span>為了摧毀威脅，必定會停下戰艦並傾巢派出艦內魔物前來進攻。</p> <p>果不其然，在遊牧民的偵察回報下，<span class="global_name_span">博庫歐</span>中計派出了大批守軍進攻誘餌戰艦，皇帝趁著［陸上戰艦］停駛且內部防衛極度空虛的絕佳時機，在遊牧民的掩護下順利潛入艦內並一路直搗駕駛室。</p> <p>在駕駛室深處，皇帝識破了<span class="global_name_span">博庫歐</span>假意求饒並企圖偷襲的卑鄙伎倆，憑藉精湛武藝徹底擊敗了這名操縱傀儡的狡猾七英雄，不僅解除了［史特普］草原的威脅，更讓心懷感激的遊牧民族正式加入［巴雷努帝國］的行列。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/d5BOyEMFNYw?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">七英雄的記憶12、雙子塔的秘密</div> <p>為了追查七英雄之一<span class="global_name_span">洛克布凱</span>的行蹤並解開［撒拉蔓特］古代遺跡的謎團，女皇帝率領帝國軍深入叢林，踏入矗立在叢林深處的［艾爾納普之塔］展開探索。</p> <p>在攀登［艾爾納普之塔］的過程中，女皇帝跟隨藍色流光觸發了塵封已久的［七英雄記憶］第十二段，看見過去陰險的［大神官］在暗算國王后反過來向士兵栽贓，誣陷<span class="global_name_span">瓦古納斯</span>與七英雄企圖弒君奪權，而遭逮捕的<span class="global_name_span">瓦古納斯</span>則冷酷警告［大神官］若敢傷害夥伴便必將取其性命。</p> <p>結束記憶探索並登上［艾爾納普之塔］，女皇帝擊敗了正在攻擊<span class="global_name_span">洛克布凱</span>的巨大植物魔物，隨即受<span class="global_name_span">洛克布凱</span>請託前往［艾爾納普神殿］，聯手打倒了阻擋在神殿入口前的強大魔物［守護者］。</p> <p>然而就在神殿大門開啟後，<span class="global_name_span">洛克布凱</span>卻搶先一步進入［艾爾納普神殿］最深處，透過神殿底層的古代裝置觀看了塵封的影像記憶，從中得知了另一座高塔［沉沒之塔］以及七英雄失散真相的關鍵情報。</p> <p>得知秘密的<span class="global_name_span">洛克布凱</span>隨即動身轉往［沉沒之塔］，女皇帝緊追在後並一路突破塔內的重重機關與守衛魔物直達最底層，面對翻臉不認人並企圖獨佔秘密的<span class="global_name_span">洛克布凱</span>，女皇帝憑藉強大實力將其徹底討伐，正式解開了［雙子塔的秘密］並將整個［撒拉蔓特］納入［巴雷努帝國］的版圖。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/2L_y9uwDdC8?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">奪回交易路線、協助牟的遷移、響徹大地的威脅、七英雄的記憶4</div> <p>皇帝率領帝國軍越過險峻的［路敦高原］進入冰寒的［納澤爾］地區，在［賽古族之村］拜訪游牧民族［賽古族］時得知，通往南方港鎮［托巴］的交易路線遭到強大魔物佔據而中斷，導致村落面臨糧食短缺的危機。</p> <p>為了替［賽古族］解決燃眉之急，皇帝承接了［奪回交易路線］的委託，動身前往村落東方的［東方迷宮］展開掃蕩行動。</p> <p>在探索［東方迷宮］北側高台的過程中，皇帝跟隨藍色流光觸發了塵封已久的［七英雄記憶］第四段，窺見了過去<span class="global_name_span">諾維爾</span>與<span class="global_name_span">丹塔克</span>初次相遇的關鍵一幕。</p> <p>在記憶畫面中，身為王國兵團［赤龍隊］隊長的<span class="global_name_span">諾維爾</span>在洞窟中討伐魔物時，偶然獲得了追求成為最強戰士的狂熱武者<span class="global_name_span">丹塔克</span>出手相助，兩人就此結下不解之緣並約定日後一決高下，攜手踏上了對抗白蟻的征途。</p> <p>結束記憶探索並深入［東方迷宮］最深處，皇帝正面迎戰了正在此地吸收魔物強化自身的七英雄之一<span class="global_name_span">丹塔克</span>，在震動整座洞窟的狂暴衝擊與［響徹大地的威脅］下，皇帝憑藉精湛武藝將這頭狂戰士徹底擊敗。</p> <p>隨著<span class="global_name_span">丹塔克</span>消散並返回［賽古族之村］回報戰果，交易路線順利恢復暢通，皇帝也從村長手中買下了能與海中生物溝通的珍貴寶物［海風貝］。</p> <p>緊接著皇帝回報拜訪族長，承接了［協助牟的遷移］任務，隨即深入［南方迷宮］討伐了擋路的魔物首領［角蜥蜴］。</p> <p>在確保遷移路徑安全後，皇帝護送著［賽古族］與溫馴的巨獸［牟］一路穿越冰冷的［納澤爾海峽］，最終順利抵達夏季牧場［牟的棲息地］，不僅讓整個［納澤爾］地區正式納入［巴雷努帝國］的版圖，更贏得了驍勇善戰的［賽古族］正式加入帝國軍並肩作戰。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/VYAiUCsdgCk?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">伊利斯與詩人的樂器、酉楊的忍者、忠臣石舟齋、七英雄的記憶13</div> <p>皇帝率領帝國軍來到東方的［尤達］地區，在港鎮［酉楊］的酒館中打聽情報時，從老闆口中得知傳說中的吟遊詩人，隨即追尋詩人的足跡，最終集齊吟遊詩人全套五件樂器後，皇帝攀登險峻的［奇卡巴山］直達山頂祭壇，隨著悠揚的合奏樂聲響徹雲霄，［伊利斯］少女受樂聲感召現身，帶領皇帝前往雲端上的［伊利斯之村］，讓擁有飛行能力的［伊利斯］一族正式加入［巴雷努帝國］的陣營並肩作戰。</p> <p>在［酉楊］城鎮中探索時，皇帝在神龕附近遇見了一名語帶挑釁的［忍者］少女，隨後從居民口中得知［尤達］王國正面臨危機，百姓們只能將希望寄託在［梁山］領主<span class="global_name_span">石舟齋</span>身上。</p> <p>皇帝前往［梁山］宅邸拜見了老劍豪<span class="global_name_span">石舟齋</span>，並受託前往國都［誠都城］晉見國王<span class="global_name_span">阿斗王</span>商議對抗七英雄的大計。</p> <p>然而狂妄自大的<span class="global_name_span">阿斗王</span>在皇帝離去後，完全不聽忠臣<span class="global_name_span">石舟齋</span>的苦勸，竟異想天開地聯絡七英雄之一的<span class="global_name_span">瓦古納斯</span>，企圖挑撥［巴雷努帝國］與<span class="global_name_span">瓦古納斯</span>兩敗俱傷好讓自己坐收漁翁之利，結果反被看穿計謀的<span class="global_name_span">瓦古納斯</span>派兵直接佔領了整座［誠都城］。</p> <p>皇帝返回［梁山］向<span class="global_name_span">石舟齋</span>確認情況後，儘管勸降失敗仍決定出兵攻入［誠都城］討伐魔物，途中皇帝在城內地牢踩下機關意外放走了受困的［忍者］少女，而重情重義的她在遇見魔物襲擊時立刻折返救出皇帝並聯手擊退敵兵，正式成為［巴雷努帝國］的可靠戰力［忍者］。</p> <p>繼續向［誠都城］推進的過程中，皇帝跟隨藍色流光觸發了塵封已久的［七英雄的記憶］第十三段，看見過去遭［大神官］陷害逮捕的<span class="global_name_span">瓦古納斯</span>在獲其他六名夥伴前來劫獄營救時，才驚覺戒備空虛全是陷阱，隨著學者<span class="global_name_span">沙格薩</span>按下開關啟動次元轉移裝置，七英雄在<span class="global_name_span">瓦古納斯</span>立下復仇誓言的怒吼中被全數流放至異世界。</p> <p>結束記憶探索並登上［誠都城］擊敗<span class="global_name_span">瓦古納斯</span>派駐的魔物首領後，明知主君昏庸卻仍貫徹［一臣不事二主］武士忠義的<span class="global_name_span">石舟齋</span>拔刀攔在皇帝面前，在與皇帝一對一單挑決鬥落敗後壯烈戰死，而皇帝在饒恕並放走悔不當初的<span class="global_name_span">阿斗王</span>後，也迎來了<span class="global_name_span">石舟齋</span>之孫<span class="global_name_span">十兵衛</span>率領［東方護衛］正式歸順［巴雷努帝國］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/GLt_ERrotzg?wmode=transparent" title="YouTube video player" width="560"></iframe></p><div class="title_text">解放特雷魯迪巴、探索移動湖、七英雄的記憶10</div> <p>皇帝率領帝國軍踏入炎熱酷暑、連行軍都會消耗體力上限的［梅魯沙漠］，抵達綠洲城鎮［特雷魯迪巴］後，得知城中的三座高塔已遭到七英雄麾下的魔物軍團佔據。</p> <p>為了平定這場危機，皇帝先後闖入左右兩座高塔收集開門鑰匙，並在探索左側高塔三樓的過程中跟隨藍色流光，觸發了塵封已久的［七英雄的記憶］第十段。</p> <p>在記憶畫面中，過去正全力討伐白蟻的<span class="global_name_span">瓦古納斯</span>與夥伴們在殲滅洞外白蟻後準備繼續深入討伐蟻后，然而謹慎的軍師<span class="global_name_span">博庫歐</span>卻提出異議，認為眾人激戰過後皆已負傷，主張應該先撤退休整恢復戰力後再行進攻。</p> <p>結束記憶探索並取齊鑰匙後，皇帝直搗中央高塔頂層，迎戰盤踞於此的強大魔物首領［河馬人］並將其徹底討伐，成功解除了［特雷魯迪巴］的燃眉之急。</p> <p>隨後皇帝根據線索展開［探索移動湖］的行動，在［梅魯沙漠］北、南、西三片沙海之間追尋著忽隱忽現的海市蜃樓，最終順利突破空間迷障，踏入了傳說中不斷移動的神秘［移動湖］。</p> <p>在［移動湖］深處的古代建築內，皇帝不僅見到了隱居於此的古代學者<span class="global_name_span">沙格薩</span>，更與駐守於此的七英雄之一<span class="global_name_span">諾維爾</span>正面交鋒。</p> <p>由於皇帝先前已在［沉沒之塔］討伐了<span class="global_name_span">諾維爾</span>最疼愛的妹妹<span class="global_name_span">洛克布凱</span>，悲憤交加的<span class="global_name_span">諾維爾</span>毫不猶豫地拒絕任何和解可能，拔劍為妹復仇並展開猛烈攻勢。</p> <p>歷經一場驚心動魄的死鬥後，皇帝憑藉歷代傳承的力量徹底擊敗了強敵<span class="global_name_span">諾維爾</span>，不僅讓整個［梅魯沙漠］重歸和平，更贏得了驍勇善戰的［沙漠護衛］正式加入［巴雷努帝國］的陣營並肩作戰。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/lktMBr7MfTw?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">沉船與暴風雨、冰海的支配者</div> <p>在歷代先帝接連討伐多位七英雄並邁入［最終皇帝］後，［南隆基特］的港鎮［托巴］卻突然籠罩在連日不斷的狂風暴雨之中，船隻完全無法出海。</p> <p>最終皇帝前往［托巴］酒館打聽情報，從海女口中得知這場異常天象的源頭來自海底的一艘神秘［沉船］，於是最終皇帝飲下［人魚藥］潛入深海，正式踏入陰森詭異的［沉船］內部展開調查。</p> <p>在［沉船］最深處的船長室裡，盤踞於此的竟是昔日發動叛亂的武裝商船團叛徒<span class="global_name_span">加侖</span>，化為怨靈的他帶著對帝國與世界的無盡怨恨襲來，最終皇帝憑藉強大實力將這縷執念徹底超渡，順利平息了襲擊［托巴］的暴風雨，也讓勇敢的［海女］正式加入［巴雷努帝國］的陣營。</p> <p>隨著［沉船與暴風雨］事件落幕，最終皇帝從海女口中進一步獲知七英雄之一的<span class="global_name_span">蘇比耶</span>已吸收了［海之主］的力量並盤踞在極北的［冰海］。</p> <p>鑑於一般漁船根本無法承受［冰海］的狂暴風浪與浮冰，最終皇帝前往［蒙貝魯恩］尋求［武裝商船團］的協助，在無敵艦隊船長的親自掌舵下，帝國戰船一路破冰前行，成功抵達了被冰雪與狂濤包圍的［冰海］核心。</p> <p>在［冰海］的驚濤駭浪之中，獲得強大海洋之力的<span class="global_name_span">蘇比耶</span>以完全體姿態現身並發動毀滅性的［大海嘯］攻勢，歷經一場驚心動魄的海上死鬥，最終皇帝徹底擊敗了這位［冰海的支配者］，為［巴雷努帝國］掃除了海洋上的最後一道重大威脅。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/4qUPj9RRpZ8?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
