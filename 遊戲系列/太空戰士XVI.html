  contentArr.push('<div class="title_text">火之召喚獸、暗殺顯化者、騎士的驕傲、黃昏迫近</div> <p>在［鐵王國］進攻［達爾梅奇亞共和國］的戰役中，［神聖贊布雷克皇國］派出［稟賦者］小隊，主角<span class="global_name_span">克萊夫</span>就是其中一員，他們想在混亂中刺殺［鐵王國］的［希瓦顯化者］，但出師不利，［希瓦顯化者］與［泰坦顯化者］的激戰造成戰場破壞與混亂，有隊員不幸被巨石砸死，<span class="global_name_span">克萊夫</span>也身受重傷，眼前的景象讓他的思緒回到13年前。</p> <p><span class="global_name_span">克萊夫</span>是［羅薩利亞公國］的嫡長子，可是因為不是［顯化者］，所以遭到母親<span class="global_name_span">安娜貝拉</span>的冷眼，而他弟弟<span class="global_name_span">約書亞</span>是［鳳凰顯化者］，雖然身體不好，卻被寄予厚望。</p> <p>此時因為北方被［魆黑地帶］侵蝕，大量的人民逃難到首都，為了解決這問題，［羅薩利亞公國］的大公<span class="global_name_span">埃爾文</span>也就是<span class="global_name_span">克萊夫</span>的父親，決定與［鐵王國］決戰，搶回被其佔有的母水晶［源龍之息］，因為他們認為擁有母水晶的庇護就能抵抗［魆黑地帶］。</p> <p><span class="global_name_span">埃爾文</span>另外派<span class="global_name_span">克萊夫</span>在戰爭開始前去討伐［哥布林］，刻意要讓他取得戰功建立威望，出發的前一晚，<span class="global_name_span">克萊夫</span>與<span class="global_name_span">吉兒</span>在月下感嘆戰爭的殘酷。</p> <p><span class="global_name_span">吉兒</span>是來自北方諸國的公主，也是［希瓦顯化者］，雖然被當作人質待在［羅薩利亞公國］，但大公<span class="global_name_span">埃爾文</span>對她不錯，與<span class="global_name_span">克萊夫</span>兄弟一起長大，有著青梅竹馬的感情。</p> <div class="global_ps_text"> <p>顯化者：能與召喚獸連結，並且顯化成該召喚獸的外貌與能力。</p> <p>稟賦者：天生能不靠水晶就施展魔法的能力者。</p> <p>兩者過度使用該能力最終都會造成身體［石化］，［顯化者］因為稀缺性(每一個召喚獸只對應一個人)，所以地位較高，［稟賦者］通常只被當作奴隸或是戰爭的道具，地位不如普通人。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/h5DeIaLa7Mw?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">穿越迷霧、不死鳥的雛鳥</div> <p><span class="global_name_span">克萊夫</span>成功討伐［哥布林］後，與軍隊在［鳳凰門］會合，大家開心地開著慶功宴，但當晚營地卻遭到［神聖贊布雷克皇國］的襲擊，大公<span class="global_name_span">埃爾文</span>被手下背叛，在次子<span class="global_name_span">約書亞</span>面前被斬殺，<span class="global_name_span">約書亞</span>因為強烈的精神刺激，化身為［召喚獸鳳凰］。</p> <p><span class="global_name_span">克萊夫</span>此時看到一個神祕的男子，伴隨著嚴重的頭痛，另一個［召喚獸伊弗雷特］橫空出世，並且將<span class="global_name_span">約書亞</span>壓在地上暴打，<span class="global_name_span">克萊夫</span>只能在一旁看著慘劇發生，吶喊著一定要將［伊弗雷特顯化者］殺了，接著便失去了意識。</p> <p>一夜過去後，［神聖贊布雷克皇國］的軍隊前來清理戰場，這時才看到這慘劇的幕後主使者竟然是<span class="global_name_span">安娜貝拉</span>，她勾結［神聖贊布雷克皇國］侵略自己的國家並且殺害自己的丈夫，對自己倖存的兒子<span class="global_name_span">克萊夫</span>，她毫不留情地將其當作［稟賦者］，在臉上刻下烙印，送給［神聖贊布雷克皇國］當作戰爭工具。</p> <div class="global_ps_text"> <p><span class="global_name_span">安娜貝拉</span>背叛的原因，是因為她是［血脈至上主義者］，她擁有［鳳凰顯化者］的血脈，但是大兒子沒有繼承、小兒子又身體衰弱，甚至［羅薩利亞公國］也因為［魆黑地帶］的侵蝕走向衰敗，所以她打算打掉重練，擺脫這些令自己不滿意的現況，嫁給［神聖贊布雷克皇國］的皇帝，生下更優秀的血脈後代。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/XDRl1y22Wxk?wmode=transparent" title="YouTube video player" width="560"></iframe></p> ');
  contentArr.push('<div class="title_text">邂逅</div> <p>時間回到現在，在刺殺［希瓦顯化者］的任務中，<span class="global_name_span">克萊夫</span>認出刺殺對象正是自己青梅竹馬的<span class="global_name_span">吉兒</span>，於是不惜與夥伴反目，同時面對［鐵王國］與夥伴的攻擊。</p> <p>就在<span class="global_name_span">克萊夫</span>即將力盡時，神秘男子<span class="global_name_span">希德</span>受到狗狗<span class="global_name_span">托加爾</span>引來，及時出現救了兩人，並且帶回自己的秘密基地。</p> <div class="global_ps_text"> <p><span class="global_name_span">托加爾</span>是<span class="global_name_span">克萊夫</span>少年時期養的狗狗，［羅薩利亞公國］覆滅之後被<span class="global_name_span">希德</span>撿到收養。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/edYvRTiKUrA?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">名為希德的男人、顯化者的行蹤</div> <p><span class="global_name_span">希德</span>本身是［拉姆顯化者］，他帶領組織在各處救助［顯化者］與［稟賦者］，他抓住<span class="global_name_span">克萊夫</span>想為弟弟復仇的心態，以［失落之翼］村落有疑似［火之顯化者］的消息讓<span class="global_name_span">克萊夫</span>暫時加入組織。</p> <p>兩人在前往［失落之翼］的途中，遇見［渥魯德王國］的<span class="global_name_span">貝妮迪妲</span>，她們的目的地似乎也是［失落之翼］。</p> <div class="global_ps_text"> <p>從<span class="global_name_span">希德</span>口中得知，召喚獸本應只有按照世界構成元素的八個，所以［火之顯化者］出現兩個並且相殘的事件是很不可思議的。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/B2WA9mWEztA?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
