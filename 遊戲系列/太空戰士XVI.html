  contentArr.push('<div class="title_text">火之召喚獸、暗殺顯化者、騎士的驕傲、黃昏迫近</div> <p>在［鐵王國］進攻［達爾梅奇亞共和國］的戰役中，［神聖贊布雷克皇國］派出［稟賦者］小隊，主角<span class="global_name_span">克萊夫</span>就是其中一員，他們想在混亂中刺殺［鐵王國］的［希瓦顯化者］，但出師不利，［希瓦顯化者］與［泰坦顯化者］的激戰造成戰場破壞與混亂，有隊員不幸被巨石砸死，<span class="global_name_span">克萊夫</span>也身受重傷，眼前的景象讓他的思緒回到13年前。</p> <p><span class="global_name_span">克萊夫</span>是［羅薩利亞公國］的嫡長子，可是因為不是［顯化者］，所以遭到母親<span class="global_name_span">安娜貝拉</span>的冷眼，而他弟弟<span class="global_name_span">約書亞</span>是［鳳凰顯化者］，雖然身體不好，卻被寄予厚望。</p> <p>此時因為北方被［魆黑地帶］侵蝕，大量的人民逃難到首都，為了解決這問題，［羅薩利亞公國］的大公<span class="global_name_span">埃爾文</span>也就是<span class="global_name_span">克萊夫</span>的父親，決定與［鐵王國］決戰，搶回被其佔有的母水晶［源龍之息］，因為他們認為擁有母水晶的庇護就能抵抗［魆黑地帶］。</p> <p><span class="global_name_span">埃爾文</span>另外派<span class="global_name_span">克萊夫</span>在戰爭開始前去討伐［哥布林］，刻意要讓他取得戰功建立威望，出發的前一晚，<span class="global_name_span">克萊夫</span>與<span class="global_name_span">吉兒</span>在月下感嘆戰爭的殘酷。</p> <p><span class="global_name_span">吉兒</span>是來自北方諸國的公主，也是［希瓦顯化者］，雖然被當作人質待在［羅薩利亞公國］，但大公<span class="global_name_span">埃爾文</span>對她不錯，與<span class="global_name_span">克萊夫</span>兄弟一起長大，有著青梅竹馬的感情。</p> <div class="global_ps_text"> <p>顯化者：能與召喚獸連結，並且顯化成該召喚獸的外貌與能力。</p> <p>稟賦者：天生能不靠水晶就施展魔法的能力者。</p> <p>兩者過度使用該能力最終都會造成身體［石化］，［顯化者］因為稀缺性(每一個召喚獸只對應一個人)，所以地位較高，［稟賦者］通常只被當作奴隸或是戰爭的道具，地位不如普通人。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/h5DeIaLa7Mw?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">穿越迷霧、不死鳥的雛鳥</div> <p><span class="global_name_span">克萊夫</span>成功討伐［哥布林］後，與軍隊在［鳳凰門］會合，大家開心地開著慶功宴，但當晚營地卻遭到［神聖贊布雷克皇國］的襲擊，大公<span class="global_name_span">埃爾文</span>被手下背叛，在次子<span class="global_name_span">約書亞</span>面前被斬殺，<span class="global_name_span">約書亞</span>因為強烈的精神刺激，化身為［召喚獸鳳凰］。</p> <p><span class="global_name_span">克萊夫</span>此時看到一個神祕的男子，伴隨著嚴重的頭痛，另一個［召喚獸伊弗雷特］橫空出世，並且將<span class="global_name_span">約書亞</span>壓在地上暴打，<span class="global_name_span">克萊夫</span>只能在一旁看著慘劇發生，吶喊   contentArr.push('<div class="title_text">邂逅</div> <p>時間回到現在，在刺殺［希瓦顯化者］的任務中，<span class="global_name_span">克萊夫</span>認出刺殺對象正是自己青梅竹馬的<span class="global_name_span">吉兒</span>，於是不惜與夥伴反目，同時面對［鐵王國］與夥伴的攻擊。</p> <p>就在<span class="global_name_span">克萊夫</span>即將力盡時，神秘男子<span class="global_name_span">希德</span>受到狗狗<span class="global_name_span">托加爾</span>引來，及時出現救了兩人，並且帶回自己的秘密基地。</p> <div class="global_ps_text"> <p><span class="global_name_span">托加爾</span>是<span class="global_name_span">克萊夫</span>少年時期養的狗狗，［羅薩利亞公國］覆滅之後被<span class="global_name_span">希德</span>撿到收養。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/edYvRTiKUrA?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">名為希德的男人、顯化者的行蹤</div> <p><span class="global_name_span">希德</span>本身是［拉姆顯化者］，他帶領組織在各處救助［顯化者］與［稟賦者］，他抓住<span class="global_name_span">克萊夫</span>想為弟弟復仇的心態，以［失落之翼］村落有疑似［火之顯化者］的消息讓<span class="global_name_span">克萊夫</span>暫時加入組織。</p> <p>兩人在前往［失落之翼］的途中，遇見［渥魯德王國］的<span class="global_name_span">貝妮迪妲</span>，她們的目的地似乎也是［失落之翼］。</p> <div class="global_ps_text"> <p>從<span class="global_name_span">希德</span>口中得知，召喚獸本應只有按照世界構成元素的八個，所以［火之顯化者］出現兩個並且相殘的事件是很不可思議的。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/B2WA9mWEztA?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">令人不安的靜寂、黑夜深處</div> <p><span class="global_name_span">克萊夫</span>兩人到了［失落之翼］，救了囚禁在這的［稟賦者］，從他們口中得知［火之顯化者］已經被<span class="global_name_span">貝妮迪妲</span>帶走，<span class="global_name_span">克萊夫</span>與<span class="global_name_span">貝妮迪妲</span>短暫交鋒後，<span class="global_name_span">希德</span>及時趕到，從兩人對話中得知，原來<span class="global_name_span">希德</span>原本是［渥魯德王國］的騎士團團長。</p> <p>兩人談話間，<span class="global_name_span">貝妮迪妲</span>的手下傳來抓到［顯化者］的消息，於是<span class="global_name_span">貝妮迪妲</span>毫不猶豫的丟下<span class="global_name_span">希德</span>兩人離去。</p> <p><span class="global_name_span">克萊夫</span>兩人回到［失落之翼］休整，一直等到前去追蹤的<span class="global_name_span">嘉布</span>帶回消息，<span class="global_name_span">貝妮迪妲</span>一夥人攻陷了［神聖贊布雷克皇國］的［諾凡堡］，並把那當作暫時的據點，要找［火之顯化者］就得前往該處。</p> <p>這時<span class="global_name_span">貝妮迪妲</span>回想起與國王<span class="global_name_span">巴拿拔斯</span>纏綿的回憶，<span class="global_name_span">貝妮迪妲</span>因為幼年遭遇不幸，所以缺乏安全感，因此將肉體與忠誠全部奉獻給<span class="global_name_span">巴拿拔斯</span>。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/EqhBWhNBk2E?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">風之顯化者</div> <p>潛入［諾凡堡］的<span class="global_name_span">希德</span>兩人遇到<span class="global_name_span">貝妮迪妲</span>，雙方大打出手，雖然<span class="global_name_span">希德</span>是［拉姆顯化者］，但<span class="global_name_span">貝妮迪妲</span>的［迦樓羅顯化者］力量顯然更勝一籌，將<span class="global_name_span">希德</span>打成重傷。</p> <p>為了避免<span class="global_name_span">貝妮迪妲</span>直接帶走［火之顯化者］，<span class="global_name_span">克萊夫</span>只能獨自追了上去，並且成功擊敗<span class="global_name_span">貝妮迪妲</span>，但意外的是，就連<span class="global_name_span">貝妮迪妲</span>的［迦樓羅顯化者］力量也被<span class="global_name_span">克萊夫</span>吸收。</p> <p>就在這時［諾凡堡］四處發生爆炸，已經崩潰的<span class="global_name_span">貝妮迪妲</span>被同夥趁隙救走，既然關於［火之顯化者］的線索已經中斷，<span class="global_name_span">克萊夫</span>與<span class="global_name_span">希德</span>決定先離開［諾凡堡］。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/XiiY0HUJR1c?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">暴風雨的前兆、因果</div> <p>已經失去［迦樓羅顯化者］能力的<span class="global_name_span">貝妮迪妲</span>，遇到一夥強盜，同伴都被當場擊殺，自己也將遭到污辱，各種絕望的情緒導致她陷入暴走狀態，終於被［迦樓羅］完全佔據身體，失去自我。</p> <p><span class="global_name_span">克萊夫</span>聽到不知名的召喚，朝著<span class="global_name_span">貝妮迪妲</span>所在的地方前進，途中遇到［火之顯化者］，只是還來不及確認其身分，就遭到<span class="global_name_span">貝妮迪妲</span>的攻擊，直接面對［迦樓羅］的力量，<span class="global_name_span">克萊夫</span>陷入絕境，此時不知名的聲音再度響起，<span class="global_name_span">克萊夫</span>瞬間失去意識，化為巨大的召喚獸［伊弗利特］，將［迦樓羅］徹底擊敗。</p> <p>為了抑制<span class="global_name_span">克萊夫</span>的暴走，<span class="global_name_span">希德</span>顯化為［拉姆］，強制將他變回人形。</p> <p>當<span class="global_name_span">克萊夫</span>醒來後，知道自己就是當年殺害弟弟<span class="global_name_span">約書亞</span>的兇手，一心尋死的他被<span class="global_name_span">希德</span>教訓一番之後，猶如喪家之犬的等待<span class="global_name_span">希德</span>的下一步。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/8Jxan8dk9eM?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">沉重的枷鎖、各自的想法</div> <p><span class="global_name_span">嘉布</span>傳來［火之顯化者］的消息，但他卻在會合地點遭到［神聖贊布雷克皇國］士兵的追殺，救下他後，確認［火之顯化者］正朝著［羅薩利亞舊址］前進，這時<span class="global_name_span">希德</span>說出自己的疑慮，既然這［火之顯化者］是貨真價實的，那<span class="global_name_span">克萊夫</span>就不一定是殺害弟弟<span class="global_name_span">約書亞</span>的兇手，有太多無法解釋的細節，只有找到［火之顯化者］才能搞清楚。</p> <p>大家回到基地後，這時<span class="global_name_span">吉兒</span>已經醒過來，她在［鳳凰門慘案］後，被［鐵王國］俘虜，本來命運應該被當作玩物蹂躪，但那時她卻剛好覺醒［濕婆顯化者］的能力，因此被當作戰爭道具，與她一起被俘虜的人民也因此被當作人質得以倖存。</p> <p>有了青梅竹馬的鼓勵<span class="global_name_span">克萊夫</span>振作起來，兩人一起回到故土［羅薩利亞］，準備找尋［火之顯化者］的蹤跡。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/yW8h9KC1iGg?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">思鄉</div> <p>如今的［羅薩利亞］十分混亂，<span class="global_name_span">克萊夫</span>兩人在旅店老闆娘<span class="global_name_span">瑪莎</span>的幫助下，修復前往［東池村］的橋樑，那是前往［鳳凰門］的必經之路。</p> <p>過程中<span class="global_name_span">克萊夫</span>親眼看到這裡的［稟賦者］慘況，雖然［稟賦者］可以不依靠水晶施展魔法，但代價卻是身體會逐漸石化，由於水晶是稀缺資源，所以［稟賦者］就這樣被當作利用完就丟的道具，<span class="global_name_span">瑪莎</span>也只能盡力用自己的人脈、財力買來這些［稟賦者］，讓他們有個善終。</p> <p>而［顯化者］也會隨著使用能力而逐漸石化，<span class="global_name_span">希德</span>身上已經出現了石化的痕跡，所以他連日常點菸都變得依靠水晶力量。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/wIs4-b-XEeI?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">朝向北方</div> <p><span class="global_name_span">克萊夫</span>到了［東池村］，遇到曾是自己老師的將軍<span class="global_name_span">梅鐸</span>的妻子，她一眼就認出兩人，並招待兩人食宿，還將自己珍藏的［羅薩利亞公國］大公<span class="global_name_span">埃爾文</span>留下的衣服給了<span class="global_name_span">克萊夫</span>。</p> <p><span class="global_name_span">克萊夫</span>在離開村子前，還去找了曾在王城工作的年老［稟賦者］，已經記憶不清的他，還記得<span class="global_name_span">埃爾文</span>的風采，並且想重回他底下做事，能在這時見到繼承父親衣服的<span class="global_name_span">克萊夫</span>，也算幫他圓滿了心願。</p> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/NS0-Kr6AgF8?wmode=transparent" title="YouTube video player" width="560"></iframe></p>');
  contentArr.push('<div class="title_text">真相的所在之處</div> <p><span class="global_name_span">克萊夫</span>兩人才抵達［鳳凰門］，就發現［火之顯化者］的身影，但追過去卻又看不到人，於是<span class="global_name_span">克萊夫</span>施展施展［伊弗利特顯化者］的力量，進入應該只有［鳳凰顯化者］才能進入的［天啟廳］。</p> <p>這裡充滿了守護者與奇異的怪物，兩人持續深入到一處巨大壁畫前，這時<span class="global_name_span">克萊夫</span>頭又開始痛了起來，意識被神祕的聲音引導拉入［次元狹間］，與自己的心魔戰鬥，最終克服心理障礙，完全吸納［伊弗利特］的力量。</p> <p><span class="global_name_span">克萊夫</span>兩人準備離開時，［火之顯化者］就站在高處看著兩人，神似本該死去的<span class="global_name_span">克萊夫</span>弟弟<span class="global_name_span">約書亞</span>。</p> <p>另一邊<span class="global_name_span">貝妮迪妲</span>的死訊傳到她的情人，同時也是［泰坦顯化者］的<span class="global_name_span">胡戈</span>處，他將滿腔的憤怒化作對<span class="global_name_span">希德</span>復仇的執念。</p> <div class="global_ps_text"> <p>神祕的聲音來自<span class="global_name_span">雅爾提瑪</span>，他一直稱<span class="global_name_span">克萊夫</span>為［繆托斯］，意思是［容納無限力量的完美容器］，為了讓<span class="global_name_span">克萊夫</span>更加完整，才在［鳳凰門］刻意安排了這場試煉。</p> </div> <p><iframe allowfullscreen="" class="no-convert" frameborder="0" height="315" src="https://www.youtube.com/embed/nEvfDOvdnLg?wmode=transparent" title="YouTube video player" width="560"></iframe></p> <div class="title_text">活下來的意義</div> <p><span class="global_name_span">克萊夫</span>兩人回到［東池村］，卻發現這裡已經被神皇后<span class="global_name_span">安娜貝拉</span>下令屠村，就連<span class="global_name_span">梅鐸</span>的妻子都不幸喪生。</p> <p><span class="global_name_span">克萊夫</span>無法原諒母親的行為，終於下定決心加入<span class="global_name_span">希德</span>的組織，但眾人離開時都沒發現，藏在暗處的身影尾隨眾人，<span class="global_name_span">希德</span>的秘密基地位置終究還是曝光了。</p> <p><span class="global_name_span">克萊夫</span>對<span class="global_name_span">希德</span>說，如今他的心願不再只是復仇，而是創造一個［人人都能活得有尊嚴的地方］，因為在最近的冒險中，<span class="global_name_span">克萊夫</span>看了太多［稟賦者］的悲劇，<span class="global_name_span">希德</span>聽了深受感動，便對兩人坦承他接下來的目的就是破壞［母水晶］。</p> <p>一直以來被當作建國根本，庇護人類的［母水晶］，其實就是造成［魆黑地帶］形成的元凶，它不停吸收大地的［乙太］，因此所有的［魆黑地帶］都是以［母水晶］為中心逐漸向內侵蝕，這現象卻被人誤以為是庇護，<span class="global_name_span">希德</span>經過多番調查確定了真實性，第一個目標就是［神聖贊布雷克皇國］的［源龍之首］。</p> <p>潛入［神聖贊布雷克皇國］的王都是件危險的事情，於是決定
