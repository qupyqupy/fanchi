  contentArr.push('<div class="title_text">使者布萊德 劇情&諮詢</div> <p>講述<span class="global_name_span">布萊德</span>與夥伴一起對抗名為［費奇］的魔獸，牠們善於模仿外型，即便<span class="global_name_span">布萊德</span>一行人用紅布綁枯葉當作識別，最終還是被［費奇］破解，只是<span class="global_name_span">布萊德</span>的同伴依舊能認出<span class="global_name_span">布萊德</span>，這讓只追求復仇、只信自己的<span class="global_name_span">布萊德</span>事後十分在意，並且無法理解。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E5%B8%83%E8%90%8A%E5%BE%B7_%E4%BD%BF%E8%80%85%EF%BC%BB%E8%A7%92%E8%89%B2%E5%8A%87%E6%83%85%EF%BC%BD%3A4?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E5%B8%83%E8%90%8A%E5%BE%B7_%E4%BD%BF%E8%80%85%EF%BC%BB%E8%AB%AE%E8%A9%A2%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//布萊德
  contentArr.push('<div class="title_text">白色貓咪魯 劇情&諮詢</div> <p><span class="global_name_span">魯</span>一直被村子裡的人懼怕，但她還是堅持善良本心並且試圖改變，在救了小女孩<span class="global_name_span">諾雅</span>之後終於被村子裡的人接納，跟大家成為朋友。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E9%AD%AF_%E7%99%BD%E8%89%B2%E8%B2%93%E5%92%AA%EF%BC%BB%E8%A7%92%E8%89%B2%E5%8A%87%E6%83%85%EF%BC%BD%3A0?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E9%AD%AF_%E7%99%BD%E8%89%B2%E8%B2%93%E5%92%AA%EF%BC%BB%E8%AB%AE%E8%A9%A2%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//魯
  contentArr.push('<div class="title_text">暗黑聖女黎維塔  劇情&諮詢</div> <p><span class="global_name_span">黎維塔</span>與夥伴本來約定抽籤守夜，但是她卻使詐，最終被<span class="global_name_span">悠絲緹亞</span>發現，為了懲罰她，要求她這夜要與其他人一起守到天亮。</p> <p><span class="global_name_span">黎維塔</span>分別與<span class="global_name_span">悠絲緹亞</span>、<span class="global_name_span">布萊德</span>、<span class="global_name_span">提爾</span>講起自己的故事，自從十三歲發現體內的［泰拉］，並利用這股力量擊退入侵領地的魔獸，最後被囚禁親手將領地化為飛灰，雖然假稱這是自己朋友的故事，但<span class="global_name_span">黎維塔</span>仍然期望有人能理解自己的痛苦，只是到最後依然沒人能體會，也許只有能吸取別人體內負面情感的<span class="global_name_span">店長</span>能體會吧。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E9%BB%8E%E7%B6%AD%E5%A1%94_%E6%9A%97%E9%BB%91%E8%81%96%E5%A5%B3%EF%BC%BB%E8%A7%92%E8%89%B2%E5%8A%87%E6%83%85%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E9%BB%8E%E7%B6%AD%E5%A1%94_%E6%9A%97%E9%BB%91%E8%81%96%E5%A5%B3%EF%BC%BB%E8%AB%AE%E8%A9%A2%EF%BC%BD%3Aa?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//黎維塔
  contentArr.push('<div class="title_text">致命之眼涅肯達莉亞  劇情&諮詢</div> <p><span class="global_name_span">涅肯達莉亞</span>憂心自己能否當好［R隊］的隊長，並講起剛加入［R隊］的一次出任務情形。</p> <p>當時［R隊］接到任務要摧毀或是回收敵人的武器，但最後逼不得以選擇引爆敵人逃逸卡車後的炸藥，本以為還在爆炸範圍內的<span class="global_name_span">盧班希亞</span>、<span class="global_name_span">葛蘭西特</span>將因此犧牲，結果兩人幸運躲進冷藏貨櫃中避開爆炸。</p> <p>任務完成後，傭兵團長要三人討論好誰做隊長，但三人都認為自己是最佳人選，於是之後每次任務她們都用擲骰子來決定誰代理隊長，其他兩人都能完美配合，如今隊長已經確定由<span class="global_name_span">涅肯達莉亞</span>擔任，她本人雖然害怕這樣會破壞原本的平衡，但在<span class="global_name_span">店長</span>鼓勵下終於放下擔憂。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B6%85%E8%82%AF%E9%81%94%E8%8E%89%E4%BA%9E_%E8%87%B4%E5%91%BD%E4%B9%8B%E7%9C%BC%EF%BC%BB%E8%A7%92%E8%89%B2%E5%8A%87%E6%83%85%EF%BC%BD%3A4?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B6%85%E8%82%AF%E9%81%94%E8%8E%89%E4%BA%9E_%E8%87%B4%E5%91%BD%E4%B9%8B%E7%9C%BC%EF%BC%BB%E8%AB%AE%E8%A9%A2%EF%BC%BD%3A8?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//涅肯達莉亞

  contentArr.push('<div class="title_text">葛蘭西特</div><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%9C%89%E7%B7%A3%E4%B9%8B%E5%AE%A2%EF%BC%BB%E8%91%9B%E8%98%AD%E8%A5%BF%E7%89%B901%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%9C%89%E7%B7%A3%E4%B9%8B%E5%AE%A2%EF%BC%BB%E8%91%9B%E8%98%AD%E8%A5%BF%E7%89%B902%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%9C%89%E7%B7%A3%E4%B9%8B%E5%AE%A2%EF%BC%BB%E8%91%9B%E8%98%AD%E8%A5%BF%E7%89%B903%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><div class="title_text">戰地醫護兵葛蘭西特 劇情&諮詢</div> <p><span class="global_name_span">葛蘭西特</span>是可以一個人解決［毒蛇幫］部隊的存在，被稱為［災厄化身］，在一次執行臨時充當醫護兵的任務時，她遇到<span class="global_name_span">瑪莉</span>被她特有的奉獻氣質吸引，之後又違反自己的一貫服從命令作風，幫忙擊退攻擊民眾的［毒蛇幫］，事後一個小女孩感激<span class="global_name_span">葛蘭西特</span>，還親自幫她治療傷口，換上繃帶，自此<span class="global_name_span">葛蘭西特</span>便向團長正式提出調換兵種為醫護兵，但因為她作風特殊，又破壞力驚人，所以調到特殊部隊［R隊］。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%91%9B%E8%98%AD%E8%A5%BF%E7%89%B9_%E6%88%B0%E5%9C%B0%E9%86%AB%E8%AD%B7%E5%85%B5%EF%BC%BB%E8%A7%92%E8%89%B2%E5%8A%87%E6%83%85%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><iframe id="odysee-iframe" style="width:80%; aspe   contentArr.push('<div class="title_text">死亡之夜馬莫尼勒 劇情&諮詢</div> <p><span class="global_name_span">馬莫尼勒</span>雖然成功坐上［塔洛斯］的王座，但底下的不死生物卻是士氣低落，智商偏低的他們根本沒有甚麼遠大的抱負、榮譽感、對國的盡忠，為了真正復興［塔洛斯］，<span class="global_name_span">馬莫尼勒</span>希望以成功討伐魔獸讓這些不死生物也能感受到勝利的喜悅，更重要的是此舉還能奪回大量的農耕地。</p> <p>本來不死生物們還不當回事，智商偏低的他們也無法理解所謂戰略，這導致討伐魔獸的過程十分困難，但<span class="global_name_span">馬莫尼勒</span>卻沒有放棄，不斷精進國內內政，甚至在戰場上以自己肉身保護部下，這讓全體不死生物第一次感受到希望，在成功討伐［暗影蜘蛛］後，［塔洛斯］的發展復興慢慢步上軌道。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E9%A6%AC%E8%8E%AB%E5%B0%BC%E5%8B%92_%E6%AD%BB%E4%BA%A1%E4%B9%8B%E5%A4%9C%EF%BC%BB%E8%A7%92%E8%89%B2%E5%8A%87%E6%83%85%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E9%A6%AC%E8%8E%AB%E5%B0%BC%E5%8B%92_%E6%AD%BB%E4%BA%A1%E4%B9%8B%E5%A4%9C%EF%BC%BB%E8%AB%AE%E8%A9%A2%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//馬莫尼勒

  contentArr.push('<div class="title_text">夏天騎士</div> <p><span class="global_name_span">莎赫拉查德</span>為了拿到泳裝派對［安妮維斯小姐］的比賽獎勵［亞倫之淚］，心機地用［無限量牛排供應］吸引<span class="global_name_span">悠絲緹亞</span>參加。</p> <p>過程中<span class="global_name_span">悠絲緹亞</span>意外用竹籤將一座冰雕劈成兩半，那怪物般的力氣瞬間吸引在場眾人的目光。</p> <p>就在預賽結束後，一群自稱［搭訕高手］的變態在泳池到處尋找獵物，當中有個自稱最強男人的<span class="global_name_span">艾瑞克</span>，遇上這種事情，<span class="global_name_span">悠絲緹亞</span>一行人當然是替天行道，把這群人教訓一頓，這才知道原來這個<span class="global_name_span">艾瑞克</span>是假冒的，真實姓名叫做<span class="global_name_span">哀瑞克</span>，果然那個只知道變強的孤傲劍士，是不會隨便成為變態的。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E5%A4%8F%E5%A4%A9%E9%A8%8E%E5%A3%AB01%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>接著眾人又幫忙工作人員找客人手機，結果手機主人是<span class="global_name_span">愛麗潔</span>，她跟<span class="global_name_span">莎赫拉查德</span>是死對頭，兩人大吵一架之後，<span class="global_name_span">莎赫拉查德</span>順勢把手機丟進泳池中。</p> <p>為了取得［安妮維斯小姐］預賽結果，<span class="global_name_span">莎赫拉查德</span>率領夥伴打開藏有名單的保險箱，結果自己排名是倒數前幾位，看來比賽的希望全在<span class="global_name_span">悠絲緹亞</span>身上。</p> <p>結果半路殺出個<span class="global_name_span">安潔莉卡</span>，加上<span class="global_name_span">悠絲緹亞</span>的心思完全在［無限量牛排供應］上，最終寶石［亞倫之淚］被<span class="global_name_span">悠絲緹亞</span>當作毀壞預賽冰雕的賠償品，這讓<span class="global_name_span">莎赫拉查德</span>瞬間夢碎。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E5%A4%8F%E5%A4%A9%E9%A8%8E%E5%A3%AB02%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//夏天騎士
  contentArr.push('<div class="title_text">戲水女王</div> <p>身為校長的<span class="global_name_span">威廉明娜</span>精心為學生策劃迎接夏天的特別體驗營活動，希望能改變自己［鋼鐵校長］的形象，為了拉近與小孩的距離，<span class="global_name_span">威廉明娜</span>特別去找落單的學生講話，結果口氣太硬，反而嚇得學生落荒而逃。</p> <p><span class="global_name_span">芮彼泰雅</span>看到<span class="global_name_span">威廉明娜</span>的窘況，決定親自示範一次跟小孩親近的方法，於是拐跑幾個學生，帶他們去體驗水槍遊戲。</p> <p><span class="global_name_span">威廉明娜</span>為了找回學生，來到潑水節現場，被一群拿著水槍的怪男人圍住，就想用水槍將她全身弄濕，結果自然是被打了一頓，接著又遇到<span class="global_name_span">傑尼斯</span>，因為神色兇惡被當作壞人，兩人展開一場對決，但<span class="global_name_span">威廉明娜</span>實力超群，又成功獲得勝利，戰鬥後<span class="global_name_span">威廉明娜</span>拿出通行證，證明自己是教職員並不是壞人，了解情況後，<span class="global_name_span">傑尼斯</span>便與她一起去尋找亂跑的小孩。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%88%B2%E6%B0%B4%E5%A5%B3%E7%8E%8B01%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在追捕小孩的過程中，又遇到救生員<span class="global_name_span">內布利斯</span>，剛好她剛被小孩的水槍攻擊過，馬上幫兩人指引小孩的位置，可到達目的地又被那群水槍怪男人圍住，似乎他們的目標很明確就是<span class="global_name_span">威廉明娜</span>，不過下場依舊是被打得落荒而逃。</p> <p>最終一行人在潑水節的DJ舞台上，再次擊敗那群水槍怪男人，事後獲得小孩都跑到餐廳的情報。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%88%B2%E6%B0%B4%E5%A5%B3%E7%8E%8B02%EF%BC%BD%3A8?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>講到吃，<span class="global_name_span">悠絲緹亞</span>肯定不缺席，當一行人趕到時，就看到一群小孩與<span class="global_name_span">悠絲緹亞</span>開心的吃東西，這次終於將小孩都找回來。</p> <p>而那群水槍怪男人這時候又出現了，在<span class="global_name_span">威廉明娜</span>的威逼下，背後搞鬼的人即將浮出水面。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%88%B2%E6%B0%B4%E5%A5%B3%E7%8E%8B03%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>［比基尼獵人］<span class="global_name_span">伯克</span>終於現身，但他也不是真正的幕後黑手，藏更深的陰謀家正是副校長<span class="global_name_span">埃保尼</span>，她忌妒<span class="global_name_span">威廉明娜</span>年紀輕輕就獲得自己心心念念的校長位置，因此想要讓她出醜。</p> <p>結果戰鬥過程中，<span class="global_name_span">埃保尼</span>的水槍大砲失控，<span class="global_name_span">威廉明娜</span>用身體保護學生，英雄般的姿態讓學生們都將她視作偶像，副校長這一齣簡直是壞心辦好事，<span class="global_name_span">威廉明娜</span>終於突破與學生間那層隔閡，這場體驗營在DJ<span class="global_name_span">貝那卡</span>的氣氛帶領下，有了完美的落幕。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%88%B2%E6%B0%B4%E5%A5%B3%E7%8E%8B04%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//戲水女王
  contentArr.push('<div class="title_text">海邊天使</div> <p><span class="global_name_span">莎赫拉查德</span>為了取得比賽大獎魔十［赫拉火花］，又把腦筋動到<span class="global_name_span">泰瑞絲</span>身上，想以她令人乍舌的身材取得比賽優勢，但海灘卻出現一群黑衣人，自稱［暴露審查員］，他們推廣保守的黑衣制服，半強迫的讓人換上。</p> <p><span class="global_name_span">泰瑞絲</span>也被強迫誘惑換上，並且心智發生變化，彷彿邪教一樣，也要<span class="global_name_span">莎赫拉查德</span>穿上黑衣制服，還好後來的<span class="global_name_span">悠絲緹亞</span>與<span class="global_name_span">安潔莉卡</span>及時出手制止了她。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%B5%B7%E9%82%8A%E5%A4%A9%E4%BD%BF01%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>接著<span class="global_name_span">莎赫拉查德</span>一行人又加入DJ<span class="global_name_span">貝那卡</span>，大家一起從［暴露審查員］組織中救回<span class="global_name_span">泰瑞絲</span>，並且設計陷阱準備揪出幕後主謀。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%B5%B7%E9%82%8A%E5%A4%A9%E4%BD%BF02%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>主謀<span class="global_name_span">米卡埃拉</span>被眾人擊敗後，被強迫換上泳衣，沒想到這懲罰竟然激活她體內的暴露渴望，於是乎她又成為推廣暴露泳衣的邪教組織頭領。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BB%E6%B5%B7%E9%82%8A%E5%A4%A9%E4%BD%BF03%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//海邊天使
  contentArr.push('<div class="title_text">夢魘冬季</div> <p><span class="global_name_span">奧爾施塔因</span>檢驗完<span class="global_name_span">魯</span>的盔甲手套後，本想繼續原來的研究，這時候<span class="global_name_span">墨菲亞</span>帶著手下［墨海茲］部隊前來想搶奪研究成果，因為這項研究可以讓人脫離<span class="global_name_span">墨菲亞</span>的控制。</p> <p>但<span class="global_name_span">奧爾施塔因</span>寧死不屈，最後犧牲了，躲起來的<span class="global_name_span">魯</span>則投靠<span class="global_name_span">伊柯利普斯</span>，她們在酒吧中計畫著在<span class="global_name_span">墨菲亞</span>一年一度前來這城市的時機將她消滅，但這城市的所有人都被植入晶片，受到［精神控制器］的控制，所以第一步就是讓這機械失效。</p> <p><span class="global_name_span">魯</span>利用<span class="global_name_span">奧爾施塔因</span>留下的項鍊吸光充電站的電力，這樣［墨海茲］就不能為［精神控制器］充電了，另一方面這項鏈也是個強大的武器，當初只因為沒有足夠的電力才無法完成，這下只要持續吸光充電站電力，就能成為對付<span class="global_name_span">墨菲亞</span>的殺手鐧。</p> <div class="global_ps_text"> <p>這裡<span class="global_name_span">墨菲亞</span>想奪取的可能是<span class="global_name_span">奧爾施塔因</span>研究的項鍊，或是<span class="global_name_span">魯</span>本身。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%A4%A2%E9%AD%98%E5%86%AC%E5%AD%A301%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在作戰的過程中，<span class="global_name_span">魯</span>遇到曾經的同伴<span class="global_name_span">安柏</span>，當初她們兩個人被<span class="global_name_span">墨菲亞</span>抓起來研究，<span class="global_name_span">安柏</span>犧牲自己換取<span class="global_name_span">魯</span>逃跑的空間，自己卻被<span class="global_name_span">墨菲亞</span>完全控制住。</p> <p><span class="global_name_span">安柏</span>戰力強大，<span class="global_name_span">伊柯利普斯</span>只能解放潛藏在自己體內的黑暗力量將<span class="global_name_span">安柏</span>暫時擊敗，但自己短時間內也沒辦法再發出這股力量，這時<span class="global_name_span">墨菲亞</span>已經來到這城市。</p> <div class="global_ps_text"> <p><span class="global_name_span">墨菲亞</span>十分忌憚<span class="global_name_span">魯</span>身上［泰拉］力量。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%A4%A2%E9%AD%98%E5%86%AC%E5%AD%A302%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>最後眾人找上<span class="global_name_span">墨菲亞</span>，<span class="global_name_span">安柏</span>也擺脫<span class="global_name_span">墨菲亞</span>的控制成為戰力。</p> <p><span class="global_name_span">墨菲亞</span>強行使用［泰拉］的力量，想要跟眾人同歸於盡，<span class="global_name_span">奧爾施塔因</span>早就預料到這情況，<span class="global_name_span">魯</span>利用<span class="global_name_span">奧爾施塔因</span>留下的項鍊與盔甲手套成功消滅<span class="global_name_span">墨菲亞</span>，但<span class="global_name_span">魯</span>也因此力盡犧牲了。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%A4%A2%E9%AD%98%E5%86%AC%E5%AD%A303%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//夢魘冬季
  contentArr.push('<div class="title_text">記憶邊緣</div> <p><span class="global_name_span">羅安</span>救回一個神祕女人，之後她倆就一起在酒吧工作，女人被<span class="global_name_span">羅安</span>稱為姐姐，她的名字叫做<span class="global_name_span">墨菲亞</span>。</p> <p>這天<span class="global_name_span">墨菲亞</span>想準備送給<span class="global_name_span">羅安</span>的生日禮物，前往下層區域的垃圾場，這裡是上層人丟棄的垃圾的地方，裡面有許多超有價值的東西，但是也危機重重，稱為［清潔工］的機器人將下層人與垃圾視為清除對象，<span class="global_name_span">墨菲亞</span>不幸遇到［清潔工］，危急時刻<span class="global_name_span">羅安</span>爆發驚人的隱藏能力，將［清潔工］停止運作。</p> <p>雖然順利救回<span class="global_name_span">墨菲亞</span>，但是受到重創的她似乎體內產生某種重置機制，醒來完全變成另一個人，甚至操縱醫生給<span class="global_name_span">羅安</span>帶口信，要<span class="global_name_span">羅安</span>再次前往垃圾場找她。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E8%A8%98%E6%86%B6%E9%82%8A%E7%B7%A301%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>原來<span class="global_name_span">墨菲亞</span>本是［夢魘冬季］中登場的那個大魔王，為了以防萬一，製作一個備份的身體，如今這個身體終於甦醒，覺醒意識的<span class="global_name_span">墨菲亞</span>找上這城市的統治者<span class="global_name_span">伯克</span>，要借人型士兵重新建立自己的勢力收復原本的都市，但<span class="global_name_span">伯克</span>也是老狐狸，堅持要用<span class="global_name_span">羅安</span>當借兵條件。</p> <p><span class="global_name_span">羅安</span>擁有摧毀機械的力量，這對<span class="global_name_span">伯克</span>是隱患也是可利用的力量，前些日子<span class="global_name_span">羅安</span>在垃圾場摧毀［清潔工］讓<span class="global_name_span">伯克</span>產生忌憚，如今正要舉兵前往下層區域。</p> <p><span class="global_name_span">墨菲亞</span>深知接下來將會是慘烈的戰爭，可能是這段時間的相處，讓<span class="global_name_span">墨菲亞</span>產生憐憫之心，於是帶著<span class="global_name_span">伯克</span>的手下<span class="global_name_span">萊維亞</span>、<span class="global_name_span">盧班希亞</span>先行前往下層區域，想在戰爭發生前將<span class="global_name_span">羅安</span>救出來。</p> <p>就在<span class="global_name_span">墨菲亞</span>準備帶走<span class="global_name_span">羅安</span>時，<span class="global_name_span">萊維亞</span>兩人突然反水，原來<span class="global_name_span">伯克</span>早就洞悉<span class="global_name_span">墨菲亞</span>的用心，要兩人伺機奪走<span class="global_name_span">羅安</span>，結果三人激烈戰鬥後，全部重傷倒地。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E8%A8%98%E6%86%B6%E9%82%8A%E7%B7%A302%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">羅安</span>將三人送往醫院醫治，<span class="global_name_span">萊維亞</span>感恩之餘內心也發生轉變，至於<span class="global_name_span">墨菲亞</span>則在意識的世界與曾經的自己做思想抗爭，最後成功佔據身體的主導權。</p> <p>眾人齊心協力戰勝<span class="global_name_span">伯克</span>後，又重新回歸原本平靜的生活，只是曾經的<span class="global_name_span">墨菲亞</span>意識仍在蠢蠢欲動，等待將來某個時機點再次興風作浪。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E8%A8%98%E6%86%B6%E9%82%8A%E7%B7%A303%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//記憶邊緣
  contentArr.push('<div class="title_text">慾火融雪兔女郎</div> <p>［雪兔小鎮］的寒氣被冰雪女王收走，這導致她們吃不到喜愛的冰甜點，於是鎮民組織抗議隊伍前往［冰雪城］抗議，但是在強大的武力面前，鎮民終究是弱勢，這時<span class="global_name_span">傑尼斯</span>這一行來自［童話小鎮］的訪客路見不平，出手幫助村民。</p> <p><span class="global_name_span">傑尼斯</span>英勇的表現更被鎮民當作傳說中的［雪兔英雄］，還好村長<span class="global_name_span">達麗安</span>算是明事理，總算是解除誤會，只是<span class="global_name_span">傑尼斯</span>被鎮民的熱情感染，決定要幫助她們奪回寒氣。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E6%85%BE%E7%81%AB%E8%9E%8D%E9%9B%AA%E5%85%94%E5%A5%B3%E9%83%8E01%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>大家為了方便潛入行動，決定只組成四人小隊，藉著<span class="global_name_span">提爾</span>的誘餌計畫，順利進入［冰雪城］，但是中途<span class="global_name_span">達麗安</span>被神秘的力量迷惑，導致眾人準備破壞［冰之水晶］奪回寒氣時，失手被捕下獄。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E6%85%BE%E7%81%AB%E8%9E%8D%E9%9B%AA%E5%85%94%E5%A5%B3%E9%83%8E02%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>還好監獄的房間是用冰做成的，<span class="global_name_span">傑尼斯</span>等人用炙熱的體溫終於突破監獄的防衛，這次眾人直面冰雪女王<span class="global_name_span">威廉明娜</span>並且將之擊敗，這下才知道一切的罪魁禍首都是［冰之水晶］。</p> <p>［冰之水晶］是另一個世界的東西，目的就是奪取這世界一切有魔力的東西，冰雪女王也是被迷惑才會做出奪走寒氣的行為，如今終於從中解放出來，只是［冰之水晶］的危機並沒有解除，它的下一個目標可能是［童話小鎮］。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E6%85%BE%E7%81%AB%E8%9E%8D%E9%9B%AA%E5%85%94%E5%A5%B3%E9%83%8E03%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//慾火融雪兔女郎
  contentArr.push('<div class="title_text">郵輪協議</div> <p>傭兵團［R隊］正在郵輪上執行［VIP守護］的任務，<span class="global_name_span">店長</span>被半強迫加入這個隊伍，這次的任務將由客戶對各成員評分，這勝負將決定下一任的隊長誰來當。</p> <p>保護對象是一個小女孩，身分是［克拉肯股份公司］的［CEO］孫女，有兩個不同顏色的瞳孔，背了一個黃色大背包，特徵十分明顯。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E9%83%B5%E8%BC%AA%E5%8D%94%E8%AD%B001%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>［R隊］成員展開渾身解數討好小女孩，<span class="global_name_span">盧班希亞</span>帶她體驗水上摩托，害小女孩嚇得眼淚都飆出來，這時章魚海盜團登上郵輪，眾人立馬進入戰鬥狀態，海盜團的目標明顯是小女孩，為了安撫她，<span class="global_name_span">葛蘭西特</span>提議玩［醫生遊戲］，接著就一臉陰沉地拿出針筒，小女孩又被嚇哭了。</p> <p>這動靜引來海盜團成員的圍攻，因為人數眾多，<span class="global_name_span">盧班希亞</span>自願留下斷後，本來其他人要前往避難室，但<span class="global_name_span">葛蘭西特</span>是個路痴，把大家帶到海盜團面前，逼於無奈順便贖罪，<span class="global_name_span">葛蘭西特</span>只能留下阻擋追擊。</p> <p><span class="global_name_span">涅肯達莉亞</span>帶著小女孩躲到一般客房，這才發現小女孩背包裡藏著一隻小章魚。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E9%83%B5%E8%BC%AA%E5%8D%94%E8%AD%B002%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>就是這隻小章魚才引來章魚海盜團，原來章魚叫做<span class="global_name_span">奧克托比烏斯五世</span>，原本也是海盜團的成員，跟小女孩相遇後成為朋友，總之最後小女孩與海盜團化敵為友，並且與團長<span class="global_name_span">馬莫尼勒</span>約定總有一天會再重逢。</p> <p>結局得知小女孩名字叫做<span class="global_name_span">莉維黛爾</span>，並且長大後也與<span class="global_name_span">奧克托比烏斯五世</span>再重逢，而［R隊］的新隊長由<span class="global_name_span">涅肯達莉亞</span>這個從一開始就冷冰冰不加入爭取高分行列的人獲得，只憑著沒感情的裝鬼臉式微笑就獲得滿分。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8D%A1%E5%B8%B6%EF%BC%BB%E9%83%B5%E8%BC%AA%E5%8D%94%E8%AD%B003%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//郵輪協議

  contentArr.push('<div class="title_text">派對結束了然而、這是誤會傑尼斯、必須解開誤會</div><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2FSUMMER_KNIGHT01%EF%BC%BB%E6%B4%BE%E5%B0%8D%E7%B5%90%E6%9D%9F%E4%BA%86%E7%84%B6%E8%80%8C%E3%80%81%E9%80%99%E6%98%AF%E8%AA%A4%E6%9C%83%E5%82%91%E5%B0%BC%E6%96%AF%E3%80%81%E5%BF%85%E9%A0%88%E8%A7%A3%E9%96%8B%E8%AA%A4%E6%9C%83%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><div class="title_text">狐狸般的女子、把我的章魚還來、引誘奧克托比烏斯大作戰</div><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2FSUMMER_KNIGHT02%EF%BC%BB%E7%8B%90%E7%8B%B8%E8%88%AC%E7%9A%84%E5%A5%B3%E5%AD%90%E3%80%81%E6%8A%8A%E6%88%91%E7%9A%84%E7%AB%A0%E9%AD%9A%E9%82%84%E4%BE%86%E3%80%81%E5%BC%95%E8%AA%98%E5%A5%A7%E5%85%8B%E6%89%98%E6%AF%94%E7%83%8F%E6%96%AF%E5%A4%A7%E4%BD%9C%E6%88%B0%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><div class="title_text">讓我來解決、拜託再多拿點走</div><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2FSUMMER_KNIGHT03%EF%BC%BB%E8%AE%93%E6%88%91%E4%BE%86%E8%A7%A3%E6%B1%BA%E3%80%81%E6%8B%9C%E8%A8%97%E5%86%8D%E5%A4%9A%E6%8B%BF%E9%BB%9E%E8%B5%B0%EF%BC%BD%3Ad?r=3hmZA94HpFeDm1kk9EMY19J1AY7ny9uR" allowfullscreen></iframe></p>');//SUMMER_KNIGHT

  contentArr.push('<div class="title_text">GOING HOME</div> <p>女武神<span class="global_name_span">奧利維爾</span>奉女神<span class="global_name_span">弗雷萊亞</span>的命令來到地上拯救精靈王國，遇到人類小孩<span class="global_name_span">漢森</span>，他懂得運用魔力，於是兩人結伴前往精靈王國。</p> <p>路上兩人發現［黑魔法師們］運用魔力枯竭的方式，讓精靈窒息走向毀滅，<span class="global_name_span">漢森</span>使用魔力絲線就了即將窒息的精靈公主<span class="global_name_span">芮彼泰雅</span>，同時遇上［葛洛提］的女王<span class="global_name_span">葛拉娜德</span>，四人就這樣結伴繼續前往精靈王國。</p> <p>然而最終［黑魔法師們］運用大型魔力裝置，降低空氣中的魔力濃度，［精靈王國］迎來滅亡的結局，而<span class="global_name_span">奧利維爾</span>受到［泰拉］的侵蝕，受到汙染的她只能將窒息昏迷的<span class="global_name_span">芮彼泰雅</span>交給夥伴，自己獨自隱居起來。</p> <p>過了許久時間，<span class="global_name_span">芮彼泰雅</span>在<span class="global_name_span">漢森</span>不停灌注魔力的努力下終於甦醒，但卻引來［黑魔法師們］的再度來襲，<span class="global_name_span">葛拉娜德</span>連忙派出許多［葛洛提］尋找<span class="global_name_span">奧利維爾</span>前來救援，雖然因為［泰拉］侵蝕而無法施展全力，但在成年的<span class="global_name_span">漢森</span>幫助下，眾人再次擊退［黑魔法師們］。</p> <p>為了保護<span class="global_name_span">芮彼泰雅</span>，<span class="global_name_span">奧利維爾</span>與<span class="global_name_span">漢森</span>決定離開已經暴露的［葛洛提］森林，再次與<span class="global_name_span">芮彼泰雅</span>踏上旅途。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BBGOING-HOME01%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><p>隨著幾年的相處，<span class="global_name_span">漢森</span>與<span class="global_name_span">奧利維爾</span>成為伴侶，並且準備迎接新生命的誕生，兩人將這孩子取名為<span class="global_name_span">悠絲緹亞</span>。</p> <p>但幸福的日子並沒有持續多久，［黑魔法師們］再次找上門來，<span class="global_name_span">漢森</span>在這次的襲擊中失去生命，<span class="global_name_span">奧利維爾</span>也因為情緒波動導致［泰拉］失控，尚未出生的<span class="global_name_span">悠絲緹亞</span>也因此遭到［泰拉］汙染。</p> <p><span class="global_name_span">葛拉娜德</span>為<span class="global_name_span">奧利維爾</span>找了一個隱蔽的小村落居住，<span class="global_name_span">奧利維爾</span>在這生下<span class="global_name_span">悠絲緹亞</span>，然而突然出現的［黑暗女武神］以及之後為了壓制<span class="global_name_span">悠絲緹亞</span>被［泰拉］侵蝕的事件，讓<span class="global_name_span">奧利維爾</span>失去生命，就當她意識逐漸模糊之際，神秘的男人<span class="global_name_span">阿札爾</span>將她帶回現世，並且將她化為使者<span class="global_name_span">卡爾利恩</span>，一個單純聽命於自己的工具。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832%EF%BC%BBGOING-HOME02%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></iframe></p>');//GOING HOME

  contentArr.push('<div class="title_text">Crossroads</div><p><span class="global_name_span">悠絲緹亞</span>為了擊倒夢境主人<span class="global_name_span">伊蓓羅雅</span>前往夜世界，被［泰拉］污染的<span class="global_name_span">莎赫拉查德</span>決定前往［魔塔］向<span class="global_name_span">伊柯利普斯</span>求教控制［泰拉］的方法，最後在與使者<span class="global_name_span">墨菲亞</span>的對練中成功控制［泰拉］，展現出來的天賦與力量讓在場眾人都十分驚訝。</p> <div class="global_ps_text"> <p>這段劇情的重點大概就是<span class="global_name_span">伊柯利普斯</span>敘述的那段歷史，古代的魔法師為了奪取神力，創造出［泰拉］與［夜世界］，［夜世界］與地表曾經發生兩次戰爭，諸神為了消滅［夜世界］幾乎團滅，但即便殲滅了所有古代魔法師卻沒辦法消滅［泰拉］，唯一的辦法只有摧毀連通兩世界的通道，並且將［夜世界］封印。</p> <p>但［泰拉］的存在，在［夜世界］催生出很多暗黑種族，建立了五個國度［墮天使之地-雷文］、［吸血鬼之地-圖亞爾］、［惡魔之地-凱那爾］、［不死生物之地-塔洛斯］、［夢魔之地-莉亞席爾］，最終［凱那爾］的<span class="global_name_span">萊維亞</span>找到破除封印的方法，於是與地表發生第二次大戰，最後是人類與半神合作將暗黑種族趕回［夜世界］，但若不是地表沒有充沛［泰拉］的緣故，失去大部分神族力量的地表肯定沒有贏的可能。</p> </div><p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E6%B4%BB%E5%8B%95%E5%8A%87%E6%83%85%EF%BC%BBCrossroads%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');

%E9%8E%AE%E5%A3%93%E8%A1%8C%E5%8B%95%EF%BC%BD%3A4?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//傑登之門
  contentArr.push('<div class="title_text">大逃脫</div> <p>老闆<span class="global_name_span">格雷</span>瞞著偶像們，私自耗盡資源，只為了準備給偶像的表演舞台，但要是這次失敗，大家都會沒飯吃。</p> <p>正當大家準備離開辦公室前往表演舞台時，突然大樓的電梯壞掉，裡面還散發出詭異的黑霧，逼不得以大家只能走樓梯，但大樓的三樓竟然充滿怪物與惡魔，門還都鎖了起來，費盡周折才來到二樓。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E9%81%8A%E6%88%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%A4%A7%E9%80%83%E8%84%AB01%EF%BC%BD%3A9?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>二樓情況也沒好多少，也是充滿敵人，但牠們似乎挺好打發的，<span class="global_name_span">海倫娜</span>等三人歌唱表演一番，怪物們就心滿意足的離去。</p> <p>本以為來到一樓一切就結束了，但大門竟然鎖了起來，還出現冒充<span class="global_name_span">艾尼爾</span>的惡魔，但終究夥伴間知根知底，<span class="global_name_span">格雷</span>他們最終還是識破冒牌貨，這時一切怪物的源頭終於出現，是一個巨大的惡魔兔子娃娃，祂一邊實現眾人的願望，一邊將眾人困在大樓內成為祂的食糧，擊敗惡魔兔子後，祂使出最後一招，要利用直播將偶像們的裸體放送出去，但<span class="global_name_span">格雷</span>衝上前擋在偶像面前，替她們阻擋這裸體的詛咒。</p> <p>結果一絲不掛的<span class="global_name_span">格雷</span>非但沒有慌張，反而盡情的熱舞起來，光芒萬丈的熱情，竟然淨化了惡魔兔子，之後偶像們順利完成了舞台表演，只是<span class="global_name_span">格雷</span>裸舞的直播事後被新聞媒體大肆報導，可能他本人需要低調一陣子了。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E9%81%8A%E6%88%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%A4%A7%E9%80%83%E8%84%AB02%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//大逃脫
  contentArr.push('<div class="title_text">魯的迷宮</div> <p>童話世界的神祕力量突然消失，大家推測是因為［魔法樹］枯萎的影響，而造成這一切的肯定是森林中的<span class="global_name_span">薑餅人魔女</span>，於是<span class="global_name_span">小紅帽魯</span>自告奮勇前往森林談判。</p> <p>路上找上曾經住在森林的<span class="global_name_span">白雪公主班塔納</span>，接著又在森林中遇到<span class="global_name_span">羅賓漢傑尼斯</span>，她們兩個有著複雜的關係，<span class="global_name_span">白雪公主班塔納</span>一直防範著想刺殺自己的<span class="global_name_span">羅賓漢傑尼斯</span>，但表面看來<span class="global_name_span">羅賓漢傑尼斯</span>是有難言之隱的，總之三人結伴一起前往［薑餅屋］。</p> <p>［薑餅屋］外已經有人到達，是［撲克牌王國］的女王<span class="global_name_span">愛麗絲克蕾西亞</span>，<span class="global_name_span">薑餅人魔女</span>被她威脅的語氣嚇得不敢出門，大家見狀就跟她展開戰鬥，落敗的<span class="global_name_span">愛麗絲克蕾西亞</span>馬上就被士兵背叛，因為［撲克牌王國］尊崇強者，所以敗者沒有資格領導他們。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E9%81%8A%E6%88%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E9%AD%AF%E7%9A%84%E8%BF%B7%E5%AE%AE01%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">薑餅人魔女</span>在<span class="global_name_span">小紅帽魯</span>的勸說下終於開門，為了得知神秘力量消失的原因，大家前往<span class="global_name_span">愛麗絲克蕾西亞</span>的花園尋找正在枯萎的花朵，正好遇上一群［撲克牌王國］的士兵，他們已經重新另立國王，是一個躲在巨大玩偶身體裡的怪物<span class="global_name_span">伯克</span>。</p> <p><span class="global_name_span">伯克</span>一口就將花園裡還正常的花全吃光，這下<span class="global_name_span">愛麗絲克蕾西亞</span>跟他的仇結大了。</p> <p>眾人回頭找<span class="global_name_span">薑餅人魔女</span>得知神秘力量消失的原因是吸收了過多的砂糖，為此必須收集［精靈之泉的水］與［苦澀澀蘑菇］來製作池塘的淨化劑，尋找過程中得知<span class="global_name_span">羅賓漢傑尼斯</span>曾經奉王后命令要刺殺<span class="global_name_span">白雪公主班塔納</span>，可是自己曾經發過誓言要守護公主，所以就一直假意刺殺，實際上是怕王后另外派殺手過來，兩人誤會解開以後，材料也都找齊了，可<span class="global_name_span">薑餅人魔女</span>卻消失了，只留下了淨化劑的製作方法。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E9%81%8A%E6%88%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E9%AD%AF%E7%9A%84%E8%BF%B7%E5%AE%AE02%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>淨化劑製作完成後，眾人來到池塘，在這一切謎題都解開了，原來是一開始<span class="global_name_span">伯克</span>為了吃餅乾甜點，誘騙<span class="global_name_span">薑餅人魔女</span>製作了藥劑，才讓池塘水變甜。</p> <p>擊敗<span class="global_name_span">伯克</span>後，他變成一副弱小可愛的樣子，再也不能作惡，<span class="global_name_span">薑餅人魔女</span>也獲得諒解，與村子的人化敵為友，大家還幫忙她修復被<span class="global_name_span">伯克</span>吃得亂七八糟的薑餅屋，童話世界又恢復了和平。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E9%81%8A%E6%88%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E9%AD%AF%E7%9A%84%E8%BF%B7%E5%AE%AE03%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//魯的迷宮
  contentArr.push('<div class="title_text">劍傳</div> <p>劍后<span class="global_name_span">席比雅</span>在［馭劍團］手中救了一個妖怪小孩<span class="global_name_span">尤里</span>，在她的身上<span class="global_name_span">席比雅</span>看到自己去世妹妹<span class="global_name_span">露比雅</span>的影子，而<span class="global_name_span">尤里</span>因為崇拜救命恩人，所以善自稱<span class="global_name_span">席比雅</span>為師父。</p> <p>雖然<span class="global_name_span">席比雅</span>不太情願，但還是在旅程中教導<span class="global_name_span">尤里</span>一些武術上的心法，在一個家廟前，兩人遇到前來找<span class="global_name_span">尤里</span>的<span class="global_name_span">達菲</span>，<span class="global_name_span">達菲</span>對人類並沒有好感，隨即帶著<span class="global_name_span">尤里</span>進入家廟。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%8A%8D%E5%82%B301%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">席比雅</span>跟著穿過家廟，來到妖怪的世界，原來［馭劍團］覬覦妖怪的妖魂力量，所以進入妖界殘害善良的妖怪，這裡如今布滿異形劍士，到處充滿危機，三人在妖怪小鎮救了一個大叔，本想帶他離開妖界，卻在通道處遇到無名道士<span class="global_name_span">納羅達斯</span>率領［馭劍團］阻擋，雙方交手一陣之後，<span class="global_name_span">納羅達斯</span>留下一個名字［盧修斯］之後便離去。</p> <p><span class="global_name_span">席比雅</span>顯然對［盧修斯］這名字十分在意，一回到人界就開始打聽道士的行蹤。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%8A%8D%E5%82%B302%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>原來<span class="global_name_span">盧修斯</span>就是創立［馭劍團］的人，他曾經敗在<span class="global_name_span">席比雅</span>手上，因為被善良的妖怪所救，無意中發現妖魂的力量，所以成立［馭劍團］開始狩獵妖怪，<span class="global_name_span">納羅達斯</span>是個半妖，為了擊敗他才委身在［馭劍團］，如今看到曾經擊敗<span class="global_name_span">盧修斯</span>的<span class="global_name_span">席比雅</span>覺得時機到了，就加入眾人隊伍向<span class="global_name_span">盧修斯</span>發起決戰。</p> <p><span class="global_name_span">盧修斯</span>吸納了大量的妖魂之力，已經達到以氣馭劍的境界，但<span class="global_name_span">席比雅</span>以心馭劍，以守護同伴催發自身潛力，達到心劍境界，最終擊敗<span class="global_name_span">盧修斯</span>，為自己妹妹<span class="global_name_span">露比雅</span>報仇。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%8A%8D%E5%82%B303%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//劍傳
  contentArr.push('<div class="title_text">合龍傳</div> <p>故事發生在［龍恩鄉］，帶有［金龍的恩惠］的［如意珠］失竊，犯人正好被來這參加慶典的<span class="global_name_span">席比雅</span>三人撞上，對方是［魔教］的成員，戰鬥在店小二<span class="global_name_span">海倫娜</span>與［天守宮］少宮主<span class="global_name_span">克蕾西亞</span>的幫助下，成功將［魔教］成員擊敗，但因為其中一人還是帶著［如意珠］逃跑，所以大家都被當作目擊者，被帶回［天守宮］問話。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%90%88%E9%BE%8D%E5%82%B301%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">天守宮主</span>看出<span class="global_name_span">席比雅</span>幾人擁有不凡的實力，既然敵人是［魔教］，而且［如意珠］關乎［龍恩鄉］的存亡，<span class="global_name_span">天守宮主</span>就拜託眾人與<span class="global_name_span">克蕾西亞</span>一起對付［魔教］<span class="global_name_span">天魔</span>。</p> <p>但<span class="global_name_span">克蕾西亞</span>十分傲氣，看不起內功不如自己的人，對只修練外功的<span class="global_name_span">海倫娜</span>也十分輕視，這態度惹得<span class="global_name_span">達非</span>很不爽，兩人還因此大吵一架。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%90%88%E9%BE%8D%E5%82%B302%EF%BC%BD%3A4?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>為了蒐集關於［魔教］的情報，大家找上［丐幫］，並且用武力從分舵主那得到情報，接著大家就前往野外的蘆葦叢，果然遇到［魔教］的成員，擊敗小嘍囉後，具有強大力量的<span class="global_name_span">天魔</span>現身了。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%90%88%E9%BE%8D%E5%82%B303%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>雖然<span class="global_name_span">天魔</span>實力強大，但畢竟有［天下第一劍］的劍后<span class="global_name_span">席比雅</span>在場，可大家擊敗<span class="global_name_span">天魔</span>後發現［如意珠］竟然是假的，趕回［龍恩鄉］後竟看到村民與武林人士都倒在地上，內力全無。</p> <p>原來這一切都是<span class="global_name_span">天守宮主</span>所為，她引來［魔教］與<span class="global_name_span">天魔</span>當誘餌，引走具有實力的<span class="global_name_span">席比雅</span>一行人，自己則用真正的［如意珠］加上［吸星大法］將全村人的內功搶走，只為了讓自己羽化成仙，達成［天守氣法］最高境界。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%90%88%E9%BE%8D%E5%82%B304%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">天守宮主</span>的內力已經曠古鑠今，大家紛紛被打趴在地，危急時刻<span class="global_name_span">克蕾西亞</span>領悟［天守氣法］真正奧義，將自己的氣脈與<span class="global_name_span">海倫娜</span>連結在一起，達成陰陽調和，無邊無盡的最高境界，終於將<span class="global_name_span">天守宮主</span>打敗。</p> <p>事後<span class="global_name_span">克蕾西亞</span>繼承［天守宮］宮主之位，［金龍的恩惠］再度澤潤這片山村大地。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2F%E8%A7%92%E8%89%B2%E5%8D%A1%E5%B8%B6%EF%BC%BB%E5%90%88%E9%BE%8D%E5%82%B305%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//合龍傳

  contentArr.push('<div class="title_text">CH01 血騎士</div> <p>主角<span class="global_name_span">拉德爾</span>是［盧戈鎮］的採藥人，為了替義妹<span class="global_name_span">米莎</span>尋找母親的遺物項鍊，被黑魔法師襲擊，還好遇到外號［皎潔死神］的騎士<span class="global_name_span">悠絲緹亞</span>解圍而因此得救。</p> <p><span class="global_name_span">悠絲緹亞</span>此行是因為聽聞［盧戈鎮］有治百病的草藥，或許與黑魔法師有關，而<span class="global_name_span">悠絲緹亞</span>的目的就是剿滅這些禍害。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH01%EF%BC%BB%E8%A1%80%E9%A8%8E%E5%A3%AB01%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>找尋黑魔法師的過程中，發現所謂治百病的草藥其實含有黑魔法的詛咒，吃下去的人會變成不死生物，許多冒險者都因此中招犧牲，而這一切都是<span class="global_name_span">拉德爾</span>的養父也就是［盧戈鎮］的村長所為，他不僅設下詛咒陷害尋找草藥的冒險者，而對自己的女兒<span class="global_name_span">米莎</span>下毒手，<span class="global_name_span">米莎</span>的怪病就是黑魔法的詛咒，<span class="global_name_span">拉德爾</span>身上的［血刻印］則是村長想要完成的目標。</p> <p>最終村長被眾人擊敗化為灰燼，可惜<span class="global_name_span">米莎</span>因為被抽取［泰拉］而失去生命，為了防止類似悲劇再度發生，<span class="global_name_span">拉德爾</span>決定跟著<span class="global_name_span">悠絲緹亞</span>踏上討伐黑魔法師的旅途。</p> <div class="global_ps_text"> <p><span class="global_name_span">拉德爾</span>的［血刻印］擁有強大的癒合能力，<span class="global_name_span">悠絲緹亞</span>頭上生角，有吸血的衝動，似乎可以透過吸食<span class="global_name_span">拉德爾</span>的血液獲得強大的力量。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH01%EF%BC%BB%E8%A1%80%E9%A8%8E%E5%A3%AB02%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><img src="https://drive.google.com/thumbnail?id=1g6nwKZ587ahGySRJJk5pwAaSx7mWzuIu&sz=w500" /></p> <div class="title_text">褐炭傳說</div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%   contentArr.push('<div class="title_text">CH02 蒼藍魔女</div> <p><span class="global_name_span">悠絲緹亞</span>與<span class="global_name_span">拉德爾</span>來到礦山鎮［達雷普］尋找被稱為［蒼藍魔女］的<span class="global_name_span">莎赫拉查德</span>，不過鎮上的村民對她的印象可不太好，好不容易才得知她在封鎖的礦山。</p> <p>進入礦山後，一群來歷不明的士兵與不死生物在裡面把守，探索過程中意外收服了不死生物<span class="global_name_span">威格</span>，祂可是爆破專家，在祂的協助下終於找到<span class="global_name_span">莎赫拉查德</span>。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH02%EF%BC%BB%E8%92%BC%E8%97%8D%E9%AD%94%E5%A5%B301%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>既然出現［不死生物］，鎮上發生的事情肯定與黑魔法師有關，在調查的過程中，眾人揭發高利貸挪用物資的惡行，接著進入礦山尋找被士兵帶走的醫生<span class="global_name_span">雷南特</span>，一路抵達礦山深處，發現<span class="global_name_span">德溫貴族</span>、<span class="global_name_span">羅坦軍閥</span>、［貝克王族］的兩位公主<span class="global_name_span">米沃什</span>、<span class="global_name_span">米拉耶</span>正在進行密談，雖然沒聽到重要內容，但一定是見不得光的事情，眾人隨即遭到攻擊。</p> <p>就在處理完第一波敵人時，一個弓箭手突然闖入向<span class="global_name_span">悠絲緹亞</span>發出毒箭，權貴們則趁隙逃跑，眾人回到鎮上後，<span class="global_name_span">悠絲緹亞</span>一直昏迷不醒，<span class="global_name_span">拉德爾</span>想到之前<span class="global_name_span">悠絲緹亞</span>喝了自己的血突然獲得強大力量，於是抱著死馬當活馬醫的心態，將自己的血餵給她，果然成功讓<span class="global_name_span">悠絲緹亞</span>甦醒。</p> <p>在<span class="global_name_span">雷南特</span>醫生的分析下，得知毒箭使用名叫［阿德林］的毒藥，中毒者將轉化為不死生物，這樣的藥肯定有專屬的銷售渠道，循線或許能找到幕後黑手，於是<span class="global_name_span">悠絲緹亞</span>一行人準備前往傭兵城市［布倫］調查，而<span class="global_name_span">莎赫拉查德</span>失蹤的姊姊<span class="global_name_span">泰瑞絲</span>可能與黑魔法師有關，因為目的相同，所以<span class="global_name_span">莎赫拉查德</span>也加入隊伍。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH02%EF%BC%BB%E8%92%BC%E8%97%8D%E9%AD%94%E5%A5%B302%EF%BC%BD%3Af?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <div class="title_text">威格</div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH02%E6%94%AF%E7%B7%9A%EF%BC%BB%E5%A8%81%E6%A0%BC%EF%BC%BD%3A9?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH02 蒼藍魔女
  contentArr.push('<div class="title_text">CH03 迷霧神射手</div> <p>到了傭兵城市［布倫］後，發現商店正在出售<span class="global_name_span">莎赫拉查德</span>遺失的魔石，循著這條線索推測之前使用毒箭的弓箭手叫做<span class="global_name_span">格雷</span>，人稱［迷霧神射手］。</p> <p>在城鎮四處打探，找到<span class="global_name_span">格雷</span>的妹妹<span class="global_name_span">維尼爾</span>，她是個盜賊，從她對哥哥的認識，<span class="global_name_span">格雷</span>是絕對不會跟黑魔法師合作，要知道事情的原委，還是得先找到本人。</p> <p>在<span class="global_name_span">維尼爾</span>的協助下，終於在下水道找到<span class="global_name_span">格雷</span>，他也正在找販賣［阿德林］的商人，之前會對<span class="global_name_span">悠絲緹亞</span>攻擊，純粹是受到別人的委託，而那時他以為手中毒藥只是普通的安眠藥。</p> <p>雖然曾經是敵人，但如今目標都是幕後的黑魔法師，於是<span class="global_name_span">格雷</span>加入隊伍，在下水道深處找到［阿德林］的實驗區域，還看見<span class="global_name_span">格雷</span>的朋友<span class="global_name_span">克勞</span>被變成［不死生物］，親手結束摯友的痛苦後，眾人決定先將此處倖存的傷者帶回城鎮，準備充足之後再次探索。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH03%EF%BC%BB%E8%BF%B7%E9%9C%A7%E7%A5%9E%E5%B0%84%E6%89%8B01%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>到了下水道深處，終於找到罪魁禍首<span class="global_name_span">巫妖克雷德曼</span>，他認為［不死生物］是種進化，於是將［阿德林］改良，以便於散播出去，擊敗他後，整件事情由傭兵公會接手，開始回收被當作安眠藥的［阿德林］。</p> <p>而之前委託<span class="global_name_span">格雷</span>攻擊<span class="global_name_span">悠絲緹亞</span>的報酬已經送來公會，聽櫃台說才剛送來不久，眾人隨即追了上去，但對方是個身手敏捷的獸人女孩，一溜煙就消失的無影無蹤，眾人決定追上去，與委託人當面對質，解開他襲擊<span class="global_name_span">悠絲緹亞</span>的動機之謎。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH03%EF%BC%BB%E8%BF%B7%E9%9C%A7%E7%A5%9E%E5%B0%84%E6%89%8B02%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p><div class="title_text">和蝴蝶結一起消失</div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH03%E6%94%AF%E7%B7%9A%EF%BC%BB%E5%92%8C%E8%9D%B4%E8%9D%B6%E7%B5%90%E4%B8%80%E8%B5%B7%E6%B6%88%E5%A4%B1%EF%BC%BD%3A9?r=9ciUzmJiVS1PVirDyZvb38HDaHahdDkb" allowfullscreen></iframe></p>');//CH03 迷霧神射手
  contentArr.push('<div class="title_text">CH04 眼鏡與貓</div> <p>開頭是一段<span class="global_name_span">格雷</span>回憶過去的片段，他的父親與弟弟正在屠殺居民，厭惡這種行為的他，因為年幼無力，只能趁亂救走兩個少女。</p> <p>回說現在，一行人追著獸人少女來到峽谷鎮［凱洛］，一隻會說話的貓突然出現留下訊息，眾人還沒搞清楚狀況，貓就消失了，追蹤貓的蹤跡發現一個正在哭泣的小孩，旁邊是個穿紅色斗篷的男人，因為他把小孩手中的藥瓶撞碎，現在正在苦惱怎麼安撫，還好遇到<span class="global_name_span">拉德爾</span>這個採藥人，聞了下地下殘留的藥液，隨即又做出同款藥品，紅色斗篷的男人為了感謝，就將逃跑貓的蹤跡告訴眾人，並且表示有恩必報。</p> <p>循著線索，一行人來到山上的空屋，發現屋主正進行抑制黑魔法的研究，同時發現被魔獸襲擊的獸人少女，救下少女並且給她好吃好喝後，得知她叫做<span class="global_name_span">魯</span>，而那屋子的主人<span class="global_name_span">奧爾施塔因</span>因為生病危在旦夕，<span class="global_name_span">魯</span>便請求眾人幫忙救救他。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH04%EF%BC%BB%E7%9C%BC%E9%8F%A1%E8%88%87%E8%B2%9301%EF%BC%BD%3A0?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>再次上山，路上已經啟動許多防禦用的魔力牆，在<span class="global_name_span">魯</span>的幫助下，終於解開所有裝置，然而屋子前站著的<span class="global_name_span">奧爾施塔因</span>明顯已經不死生物化，戰鬥過程中發現他仍然保有意識，於是<span class="global_name_span">拉德爾</span>決定餵他自己的血試試，結果奇蹟地將<span class="global_name_span">奧爾施塔因</span>恢復成正常人。</p> <p>恢復體力後，<span class="global_name_span">奧爾施塔因</span>開始敘述整件事情，他長期以來都在跟魔法師對抗，遭到各種詛咒攻擊，直到最近他發現黑魔法師們盯上了有［血刻印］的<span class="global_name_span">拉德爾</span>，他的血有神奇的力量，能增強受詛咒人的力量，甚至去除［阿德林］這種毒，為了驗證真實性，才會委託<span class="global_name_span">格雷</span>將沾有［阿德林］的毒箭射向<span class="global_name_span">悠絲緹亞</span>，雖然聽起來有點胡來，但<span class="global_name_span">奧爾施塔因</span>本人相信事情的發展會如自己預想一樣，眾人皆能安然無恙。</p> <p>為了補償，<span class="global_name_span">奧爾施塔因</span>今後會與眾人共享情報，並且提議擊退如今潛藏在山上的黑魔法師組織［科庫托斯］。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH04%EF%BC%BB%E7%9C%BC%E9%8F%A1%E8%88%87%E8%B2%9302%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>上山的路上，<span class="global_name_span">奧爾施塔因</span>說出<span class="global_name_span">魯</span>的身世，她是［科庫托斯］的實驗體，被逼喝下［阿德林］來進行實驗，<span class="global_name_span">奧爾施塔因</span>為了救她強行將［阿德林］吸出，這才會中了毒。</p> <p>現在想起來，［科庫托斯］肯定是為了回收<span class="global_name_span">魯</span>才會派人來到這，在敵人據點遇到跟<span class="global_name_span">魯</span>一樣遭遇的<span class="global_name_span">安柏</span>，她忠於組織並且固執地要用武力將<span class="global_name_span">魯</span>奪回，這一切都是因為組織有力量強大的五位［使者］，只有成為［使者候補］進而成為［使者］才是脫離實驗體悲劇的唯一方法，就在<span class="global_name_span">安柏</span>戰敗岌岌可危之時，［使者］之一的<span class="global_name_span">布萊德</span>透過［次元門］現身，強大的實力瞬間壓制在場眾人，眼看就要團滅時，之前遇到的紅色斗篷男人出手擋住<span class="global_name_span">布萊德</span>，給眾人製造逃跑的機會。</p> <p>逃回鎮上的一行人推測［科庫托斯］竟然出動［使者］，目的顯然不是<span class="global_name_span">魯</span>，而是有［血刻印］的<span class="global_name_span">拉德爾</span>，要對付這麼強大的組織，必須集結更多的力量，於是<span class="global_name_span">奧爾施塔因</span>提議聯手，並且請一行人前往［沙漠城市亞拉里克］，與大陸最強傭兵團［阿爾德巴倫］結盟。</p> <p>另一邊，紅色斗篷男人與<span class="global_name_span">布萊德</span>仍戰的不分勝負，他狂態畢現，脫口而出自己的名字<span class="global_name_span">艾瑞克</span>。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40W%E6%B3%95%E5%A5%87%E7%9A%84%E5%B8%9D%E7%AA%A9W%3A7%2F%E6%A3%95%E8%89%B2%E5%A1%B5%E5%9F%832_CH04%EF%BC%BB%E7%9C%BC%E9%8F%A1%E8%88%87%E8%B2%9303%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH04 眼鏡與貓
  contentArr.push('<div class="title_text">CH05 沙漠之花</div> <p><span class="global_name_span">悠絲緹亞</span>一行人來到［沙漠城市亞拉里克］，才剛踏入［阿爾德巴倫］傭兵團的據點，就看到兩個團長因為領主禁止調查綠洲被下毒的事件吵了一架，妹妹<span class="global_name_span">露比雅</span>最後決定自己帶人去遺跡抓犯人。</p> <p>待在原地的姊姊<span class="global_name_span">席比雅</span>知道一行人是<span class="global_name_span">奧爾施塔因</span>派來的，但眼下情況也沒法談結盟的事情，為了獲取信任，<span class="global_name_span">悠絲緹亞</span>一行人便跟著<span class="global_name_span">席比雅</span>前去遺跡找妹妹。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/$/embed/@穿越時空的貓支線劇情:d/CH05［沙漠之花01］:0?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>遺跡中不單有魔獸橫行，還有他國士兵在行動，原來領主早就勾結敵國［德溫］，［阿爾德巴倫］傭兵團為了跟領主劃清界線，暗中尋找其他的雇主，領主也不是笨蛋，所以雙方早就勢如水火。</p> <p>在遺跡深處，<span class="global_name_span">露比雅</span>正與領主對峙著，這充滿遺跡的魔獸原來是領主使役的，由於數量龐大，大家只能先救出<span class="global_name_span">露比雅</span>後撤退，回到據點後一番討論下，發現領主勾結的正是［德溫］的貴族大公爵<span class="global_name_span">赫爾穆特</span>，在綠洲下毒也是領主的手筆。</p> <div class="global_ps_text"> <p>因為［沙漠城市亞拉里克］的遺跡中有個秘密地下通道，這可以作為［德溫］的戰略用途，也是因為這樣領主才會被<span class="global_name_span">赫爾穆特</span>拉攏，領主的一切行為都是為了更牢固掌控［沙漠城市亞拉里克］。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/$/embed/@穿越時空的貓支線劇情:d/CH05［沙漠之花02］:0?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>還沒等眾人反應過來，領主已經將勾結敵國與綠洲下毒的罪名推給［阿爾德巴倫］傭兵團，這時<span class="global_name_span">悠絲緹亞</span>亮出帝國［納莉亞公爵夫人］的徽章，這著實讓領主嚇了一跳，誤以為自己做的壞事已經被帝國知道，甩頭就逃往遺跡，想藉著秘密通道逃跑。</p> <p>就在眾人追上領主，並且將他逼到山窮水盡時，［德溫］貴族<span class="global_name_span">赫爾穆特</span>出現，並且將遺跡與秘密通道毀掉，眾人逃出生天後，接到<span class="global_name_span">奧爾施塔因</span>的指示，在與［阿爾德巴倫］傭兵團確定結盟關係後，就前往［魔塔］尋找下一個盟友。</p> <p>另外領主並沒有失去生命，結尾被女忍者<span class="global_name_span">銀浪</span>打昏帶走。</p> <div class="global_ps_text"> <p>從<span class="global_name_span">席比雅</span>口中得知，<span class="global_name_span">奧爾施塔因</span>是［貝倫王國］女王<span class="global_name_span">威廉明娜</span>的家臣。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/$/embed/@穿越時空的貓支線劇情:d/CH05［沙漠之花03］:f?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH05 沙漠之花
  contentArr.push('<div class="title_text">CH06 異教塔</div> <p>［魔塔］如今正遭到［科庫托斯］入侵，<span class="global_name_span">拉德爾</span>一行人救了副塔主<span class="global_name_span">賈弗利</span>後，繼續往塔上爬尋找塔主<span class="global_name_span">伊柯利普斯</span>。</p> <p><span class="global_name_span">伊柯利普斯</span>用來對付［科庫托斯］的魔法中含有［泰拉］的力量，這讓眾人產生忌憚，因為那就是屬於黑暗的力量，不過副塔主<span class="global_name_span">賈弗利</span>似乎對［泰拉］十分熱中，而<span class="global_name_span">伊柯利普斯</span>忙著對付敵人，先讓眾人在自己的辦公室待著。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH06%EF%BC%BB%E7%95%B0%E6%95%99%E5%A1%9401%EF%BC%BD_x%3Af?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">拉德爾</span>一行人在辦公室內看到使者<span class="global_name_span">墨菲亞</span>寄來的威脅信，原來［科庫托斯］的入侵，是為了奪取塔中一件可以產生大量［泰拉］的寶物，為了避免［科庫托斯］得逞，<span class="global_name_span">拉德爾</span>一行人主動加入抵抗行列。</p> <p>往塔上爬的途中看到一副玻璃棺材，裡面躺著的人是<span class="global_name_span">伊柯利普斯</span>的師傅<span class="global_name_span">卡戎</span>，而此刻守護寶物的結界被打破，觸發<span class="global_name_span">卡戎</span>留下的術法，一個隱藏的房間出現在眾人面前。</p> <p><span class="global_name_span">伊柯利普斯</span>在裡面找到<span class="global_name_span">卡戎</span>的遺書，以及留下的一枚含有強大魔力的戒指，這是師傅特意留下保護［魔塔］的最終手段，此時大家也知道<span class="global_name_span">伊柯利普斯</span>是一個活了很長歲月的魅魔。</p> <p>一行人趕到寶物的房間，原來打破結界的正是副塔主<span class="global_name_span">賈弗利</span>，他已經被黑暗的力量迷惑，想要幫助［科庫托斯］將寶物［吉克的手臂］偷走，一番激戰後，因為使者<span class="global_name_span">卡芮娜</span>的介入，［吉克的手臂］被敵人搶走，如今要阻止對方，只能保證［魔塔］核心正常運作，雖然關於［魔塔］核心的維修書籍已經被<span class="global_name_span">賈弗利</span>藏起來，但好在有個好學的石怪已經把內容全部記起來，眾人照著指示把損壞的裝置都逐一修復。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH06%EF%BC%BB%E7%95%B0%E6%95%99%E5%A1%9402%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在［魔塔］核心的房間，眾人與<span class="global_name_span">墨菲亞</span>等［科庫托斯］成員決戰，<span class="global_name_span">墨菲亞</span>見苗頭不對，送走使者<span class="global_name_span">卡芮娜</span>後，引爆<span class="global_name_span">賈弗利</span>體內的［泰拉］，想要將［魔塔］夷為平地，但是在<span class="global_name_span">伊柯利普斯</span>與其徒弟<span class="global_name_span">西利亞</span>的合作下，成功阻止了這場危機，只是<span class="global_name_span">西利亞</span>漂亮的臉蛋也因此留下難以抹滅的傷痕。</p> <p>戰鬥過後，<span class="global_name_span">伊柯利普斯</span>講起故事，曾經有股黑暗勢力要入侵世界，但是被英雄<span class="global_name_span">吉克</span>阻止，並且將大量［泰拉］都封印在自己手臂，這就是寶物［吉克的手臂］由來，而<span class="global_name_span">拉德爾</span>身上的［血刻印］詛咒就是仿冒［吉克的手臂］所製作成可以產生大量［泰拉］的替代品，這股力量會融於容器之人的血液中，所以之前<span class="global_name_span">悠絲緹亞</span>透過吸取<span class="global_name_span">拉德爾</span>血液獲得力量的行為，實際上就是一種利用［泰拉］的方法。</p> <p>但力量本身無分善惡，取決於使用者，<span class="global_name_span">西利亞</span>的祖先<span class="global_name_span">美狄亞</span>就是使用［泰拉］行善，眾人釋懷之後，<span class="global_name_span">伊柯利普斯</span>提議可以前去湖邊小鎮［拉勒凱］，那裡有著［科庫托斯］的活動痕跡。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH06%EF%BC%BB%E7%95%B0%E6%95%99%E5%A1%9403%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH06 異教塔
  contentArr.push('<div class="title_text">CH07 憤怒的天使</div> <p>在<span class="global_name_span">拉德爾</span>一行人抵達前，湖邊小鎮［拉勒凱］正發生一件慘事，一群黑魔法師圍攻燃燒的教堂，一名女性輝動巨斧與之戰鬥。</p> <p>等到<span class="global_name_span">拉德爾</span>一行人到時，教堂已經成為廢墟，他們找到通往地下的通道，發現到處都是燒焦的屍體與魔獸，在這遇到倖存的少女<span class="global_name_span">安娜塔西亞</span>，以及因為使用［泰拉］而神智不清的<span class="global_name_span">泰瑞絲</span>，在看到<span class="global_name_span">莎赫拉查德</span>之後便昏了過去。</p> <p>大家只能先將<span class="global_name_span">泰瑞絲</span>帶回村子醫治，等她醒來後才知道［科庫托斯］在這進行大規模的實驗，強制餵食［阿德林］給抓來的實驗體，當中少部分人會獲得特殊力量成為［使者候補］，其他人則變成不死生物或怪物，<span class="global_name_span">泰瑞絲</span>就是成為［使者候補］的人，也因此獲得自由行動的權利，但是她不想跟［科庫托斯］同流合汙，所以利用獲得的力量保護教堂的孩子。</p> <p>因為教堂地下還有其他孩子，所以<span class="global_name_span">泰瑞絲</span>急忙返回，眾人也趕緊跟了上去，路上短暫談論到<span class="global_name_span">悠絲緹亞</span>與<span class="global_name_span">莎赫拉查德</span>小時候居住在［羅戴夫鎮］，在<span class="global_name_span">悠絲緹亞</span>離開後，小鎮捲入戰爭而毀滅，<span class="global_name_span">莎赫拉查德</span>就是在那時被<span class="global_name_span">泰瑞絲</span>的家族收養，所以兩人雖然以姊妹相稱，其實並沒有血緣關係。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH07%EF%BC%BB%E6%86%A4%E6%80%92%E7%9A%84%E5%A4%A9%E4%BD%BF01%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>教堂地下深處，使者<span class="global_name_span">伯克</span>與神祕幹部<span class="global_name_span">阿札爾</span>正準備殘害剩下的孩子，看到<span class="global_name_span">拉德爾</span>一行人到來，使者<span class="global_name_span">伯克</span>很自信讓<span class="global_name_span">阿札爾</span>先離開，準備自己獨自對付敵人，但不料使者<span class="global_name_span">伯克</span>自身的實力很弱，被輕而一舉擊敗，救回孩子後，大家解析在教堂下發現的研究報告，得知<span class="global_name_span">拉德爾</span>身上的［血刻印］竟是犧牲相當於一個小國人口所創造的。</p> <p>同時眾人發現<span class="global_name_span">安娜塔西亞</span>被人拐走，幾番搜尋發現另一處在森林的地下入口，看來［科庫托斯］在這小鎮建造了不少的實驗室，在深處看到拐走<span class="global_name_span">安娜塔西亞</span>的使者候補<span class="global_name_span">安柏</span>與<span class="global_name_span">阿札爾</span>。</p> <p>講起<span class="global_name_span">阿札爾</span>這人，他雖然不是使者，卻是創造出最強使者的人，他讓<span class="global_name_span">安柏</span>服下不知名的藥物，瞬間就讓其力量增加數倍，危急時刻<span class="global_name_span">拉德爾</span>突然變化成另一個白髮型態，將<span class="global_name_span">安柏</span>力量吸收殆盡，<span class="global_name_span">安柏</span>當場消失的無影無蹤，經過這一個異變，<span class="global_name_span">拉德爾</span>獲得自由操控［泰拉］的能力，但依然沒辦法救回<span class="global_name_span">安娜塔西亞</span>，只能眼睜睜看著<span class="global_name_span">阿札爾</span>帶著她從容離去。</p> <p>事後<span class="global_name_span">泰瑞絲</span>決定留下保護剩下的孩子，雖然無法同行，但她建議眾人可以前往［羅戴夫鎮］尋找<span class="global_name_span">悠絲緹亞</span>的兒時玩伴<span class="global_name_span">莉亞特里斯</span>，她是一個超強的情報員，手中必定有關於［科庫托斯］的情報。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH07%EF%BC%BB%E6%86%A4%E6%80%92%E7%9A%84%E5%A4%A9%E4%BD%BF02%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH07 憤怒的天使
  contentArr.push('<div class="title_text">CH08 血之狂想曲</div> <p>夢裡<span class="global_name_span">拉德爾</span>痛恨過去懦弱的自己，並且親手毀滅他，下定決心要消滅［科庫托斯］有關的一切。</p> <p>醒來後眾人已經在［羅戴夫鎮］，這裡因為戰爭影響形同廢墟，到處都是拼湊而成的房子，但沒想到村內還有環境更糟糕的［貧民窟］，這裡魔獸橫行，在這又遇到使者<span class="global_name_span">伯克</span>，大家都沒辦法理解他為什麼死而復生？只能再次擊敗他，這次終於看到他是靠著分裂身體，並且變成蟲卵重新發育，才能擁有不死之軀，這時<span class="global_name_span">莉亞特里斯</span>出現，以箭雨將之消滅。</p> <p>在［貧民窟］內，<span class="global_name_span">莉亞特里斯</span>率領盜賊團與［科庫托斯］對抗，但因為長期人手不足，所以後來招募了一些只為自身利益的狐群狗黨，現在盜賊團內的<span class="global_name_span">賈尼博</span>正凝聚這些勢力，直接背叛<span class="global_name_span">莉亞特里斯</span>，並且與［科庫托斯］合作。</p> <div class="global_ps_text"> <p>故事到這，<span class="global_name_span">莉亞特里斯</span>一看到<span class="global_name_span">格雷</span>就向他求婚，雖然不知道原因，但似乎跟<span class="global_name_span">格雷</span>真實身分有關？</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH08%EF%BC%BB%E8%A1%80%E4%B9%8B%E7%8B%82%E6%83%B3%E6%9B%B201%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">賈尼博</span>之所以背叛的原因，是因為她想取得與［使者］一樣強的力量，所以利用這裡的村民做實驗，她認為可以透過一點一點吸收［阿德林］，免於失敗變成不死生物的風險，最終就可以獲得特殊力量，但［泰拉］並不是這樣容易操控的魔力，最終<span class="global_name_span">賈尼博</span>還是在與眾人的戰鬥中失控化為齎粉。</p> <p>大家繼續前進，找到<span class="global_name_span">墨菲亞</span>的手下<span class="global_name_span">內勒德</span>，她一身哥德蘿莉風格打扮，與眾人的戰鬥中試圖引爆體內的［泰拉］，但是被<span class="global_name_span">拉德爾</span>吸收，不過<span class="global_name_span">內勒德</span>在消失的前一刻，對<span class="global_name_span">拉德爾</span>施展幻術魔法，就在眾人放下戒心回村休整時，<span class="global_name_span">拉德爾</span>被幻術引導至［使者］<span class="global_name_span">伯克</span>與<span class="global_name_span">布萊德</span>所在的地方。</p> <p><span class="global_name_span">布萊德</span>一心想要直接解決<span class="global_name_span">拉德爾</span>除掉後患，但<span class="global_name_span">伯克</span>卻想吸收［血刻印］的力量，但這打不死的蟑螂［使者］過於粗心大意，沒察覺<span class="global_name_span">拉德爾</span>已經清醒，反被<span class="global_name_span">拉德爾</span>吸收。</p> <p>力量大增的<span class="global_name_span">拉德爾</span>直接與<span class="global_name_span">布萊德</span>開戰，就在雙方兩敗俱傷之際，一道［次元門］突然開啟，［使者］<span class="global_name_span">夜神</span>橫空出世，一刀貫穿<span class="global_name_span">拉德爾</span>的身體，在<span class="global_name_span">悠絲緹亞</span>的聲聲呼喚中，<span class="global_name_span">拉德爾</span>的意識逐漸飄散。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH08%EF%BC%BB%E8%A1%80%E4%B9%8B%E7%8B%82%E6%83%B3%E6%9B%B202%EF%BC%BD%3A9?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH08 血之狂想曲
  contentArr.push('<div class="title_text">CH09 鐵面具</div> <p>轉眼間來到一年後，［科庫托斯］的勢力越來越大，已經席捲整個大陸，開始四處侵略，靠著<span class="global_name_span">奧爾施塔因</span>之前的籌謀，如今能與之對抗的勢力也已成形，包含了［阿爾德巴倫傭兵團］與黑魔法師反抗軍［雷瓦汀］的聯軍在最近陷入苦戰，原因在於［科庫托斯］軍中開始出現帶著鐵面具的群體，每當他們出現在戰場時，敵軍的力量就會增強，聯軍為了破解當中秘密，捕獲了其中一名鐵面具，沒想到他的長相竟然跟<span class="global_name_span">拉德爾</span>一樣。</p> <p>一年前當<span class="global_name_span">拉德爾</span>受到重創後，就被［使者］直接帶走，生死未卜，<span class="global_name_span">悠絲緹亞</span>聽到消息後，不管怎樣也想當面看看這鐵面具，沒想到看著眼前神似<span class="global_name_span">拉德爾</span>的男子，<span class="global_name_span">悠絲緹亞</span>突然浮現吸血的衝動，咬住男子的手臂大口吸允起來，接著兩人周圍泛起治療的光芒，身體的傷都迅速癒合，而男子竟脫口而出<span class="global_name_span">悠絲緹亞</span>的名字，彷彿剛才的吸血代表某種儀式，喚醒沉睡在他身體裡的記憶。</p> <p>經過<span class="global_name_span">奧爾施塔因</span>的解釋，眼前這男子是［科庫托斯］的新型兵器，稱為［量產型血刻印］，很有可能是以<span class="global_name_span">拉德爾</span>為原型製作的，而且很有可能每個都跟<span class="global_name_span">拉德爾</span>長的一模一樣。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH09%EF%BC%BB%E9%90%B5%E9%9D%A2%E5%85%B701%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">奧爾施塔因</span>認為操控［量產型血刻印］的黑魔法師<span class="global_name_span">法夫尼爾</span>一定就在附近，所以請<span class="global_name_span">莎赫拉查德</span>利用鐵面具製造出能反向追蹤的魔石。</p> <p>但追蹤源頭還需要被捕的［量產型血刻印］幫忙，<span class="global_name_span">悠絲緹亞</span>直接稱他為<span class="global_name_span">拉德爾</span>，似乎是從吸血的行為中，發現他與其他的［量產型血刻印］不同，而<span class="global_name_span">拉德爾</span>因為得到名字十分開心，在之前他都被稱為代號［166］。</p> <p>雖然<span class="global_name_span">格雷</span>與<span class="global_name_span">莎赫拉查德</span>一開始極力反對，因為他們清楚眼前的人並不是曾經一起奮鬥的夥伴<span class="global_name_span">拉德爾</span>，但在尋找<span class="global_name_span">法夫尼爾</span>的過程中，知道他有與<span class="global_name_span">拉德爾</span>一樣善良的心，還有敦厚的性格也與初遇的<span class="global_name_span">拉德爾</span>相似，尤其是看到他與其他［量產型血刻印］對<span class="global_name_span">法夫尼爾</span>的態度極度不同，所以接受了讓他繼承<span class="global_name_span">拉德爾</span>的名字。</p> <div class="global_ps_text"> <p>還沒玩到故事後面的劇情，為了避免混淆，之後統稱這個善良的［量產型血刻印］<span class="global_name_span">拉德爾</span>為<span class="global_name_span">拉德爾166</span>。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH09%EF%BC%BB%E9%90%B5%E9%9D%A2%E5%85%B702%EF%BC%BD%3Af?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>四人最終在山洞內找到<span class="global_name_span">法夫尼爾</span>，面對昔日的主人，<span class="global_name_span">拉德爾166</span>沒有半分猶豫，決定與夥伴終結<span class="global_name_span">法夫尼爾</span>的惡行，最終與<span class="global_name_span">悠絲緹亞</span>合力將他擊敗。</p> <p>就在<span class="global_name_span">法夫尼爾</span>即將消失之際，一個神祕的意志控制了他的頭顱，並且藉由他的口，說自己也是［科庫托斯］的敵人，並且稱<span class="global_name_span">悠絲緹亞</span>為［奧利維耶之女］。</p> <p>事後<span class="global_name_span">奧爾施塔因</span>認為［量產型血刻印］是透過［霍爾蒙克斯］簡稱人造人技術實現，所以建議眾人前往尋找反抗軍領導者<span class="global_name_span">李昂哈德</span>，以及他正在保護的魔法師，這魔法師對［霍爾蒙克斯］頗有研究，也許能看出甚麼端倪，至於<span class="global_name_span">奧爾施塔因</span>本人則開始著手調查那控制<span class="global_name_span">法夫尼爾</span>與<span class="global_name_span">悠絲緹亞</span>對話的人以及［奧利維耶之女］的相關情報。</p> <div class="global_ps_text"> <p>［量產型血刻印］有個［恩寵合約］的設定，可以與［使者］締結，<span class="global_name_span">法夫尼爾</span>臨死前認為<span class="global_name_span">拉德爾166</span>的背叛可能就與<span class="global_name_span">悠絲緹亞</span>有關，目前故事還搞不懂當中的關係，就先記錄一下，另外<span class="global_name_span">悠絲緹亞</span>面對其他的［量產型血刻印］並沒有吸血的衝動，說明<span class="global_name_span">拉德爾166</span>的確是特別的存在。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH09%EF%BC%BB%E9%90%B5%E9%9D%A2%E5%85%B703%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH09 鐵面具
  contentArr.push('<div class="title_text">CH10 霍爾蒙克斯</div> <p>大家來到［羅坦王國］，遇到正回城的<span class="global_name_span">李昂哈德</span>與他正在保護的魔法師<span class="global_name_span">黛安娜</span>，她是<span class="global_name_span">莎赫拉查德</span>在魔法學校時的教授，本以為是熟人好說話，但<span class="global_name_span">黛安娜</span>卻直接要求<span class="global_name_span">李昂哈德</span>把眾人關進地下監獄，這時<span class="global_name_span">格雷</span>忍不住跳了出來，大概也是老相識，本以為<span class="global_name_span">李昂哈德</span>會賣他個面子，結果對方直接無視他，就這樣眾人被捕下獄。</p> <p>而<span class="global_name_span">拉德爾166</span>被<span class="global_name_span">黛安娜</span>單獨隔開研究，當<span class="global_name_span">莎赫拉查德</span>三人逃出牢房找到時，<span class="global_name_span">黛安娜</span>正利用［葛洛提］窺探<span class="global_name_span">拉德爾166</span>的意識，在其意識深處，<span class="global_name_span">拉德爾</span>曾經的親人正不斷催促他報仇。</p> <p><span class="global_name_span">莎赫拉查德</span>一見<span class="global_name_span">黛安娜</span>就開始鬥嘴，這時才知<span class="global_name_span">黛安娜</span>當年在學校是被［科庫托斯］綁架才消失的，後來被<span class="global_name_span">李昂哈德</span>救出來，眼下<span class="global_name_span">拉德爾166</span>體內的［泰拉］逐漸失控，必須收集［霍爾蒙克斯］的核心才能修復。</p> <div class="global_ps_text"> <p><span class="global_name_span">拉德爾166</span>應該確實繼承了<span class="global_name_span">拉德爾</span>的記憶，就不知道是生產的過程發生錯誤？還是因為<span class="global_name_span">悠絲緹亞</span>吸血後喚醒的記憶。不過<span class="global_name_span">悠絲緹亞</span>有說只有<span class="global_name_span">拉德爾166</span>讓她有吸血的慾望，所以應該更多是在<span class="global_name_span">拉德爾166</span>被生產出來時發生了甚麼？</p> <p>另外<span class="global_name_span">黛安娜</span>曾被［科庫托斯］綁架，所以製造人造人的技術很可能就是那時被［科庫托斯］學了去。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH10%EF%BC%BB%E9%9C%8D%E7%88%BE%E8%92%99%E5%85%8B%E6%96%AF01%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>城裡有不少<span class="global_name_span">黛安娜</span>製造的［霍爾蒙克斯］，本來只需要講出暗號，他們就會自己回到<span class="global_name_span">黛安娜</span>身邊獻出核心，但<span class="global_name_span">拉德爾166</span>散發的［泰拉］似乎讓附近的［霍爾蒙克斯］產生自我意志，當得知<span class="global_name_span">黛安娜</span>要犧牲拋棄自己時，他們集結成群，要向製造自己的<span class="global_name_span">黛安娜</span>討個說法。</p> <p>不過這只是個小插曲，對［霍爾蒙克斯］有深度研究的<span class="global_name_span">黛安娜</span>很快擺平這場動亂，並且取得修復<span class="global_name_span">拉德爾166</span>所需要的核心，但<span class="global_name_span">李昂哈德</span>卻先一步將<span class="global_name_span">拉德爾166</span>帶走。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH10%EF%BC%BB%E9%9C%8D%E7%88%BE%E8%92%99%E5%85%8B%E6%96%AF02%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>原來這個<span class="global_name_span">人造人李昂哈德</span>也是［霍爾蒙克斯］，真正的<span class="global_name_span">李昂哈德</span>正在別處執行任務，覺醒之後<span class="global_name_span">人造人李昂哈德</span>追尋著自己存在的意義，在與<span class="global_name_span">拉德爾166</span>交談過後，被他的思想影響，<span class="global_name_span">拉德爾166</span>雖然知道自己是個複製體，但為了<span class="global_name_span">悠絲緹亞</span>他依然願意貢獻自己的力量對抗［科庫托斯］，而<span class="global_name_span">人造人李昂哈德</span>也決心扮演<span class="global_name_span">李昂哈德</span>到底，為了信任自己的人而奮戰，兩個［霍爾蒙克斯］在相處的過程中，更加確信自己的目標與意志。</p> <p>由於普通［霍爾蒙克斯］的核心並不足以修復<span class="global_name_span">拉德爾166</span>，於是<span class="global_name_span">人造人李昂哈德</span>以戰鬥來測試<span class="global_name_span">拉德爾166</span>是否值得自己犧牲，戰敗後<span class="global_name_span">人造人李昂哈德</span>貢獻出自己的核心。</p> <p><span class="global_name_span">拉德爾166</span>體內的［泰拉］終於穩定下來，然而這時<span class="global_name_span">魯</span>卻帶來驚人的消息，真正的<span class="global_name_span">李昂哈德</span>因為暗殺［羅坦王國］的王，而被捕入獄。</p> <div class="global_ps_text"> <p>這章有提到<span class="global_name_span">格雷</span>的真名是<span class="global_name_span">吉斯格雷．布萊爾</span>。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH10%EF%BC%BB%E9%9C%8D%E7%88%BE%E8%92%99%E5%85%8B%E6%96%AF03%EF%BC%BD%3Af?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH10 霍爾蒙克斯
  contentArr.push('<div class="title_text">CH11 虛假遊戲</div> <p>幾日前，在夜晚的王宮大殿，［羅坦王國］的國王<span class="global_name_span">普里斯</span>因為拒絕使用［翅膀］，而被神秘的黑衣人刺殺。</p> <p><span class="global_name_span">格雷</span>一行人在<span class="global_name_span">魯</span>的引導下，抄了捷徑來到王城，眾人一路順暢進入大殿，原來<span class="global_name_span">格雷</span>就是已故國王<span class="global_name_span">普里斯</span>的王兄，如今王國被大臣<span class="global_name_span">亞齊波特</span>暫時掌握領導權，<span class="global_name_span">莎赫拉查德</span>一眼就看出他就是當初在礦山與［德溫貴族］、［貝克王族］密談的軍閥，因此多了幾分警惕的心眼。</p> <p>就在<span class="global_name_span">亞齊波特</span>向<span class="global_name_span">格雷</span>彙報近期發生的事情時，士兵傳來<span class="global_name_span">李昂哈德</span>越獄的消息，大家急忙前往逮捕，卻遇到［科庫托斯］的野獸士兵襲擊，城外也有［科庫托斯］的投石車不斷破壞城牆，由於<span class="global_name_span">格雷</span>對<span class="global_name_span">李昂哈德</span>還是有一定的信任，於是暫時忽視他是刺殺國王的嫌疑犯身分，眾人一起抵抗［科庫托斯］的進攻。</p> <p>在一起行動的過程中得知原來現在的［羅坦王國］是由遠親的［布萊爾家族］繼承，為了方便統治，一直以來都施以強硬的手段，<span class="global_name_span">格雷</span>就是不認同家族的作法才逃家當個遊俠，而<span class="global_name_span">李昂哈德</span>認清如今大陸的形勢，如今要守住［羅坦王國］必須與［貝倫］、［尼福蘭特］合作，形成三國聯盟，只是當<span class="global_name_span">普里斯</span>接納這個意見的隔天就遭到暗殺。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH11%EF%BC%BB%E8%99%9B%E5%81%87%E9%81%8A%E6%88%B201%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>清剿完城內的野獸士兵後，大家發現<span class="global_name_span">普里斯</span>的棺木已經不翼而飛，原來這一切都是<span class="global_name_span">亞齊波特</span>的陰謀，他不認同王室的想法，主張要守護［羅坦王國］就該不擇手段，就算是利用黑暗的力量也在所不惜，因此他刺殺<span class="global_name_span">普里斯</span>，奪取棺木中的［翅膀］，化身成獸人的型態，只是［翅膀］力量過於強大，他無法掌控即將暴走。</p> <p>這時<span class="global_name_span">拉德爾166</span>出手吸收這股洶湧的［泰拉］，在與<span class="global_name_span">悠絲緹亞</span>接觸後，凝聚成一個巨大的［黑色羽毛］。</p> <p><span class="global_name_span">奧爾施塔因</span>解釋這東西與［魔塔］中［吉克的手臂］是同樣的存在，甚至猶有過之，本來他與［魔塔］正在調查這東西為何會落入［羅坦王國］的王族手中，由於［黑色羽毛］散發的［泰拉］會迷惑人心，導致人性情大變，如今只能讓不受影響的<span class="global_name_span">悠絲緹亞</span>來保管。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH11%EF%BC%BB%E8%99%9B%E5%81%87%E9%81%8A%E6%88%B202%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>大家前往酒館休整，期間<span class="global_name_span">格雷</span>自責自己逃跑，間接害死弟弟，但在伙伴的鼓勵下又振作起來，此時一個戴著兜帽的流浪者衝進酒館，嘴裡直喊著［好餓］，大家將她餵飽後，得知她正尋找［像鳥的人］，只是只有這點線索實在幫不上忙，於是流浪者就直接離開了。</p> <p>過沒多久，［科庫托斯］再次攻城，這次攻勢更加猛烈，就連城門都已經被破了，如今只能釜底抽薪，直接前往敵陣擊敗指揮作戰的首領，在過程中又遇到［量產型血刻印］，面對昔日的同伴，<span class="global_name_span">拉德爾166</span>沒有猶豫，堅定信念將其擊敗。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH11%EF%BC%BB%E8%99%9B%E5%81%87%E9%81%8A%E6%88%B203%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>透過感應，大家找到使者<span class="global_name_span">柏瑞坦</span>，本來還打的有來有回，只是當<span class="global_name_span">柏瑞坦</span>釋放［泰拉］後，強弱登時變的懸殊，這時一柄長槍刺向<span class="global_name_span">柏瑞坦</span>，早前遇到的流浪者脫下兜帽，露出單翼，她自稱<span class="global_name_span">葛蘭西特</span>，看她與<span class="global_name_span">柏瑞坦</span>平分秋色的戰鬥，就知道實力十分強大，雙方都蓄力準備做出必殺一擊時，<span class="global_name_span">拉德爾166</span>與<span class="global_name_span">悠絲緹亞</span>暗中干擾<span class="global_name_span">柏瑞坦</span>的［泰拉］，勝利天平至此完全傾向<span class="global_name_span">葛蘭西特</span>。</p> <p>消滅敵人後，<span class="global_name_span">葛蘭西特</span>並沒有多做停留就靜悄悄地離開了，大家回到王城準備善後，看到<span class="global_name_span">莎赫拉查德</span>的養父<span class="global_name_span">阿爾敏公爵</span>帶來援兵才讓王城得以守住，他們想擁立<span class="global_name_span">格雷</span>成為新的國王，這下<span class="global_name_span">格雷</span>就算再想逃避也不行了，但<span class="global_name_span">阿爾敏公爵</span>還是留下緩衝時間，讓<span class="global_name_span">格雷</span>完成與夥伴的旅途後再回來。</p> <p>至於對［黑色羽毛］的處置，<span class="global_name_span">奧爾施塔因</span>與<span class="global_name_span">伊柯利普斯</span>商量後決定毀掉，畢竟這次［科庫托斯］大舉進攻，很大的目標就是奪取［黑色羽毛］，為了毀掉它，眾人準備前往神聖之地［阿爾卡迪亞］。</p> <p>另一邊的［科庫托斯］，<span class="global_name_span">阿札爾</span>派出［使者］<span class="global_name_span">夜神</span>奪取［翅膀］。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH11%EF%BC%BB%E8%99%9B%E5%81%87%E9%81%8A%E6%88%B204%EF%BC%BD%3Ab?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH11 虛假遊戲
  contentArr.push('<div class="title_text">CH12 黑羽毛</div> <p>要進入神聖之地［阿爾卡迪亞］，必須獲得修女的擔保，眾人經過商業城市［埃克夏］，就開始打探修女的情報，這裡最大的商會［佐頓商會］在一年前遭到黑魔法師的設計，遭受毀滅性的打擊，幸虧一名修女拯救，聽聞修女如今正在［佐頓商會］，但面對來訪的眾人，<span class="global_name_span">佐頓</span>卻誤以為是黑魔法師來襲，本來大戰一觸即發，還好商會請的傭兵是［羅戴夫盜賊團］的成員，他們早前早就跟<span class="global_name_span">悠絲緹亞</span>見過面。</p> <p>誤會解開後，大家聽<span class="global_name_span">佐頓</span>的敘述前往森林找率隊討伐半獸人的修女，但他們遭到襲擊，護衛的騎士都已經犧牲，幸虧落單的修女<span class="global_name_span">黎維塔</span>並無大礙。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH12%EF%BC%BB%E9%BB%91%E7%BE%BD%E6%AF%9B01%EF%BC%BD%3A0?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在深入森林調查是否還有騎士倖存的途中，沿路遇到一個巨大食人魔屍體，<span class="global_name_span">悠絲緹亞</span>顯然對食人魔的血有特殊的感應，突然十分渴望飲血，幸虧在<span class="global_name_span">黎維塔</span>的治療下暫時恢復正常。</p> <p>事後<span class="global_name_span">黎維塔</span>將食人魔淨化，並且將食人魔的血提煉放入瓶中，雖然這是劇毒，但瀕死的人若喝下，有可能會起死回生，<span class="global_name_span">黎維塔</span>將這瓶血交給全隊最慎重的<span class="global_name_span">拉德爾166</span>。</p> <p>眾人繼續前進，又遇到食人魔，戰鬥過後<span class="global_name_span">悠絲緹亞</span>渴望血的症狀又再度出現，<span class="global_name_span">拉德爾166</span>情急之下讓<span class="global_name_span">悠絲緹亞</span>喝下自己的血，然後就昏了過去。</p> <p>甦醒後，大家已經回到城鎮，<span class="global_name_span">黎維塔</span>告知<span class="global_name_span">拉德爾166</span>那瓶食人魔之血就叫做［阿德林］，喝下這藥並且活下來的人能獲得超越人類的力量，而且之後就算受到重傷，只要再喝下一次就能瞬間恢復，<span class="global_name_span">黎維塔</span>在治療<span class="global_name_span">悠絲緹亞</span>的時候發現她可能在之前就已經喝過這種藥。</p> <p><span class="global_name_span">拉德爾166</span>與大家會合後，從［羅戴夫盜賊團］的成員口中得知，黑魔法師已經出現在前往神聖之地［阿爾卡迪亞］的路上，既然已經獲得修女<span class="global_name_span">黎維塔</span>的擔保，就算知道前方有危險，眾人還是即刻出發前往［阿爾卡迪亞］。</p> <div class="global_ps_text"> <p>［羅戴夫盜賊團］帶來<span class="global_name_span">莉亞特里斯</span>的口信，對著<span class="global_name_span">格雷</span>喊老公的一幕蠻好笑的。</p> </div> <p><iframe id="odysee-iframe" style="width:80%;   contentArr.push('<div class="title_text">CH13 雪之歌</div> <p>在<span class="global_name_span">悠絲緹亞</span>的意識世界中，<span class="global_name_span">拉德爾</span>與<span class="global_name_span">黎維塔</span>都在勸說她接納能守護一切的力量，即便是［泰拉］。</p> <p>當<span class="global_name_span">悠絲緹亞</span>醒來後，已經身處一座雪山，附近有個叫做［華特波爾］的村子，與商店老闆娘交談後，發現這裡是個與世隔絕的小鎮，十年內只有一個叫做<span class="global_name_span">斯托拉斯</span>的商人。</p> <p>這時村民傳來<span class="global_name_span">斯托拉斯</span>遭到魔獸攻擊的消息，聽<span class="global_name_span">斯托拉斯</span>敘述他本來是上山找［皎潔魔女］，但卻受到魔獸攻擊，幸虧［皎潔魔女］出手才能逃回村子，<span class="global_name_span">悠絲緹亞</span>聽到這便上山幫村民討伐魔獸，過程中撿到一幅小孩的塗鴉，一些遺忘的往事回憶在腦海中閃現。</p> <p>繼續深入，<span class="global_name_span">悠絲緹亞</span>在魔獸群中，救了一個名叫<span class="global_name_span">苪彼泰雅</span>的女孩，得知她有個妹妹叫做<span class="global_name_span">緹亞</span>，而她妹妹的母親就是［皎潔魔女］，突然<span class="global_name_span">悠絲緹亞</span>腦海又閃現［華特波爾］村民倒地的景象，因為擔心所以急忙返回村子。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH13%EF%BC%BB%E9%9B%AA%E4%B9%8B%E6%AD%8C01%EF%BC%BD%3A1?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">悠絲緹亞</span>回到［華特波爾］發現一切如常，只是時空彷彿倒置一般，村民都不認識她，接著<span class="global_name_span">悠絲緹亞</span>又回到雪山找<span class="global_name_span">苪彼泰雅</span>，發現她還保留記憶，而且又能召喚出魔獸，很自然就把她當做這一切異常現象的元兇。</p> <p>雙方隨即展開戰鬥，<span class="global_name_span">悠絲緹亞</span>追著<span class="global_name_span">苪彼泰雅</span>來到［皎潔魔女］的小屋，看到<span class="global_name_span">斯托拉斯</span>正與一個金髮小女孩對峙，這才想到上一個輪迴中，<span class="global_name_span">斯托拉斯</span>身上的傷也許就是這小女孩的傑作。</p> <p>還沒等<span class="global_name_span">悠絲緹亞</span>上前問清楚，食人魔便已經來襲，經過這麼一阻，兩人早已離去，接著是一個氣質高貴的金髮女人出現，她就是［皎潔魔女］，誤把<span class="global_name_span">悠絲緹亞</span>當作想害自己女兒的壞人，簡單交鋒之後就離開去找女兒。</p> <p><span class="global_name_span">悠絲緹亞</span>追上去後看到［皎潔魔女］抱著小女孩，自語自己因為背叛<span class="global_name_span">弗雷萊亞</span>才會讓女兒遭受詛咒的命運，看到<span class="global_name_span">悠絲緹亞</sp
