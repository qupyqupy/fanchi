］，並將生命轉讓年幼的自己。</p> <p>取回所有記憶的<span class="global_name_span">悠絲緹亞</span>在甦醒前，擁抱在夢境中的<span class="global_name_span">緹亞</span>與<span class="global_name_span">苪彼泰雅</span>，此時她已經有勇氣面對那些過去。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH13%EF%BC%BB%E9%9B%AA%E4%B9%8B%E6%AD%8C04%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH13 雪之歌
  contentArr.push('<div class="title_text">CH14 神聖審判</div> <p><span class="global_name_span">拉德爾166</span>一行人為了醫治昏迷的<span class="global_name_span">悠絲緹亞</span>，一路趕到聖地［阿爾卡迪亞］，修女<span class="global_name_span">米卡埃拉</span>看著他們帶來裝有<span class="global_name_span">黎維塔</span>的棺木與昏迷而且體內有［泰拉］力量的<span class="global_name_span">悠絲緹亞</span>，就直接放眾人進入。</p> <p><span class="global_name_span">米卡埃拉</span>這舉動其實有她的心思，她利用儀式探查眾人的內心，如果擁有邪惡的意念就會當場了結受測者的生命，還好大家通過了考驗，只是<span class="global_name_span">悠絲緹亞</span>因為昏迷需要進行另外的儀式確認，這時使者<span class="global_name_span">夜神</span>突然來襲，顯然他的目標就是<span class="global_name_span">悠絲緹亞</span>體內的［黑羽毛］，在<span class="global_name_span">米卡埃拉</span>神聖力量的壓制下，<span class="global_name_span">夜神</span>暫時被擊退，修女<span class="global_name_span">安潔莉卡</span>趁機追了上去。</p> <p>因為外敵來襲，在徒增變數的此時，<span class="global_name_span">米卡埃拉</span>想要直接將<span class="global_name_span">悠絲緹亞</span>連同［黑羽毛］一起消滅，<span class="global_name_span">格雷</span>趁空隙攻擊中斷<span class="global_name_span">米卡埃拉</span>的力量輸出，一行人便帶著昏迷的<span class="global_name_span">悠絲緹亞</span>逃離，現在除了面對來自<span class="global_name_span">夜神</span>的威脅外，眾人還得躲過聖地騎士的追捕。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH14%EF%BC%BB%E7%A5%9E%E8%81%96%E5%AF%A9%E5%88%A401%EF%BC%BD%3Aa?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>本來照著<span class="global_name_span">格雷</span>的計畫，由他與<span class="global_name_span">莎赫拉查德</span>吸引敵人注意，趁機清空通往外界的通道，讓<span class="global_name_span">拉德爾166</span>可以帶著<span class="global_name_span">悠絲緹亞</span>突破重圍逃走。</p> <p>但<span class="global_name_span">夜神</span>擺脫<span class="global_name_span">安潔莉卡</span>的追擊，來到<span class="global_name_span">拉德爾166</span>面前，並且利用他的力量從<span class="global_name_span">悠絲緹亞</span>體內分離出［黑羽毛］，甦醒後的<span class="global_name_span">悠絲緹亞</span>力量大增，<span class="global_name_span">夜神</span>短暫交鋒後，立即帶著得手的［黑羽毛］離開，而<span class="global_name_span">悠絲緹亞</span>見狀並不著急追趕，反而用公主抱方式抱起<span class="global_name_span">拉德爾166</span>前往與<span class="global_name_span">格雷</span>會和。</p> <p>大家聯手一起壓制因為魔劍力量失控的<span class="global_name_span">安潔莉卡</span>，只是一波未平、一波又起，<span class="global_name_span">夜神</span>強行使用［黑羽毛］的力量召喚出許多黑暗騎士，他們正湧向不停散發神聖力量壓制敵人的<span class="global_name_span">米卡埃拉</span>，幫忙擊退黑暗騎士後，雙方暫時達成同盟，一起結伴要阻止<span class="global_name_span">夜神</span>獲得完全操控［黑羽毛］的力量。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH14%EF%BC%BB%E7%A5%9E%E8%81%96%E5%AF%A9%E5%88%A402%EF%BC%BD%3Ad?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>從<span class="global_name_span">安潔莉卡</span>口中得知這［劍之神殿］除了自己手中的魔劍［約爾文］外，還有另一把有更大力量的魔劍［巴拿勒］，而<span class="global_name_span">夜神</span>可能因為無法駕馭［黑羽毛］，所以需要取得魔劍［巴拿勒］來增強實力。</p> <p>然而出乎意料的是，魔劍［巴拿勒］以召喚出來的黑暗騎士為寄體，取得自由行動的能力，在眾人擊敗他後，魔劍［巴拿勒］又企圖奪取<span class="global_name_span">安潔莉卡</span>的身體，可這一切都在<span class="global_name_span">安潔莉卡</span>的掌控中，她以自身拖住［巴拿勒］，讓<span class="global_name_span">悠絲緹亞</span>一行人可以離開尋找<span class="global_name_span">夜神</span>與封印在這神殿的神劍［米斯特汀］，當大家離去後，<span class="global_name_span">安潔莉卡</span>與［巴拿勒］兩敗俱傷陷入昏迷，這時<span class="global_name_span">米卡埃拉</span>突然出現與［巴拿勒］交談，這才知道原來是<span class="global_name_span">米卡埃拉</span>散播［墮落翅膀只能在阿爾卡迪亞摧毀］的情報，以此吸引<span class="global_name_span">悠絲緹亞</span>等人來到聖地。</p> <p>另一邊<span class="global_name_span">悠絲緹亞</span>一行人找到<span class="global_name_span">夜神</span>，他因為無法駕馭［黑羽毛］，力量不斷衰弱，為了擊敗眼前的敵人，<span class="global_name_span">夜神</span>放任［黑羽毛］吞噬自己，只留下擊敗<span class="global_name_span">悠絲緹亞</span>的執念，此時神劍［米斯特汀］似乎有所感應來到<span class="global_name_span">悠絲緹亞</span>身前，兩者合而為一獲得新的戰鬥型態，終於將<span class="global_name_span">夜神</span>擊敗。</p> <p>但還沒高興多久，復活的<span class="global_name_span">黎維塔</span>突然出現，與神秘的兜帽人奪走<span class="global_name_span">夜神</span>身上的［黑羽毛］，正當兩人要藉著［次元門］離開，<span class="global_name_span">悠絲緹亞</span>急忙上前一劍劈開兜帽人的外衣，沒想到竟然是早該死去的<span class="global_name_span">拉德爾</span>。</p> <div class="global_ps_text"> <p>這<span class="global_name_span">拉德爾</span>應該是正牌沒錯，不然胸口不會有那道被<span class="global_name_span">夜神</span>刺穿的傷口。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH14%EF%BC%BB%E7%A5%9E%E8%81%96%E5%AF%A9%E5%88%A403%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH14 神聖審判
  contentArr.push('<div class="title_text">CH15 復仇的誓約</div> <p>故事時間回到<span class="global_name_span">拉德爾</span>被<span class="global_name_span">夜神</span>刺穿後的那一年間，他被［科庫托斯］回收並且放置在巨大的培養試管中，體內的［血刻印］已經被分離出來，<span class="global_name_span">黎維塔</span>一直負責照顧他，因此<span class="global_name_span">拉德爾</span>還一息尚存。</p> <p><span class="global_name_span">黎維塔</span>表面上是被抓來的聖地修女，實際上已經投入黑魔法師的行列，但並不是效忠［科庫托斯］，而是與使者<span class="global_name_span">布萊德</span>合夥伺機喚醒<span class="global_name_span">拉德爾</span>重奪回［血刻印］，這舉動無異於與［科庫托斯］為敵。</p> <p>在三人逃跑的過程中，看到無數［鐵甲面］正在沉睡，他們都是以<span class="global_name_span">拉德爾</span>為藍本複製出來的［霍爾蒙克斯］，然而這些［量產型血刻印］並沒有正牌那樣能不斷產生［泰拉］的能力，充其量只是個儲存大量［泰拉］的消耗品，但這樣也足夠［科庫托斯］用於戰爭上。</p> <p>在三人擊敗部分黑魔法師的［霍爾蒙克斯］時，意外接收到<span class="global_name_span">黛安娜</span>的消息，她是被<span class="global_name_span">布萊德</span>抓來研究設施進行［霍爾蒙克斯］的研究，可能是因為傑出的能力，她至今維持著一定程度的自由，。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH15%EF%BC%BB%E5%BE%A9%E4%BB%87%E7%9A%84%E8%AA%93%E7%B4%8401%EF%BC%BD%3A8?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">黛安娜</span>本來想把<span class="global_name_span">拉德爾</span>當作研究材料，但因為打不過三人，所以很乾脆決定幫助<span class="global_name_span">拉德爾</span>找回原本在體內的［血刻印］。</p> <p>要到藏有［血刻印］的研究設施深處，最好的方式就是打開［次元門］，為達到目的，必須先解除［抑制器］，雖然<span class="global_name_span">黛安娜</span>提供了方法，但要準備執行時才發現［抑制器］早就被破壞了，而留守的使者<span class="global_name_span">墨菲亞</span>與部下<span class="global_name_span">卡芮娜</span>如今前往保管［血刻印］的場所。</p> <p>三人依照<span class="global_name_span">黛安娜</span>提供的座標前往該處，眼前有無數的巨大的培養試管，裡面裝著魔獸。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH15%EF%BC%BB%E5%BE%A9%E4%BB%87%E7%9A%84%E8%AA%93%E7%B4%8402%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>從<span class="global_name_span">布萊德</span>口中得知，這研究所不只研究［血刻印］，還研究［使者］，所謂［阿德林］就是這些魔獸的血液，喝下的人身體會產生扭曲變成魔獸的樣子，這種人化魔獸的血又能進一步抑制魔獸化的程度，所以喝下這種稀釋過的［阿德林］並存活下來的人便稱為［候補使者］。</p> <p>繼續往深處走，眾人遇到被魔獸圍攻的<span class="global_name_span">卡芮娜</span>，但她並沒有因此感恩，反而為了證明自己有成為［使者］的實力，拿起武器攻向<span class="global_name_span">布萊德</span>，最終被擊敗命懸一線，她索性直接喝下身旁的魔獸之血，貪婪的繼承各種魔獸的能力，最終化為駭人的怪物，但仍不敵<span class="global_name_span">布萊德</span>，因此含恨而終。</p> <p>一行人終於抵達［血刻印］前，在這等候已久的使者<span class="global_name_span">墨菲亞</span>與眾人展開大戰，她從一開始就識破<span class="global_name_span">布萊德</span>等人的背叛，之所以不伸手阻止，單純是想利用<span class="global_name_span">布萊德</span>喚醒<span class="global_name_span">拉德爾</span>，只是她沒想到三人聯手的實力超乎預期，自己也因此戰敗。</p> <p>這時<span class="global_name_span">斯托拉斯</span>現身，他就是<span class="global_name_span">黎維塔</span>背後的黑魔法師，也是當年在［盧戈鎮］現身的黑魔法師，［血刻印］的創始者，在<span class="global_name_span">悠絲緹亞</span>小時候，他引誘<span class="global_name_span">悠絲緹亞</span>喝下［阿德林］創造出最初的［使者］，目的是完成自己［悲壯的願望］，只是如今他將目標放在<span class="global_name_span">拉德爾</span>身上，以放過<span class="global_name_span">悠絲緹亞</span>當條件，要<span class="global_name_span">拉德爾</span>接受［血刻印］成為自己忠實的魁儡。</p> <p>只是<span class="global_name_span">拉德爾</span>心中還存有［過去的憐憫、對夥伴的懷念、未來的希望］，在<span class="global_name_span">布萊德</span>一刀將這些與<span class="global_name_span">拉德爾</span>斬開後，他又變回那滿頭白髮的邪惡姿態，之後<span class="global_name_span">黎維塔</span>將斬落的東西放入［量產型血刻印166號］身上，這就是<span class="global_name_span">拉德爾166</span>之所以如此不同的原因。</p> <div class="global_ps_text"> <p>關於［阿德林］不斷疊加補充設定的方式，實在是不太喜歡，這代表從一開始就沒仔細好好想設定，其實就照原本［食人魔之血］的設定就好了，如果是要賦予每個喝下人獲得不同能力，可以從別的地方入手。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH15%EF%BC%BB%E5%BE%A9%E4%BB%87%E7%9A%84%E8%AA%93%E7%B4%8403%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH15 復仇的誓約
  contentArr.push('<div class="title_text">CH16 三國同盟</div> <p>聖地［阿爾卡迪亞］的事件告一段落，<span class="global_name_span">悠絲緹亞</span>與<span class="global_name_span">拉德爾166</span>因為<span class="global_name_span">拉德爾</span>的突然出現而各懷心事，但眼下為了對抗［科庫托斯］，眾人前往［迪爾索特］港口，準備促成［羅坦］、［貝倫］、［尼福蘭特］的三國同盟。下船前<span class="global_name_span">格雷</span>從副官手上接過［羅坦］的玉璽，外表看起來是個戒指，但實際上是蘊含力量的［聖物］。</p> <p>如今的［迪爾索特］除了聚集了三國的重要人物外，使者<span class="global_name_span">墨菲亞</span>也來到這裡伺機進行陰謀，當<span class="global_name_span">格雷</span>一行人與［貝倫］的女王<span class="global_name_span">威廉明娜</span>、［尼福蘭特］的公主<span class="global_name_span">克蕾西亞</span>碰頭後，從<span class="global_name_span">伊柯利普斯</span>口中得知［科庫托斯］正在［魔塔］東邊的［魔獸之地］集結，雖然暫時不知道目的，但單靠［魔塔］本身沒辦法取得更進一步的情報，<span class="global_name_span">伊柯利普斯</span>只能向三國領導人請求援兵。就在安排好援兵後，港口突然傳來巨大的慘叫聲。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH16%EF%BC%BB%E4%B8%89%E5%9C%8B%E5%90%8C%E7%9B%9F01%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>許多士兵遭到中邪的士兵攻擊而倒地，從倖存的士兵口中得知那些中邪的士兵正前往［黑市］，<span class="global_name_span">威廉明娜</span>命令<span class="global_name_span">奧爾施塔因</span>留下保護港口，自己則帶著眾人前往［黑市］。</p> <p>在與中邪的士兵戰鬥的過程中，發現這一切都是使者<span class="global_name_span">墨菲亞</span>的傑作。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH16%EF%BC%BB%E4%B8%89%E5%9C%8B%E5%90%8C%E7%9B%9F02%EF%BC%BD%3A4?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>繼續往［黑市］深處前進，<span class="global_name_span">悠絲緹亞</span>險些中了幻覺被操控，但目前的她心志足夠堅定，並沒著了<span class="global_name_span">墨菲亞</span>的陷阱，另外在幫助士兵解除幻覺時，意外發現<span class="global_name_span">格雷</span>手上的玉璽戒指就是聖物，而<span class="global_name_span">墨菲亞</span>的目地就是奪取這聖物。</p> <p>在黑市深處遇到<span class="global_name_span">墨菲亞</span>與<span class="global_name_span">阿札爾</span>，從<span class="global_name_span">威廉明娜</span>對<span class="global_name_span">阿札爾</span>的態度看來，兩人早就認識。</p> <p>雙方隨即開始交戰，戰敗後的<span class="global_name_span">墨菲亞</span>本以為<span class="global_name_span">阿札爾</span>會召喚原始使者<span class="global_name_span">卡爾利恩</span>助戰，卻沒想到自己被<span class="global_name_span">阿札爾</span>當作棄子直接拋棄，眾人隨即意識到這是<span class="global_name_span">阿札爾</span>的調虎離山之計。</p> <p>另一邊原始使者<span class="global_name_span">卡爾利恩</span>襲擊三國同盟的會談場所，<span class="global_name_span">奧爾施塔因</span>受到重傷跪倒在地，就連<span class="global_name_span">魯</span>都被一劍擊倒昏死過去，當眾人趕到時，只能看著<span class="global_name_span">卡爾利恩</span>將昏迷的<span class="global_name_span">克蕾西亞</span>帶走。</p> <p>事後從被俘虜的<span class="global_name_span">墨菲亞</span>口中得知<span class="global_name_span">阿札爾</span>此時應該是在［黑市］更深處利用自己製作的裝置要奪取<span class="global_name_span">克蕾西亞</span>身上的聖物，<span class="global_name_span">墨菲亞</span>因為被當棄子而對整個［科庫托斯］懷恨在心，展現異常配合的態度，只是當自己和盤托出後，沒料到下場竟然是被<span class="global_name_span">威廉明娜</span>送去［魔塔］囚禁，在那有<span class="global_name_span">伊柯利普斯</span>看管著，<span class="global_name_span">墨菲亞</span>是插翅也難飛了。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH16%EF%BC%BB%E4%B8%89%E5%9C%8B%E5%90%8C%E7%9B%9F03%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在［黑市］深處發現<span class="global_name_span">墨菲亞</span>留下的裝置，如果<span class="global_name_span">阿札爾</span>成功利用裝置取得<span class="global_name_span">克蕾西亞</span>身上的聖物，那<span class="global_name_span">克蕾西亞</span>就有可能失去生命。</p> <p>當眾人趕到時，終究是慢了一步，<span class="global_name_span">阿札爾</span>順利取得聖物，眾人也在原始使者<span class="global_name_span">卡爾利恩</span>的強大實力下，全部被擊倒在地，<span class="global_name_span">格雷</span>的聖物也因此被奪走，就在<span class="global_name_span">卡爾利恩</span>準備下殺手時，繼承［黑羽毛］力量的<span class="global_name_span">拉德爾</span>出手阻止，<span class="global_name_span">阿札爾</span>見狀也不做糾纏，帶著<span class="global_name_span">卡爾利恩</span>與兩件聖物走進［次元門］離開。</p> <p>事後為了拯救失去聖物的<span class="global_name_span">克蕾西亞</span>生命，<span class="global_name_span">威廉明娜</span>與［黑市］的<span class="global_name_span">努斯</span>做了交易，以不透露［黑市］內部情況為代價，取得高濃度的魔石，以此代替聖物放入<span class="global_name_span">克蕾西亞</span>體內，終於將她救活。</p> <p>三國同盟的會談雖然歷經波折，最終還是成功促成，這時<span class="global_name_span">伊柯利普斯</span>傳來<span class="global_name_span">阿札爾</span>下落的消息，原來［科庫托斯］之前之所以聚集在［魔獸之地］，就是想解開古代魔獸的封印，搶走聖物就是用來破除封印，因此眾人下個目標就是前往阻止這陰謀。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH16%EF%BC%BB%E4%B8%89%E5%9C%8B%E5%90%8C%E7%9B%9F04%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH16 三國同盟
  contentArr.push('<div class="title_text">CH17 試煉之路</div> <p>大家利用<span class="global_name_span">伊柯利普斯</span>開啟［次元門］的能力，直接繞開外圍的黑魔法師，攻入［魔獸之地］內部，但聖地的防衛機制只服從擁有［聖物］人(也就是<span class="global_name_span">阿扎爾</span>)的指令，結果眾人被防衛石像送去［試煉之路］，<span class="global_name_span">拉德爾166</span>在路旁喚醒一個石像人<span class="global_name_span">試煉主管</span>，他雖然說話有些輕佻，但要通過這［試煉之路］只能遵守他的引導。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH17%EF%BC%BB%E8%A9%A6%E7%85%89%E4%B9%8B%E8%B7%AF01%EF%BC%BD%3Ab?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在［試煉之路］的考驗中，<span class="global_name_span">拉德爾166</span>覺醒使用神聖力量的能力，也明白<span class="global_name_span">試煉主管</span>是因為自己體內吸取部分［羅坦聖物］力量而覺醒，因此才能維持本心，帶其他人前往封印祭壇阻止<span class="global_name_span">阿扎爾</span>。</p> <p>只是其他的守護石像依舊受到<span class="global_name_span">阿扎爾</span>操控，不斷出現阻止眾人前進，這時昔日冒險遇到的夥伴紛紛傳送進遺跡內部，幫助眾人抵禦守護石像的追擊。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH17%EF%BC%BB%E8%A9%A6%E7%85%89%E4%B9%8B%E8%B7%AF02%EF%BC%BD%3A7?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">試煉主管</span>犧牲自己打開封印祭壇的大門，但眾人依舊無法阻止<span class="global_name_span">阿扎爾</span>解除古代魔獸的封印，<span class="global_name_span">悠絲緹亞</span>更被原始使者<span class="global_name_span">卡爾利恩</span>重創倒地，命懸一線，朦朧間看見<span class="global_name_span">卡爾利恩</span>的真面目，正是自己母親<span class="global_name_span">奧利維爾</span>。</p> <p><span class="global_name_span">阿扎爾</span>看見<span class="global_name_span">卡爾利恩</span>的記憶正逐漸甦醒，轉頭便帶著她離開，準備再進行調整，而留在原地重傷的<span class="global_name_span">悠絲緹亞</span>接受<span class="global_name_span">拉德爾166</span>的神聖力量治癒，不僅撿回一命，力量還因此大增。</p> <p><span class="global_name_span">悠絲緹亞</span>一行人透過<span class="global_name_span">拉德爾166</span>賦予的神聖力量增益，成功擊敗古代魔獸，這時<span class="global_name_span">伊柯利普斯</span>出現給予古代魔獸致命一擊，百年前她因為力量不足，只能眼睜睜看著師傅失去生命，自己耗盡全力只能勉強封印住古代魔獸，身體還變成幼兒型態，但百年來的修練，到如今總算能親手報仇。</p> <p>眼見事情告一段落，<span class="global_name_span">阿扎爾</span>卻突然出現搶走古代魔獸的血，也就是［阿德林］的原液，緊接著<span class="global_name_span">阿扎爾</span>關閉［次元門］，使者<span class="global_name_span">墨菲亞</span>隨即出現，她要向整個［科庫托斯］復仇，於是幫眾人再次打開［次元門］，並且加入一起追擊<span class="global_name_span">阿扎爾</span>。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH17%EF%BC%BB%E8%A9%A6%E7%85%89%E4%B9%8B%E8%B7%AF03%EF%BC%BD%3Aa?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH17 試煉之路
  contentArr.push('<div class="title_text">CH18 救贖</div> <p>眾人通過［次元門］來到［科庫托斯］的老巢，要擊敗<span class="global_name_span">阿札爾</span>必須先處理原始使者<span class="global_name_span">卡爾利恩</span>，經過<span class="global_name_span">墨菲亞</span>解釋才知道如今的<span class="global_name_span">卡爾利恩</span>是影子般的存在，至於本體的<span class="global_name_span">奧利維爾</span>如今被囚禁在<span class="global_name_span">阿札爾</span>所創造的記憶空間中。</p> <p><span class="global_name_span">墨菲亞</span>帶著眾人來到記憶空間，只要搜齊記憶碎片就可以前往囚禁<span class="global_name_span">奧利維爾</span>的地方，這一切都需要有<span class="global_name_span">奧利維爾</span>記憶的<span class="global_name_span">悠絲緹亞</span>才能做到，因為這個空間本身就是吸取記憶創造出來的。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH18%EF%BC%BB%E6%95%91%E8%B4%9601%EF%BC%BD%3Ac?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>蒐集記憶碎片的過程中，了解到<span class="global_name_span">阿札爾</span>原本跟<span class="global_name_span">奧爾施塔因</span>一樣都是<span class="global_name_span">威廉明娜</span>的屬臣，並且擔任法官的職位，為了能進行公平正義的裁決，他利用［泰拉］創造了吸取別人記憶的裝置魔法，也因此阻止了一場叛亂。</p> <p>但<span class="global_name_span">威廉明娜</span>深知使用［泰拉］的危險性，而遭到<span class="global_name_span">阿札爾</span>吸取記憶的士兵也的確昏迷不醒，於是<span class="global_name_span">阿札爾</span>被免除法官的職位，<span class="global_name_span">威廉明娜</span>要他趁這次機會尋找不使用［泰拉］也能取出記憶的方法，到時再回歸王國擔任法官職位。</p> <p>只是人算不如天算，這期間［貝倫］的王遭到刺殺，殘留的［泰拉］力量反應讓<span class="global_name_span">阿札爾</span>成為嫌疑人，在被親衛隊逮捕的過程中，［泰拉］失控將在場親衛隊消滅，這下<span class="global_name_span">阿札爾</span>等於坐實叛徒的罪名，而突然出現的黑魔法師<span class="global_name_span">斯托拉斯</span>現身表示一切都是自己所為，目的就是要吸收<span class="global_name_span">阿札爾</span>加入［科庫托斯］。</p> <p><span class="global_name_span">斯托拉斯</span>這人無異將是［貝倫］最大的潛在威脅，<span class="global_name_span">阿札爾</span>於是假意順從，想伺機消滅整個黑魔法師組織，可是隨著浸淫在［泰拉］力量的日子一久，<span class="global_name_span">阿札爾</span>無意間創造的黑暗人格吞噬取代了自己，這就是原本充滿正義感的<span class="global_name_span">阿札爾</span>之所以性情大變的原因。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH18%EF%BC%BB%E6%95%91%E8%B4%9602%EF%BC%BD%3A6?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">阿札爾</span>因為沒有肉體，所以必須依靠消耗魔力存在，只有取得強者的魔力，例如古代魔獸或是上帝的造物才能免於消失的命運，於是他偷偷跟著<span class="global_name_span">斯托拉斯</span>發現女武神<span class="global_name_span">奧利維爾</span>，並且將其變成原始使者，更在數年後謀劃取得古代魔獸的［阿德林］計畫。</p> <p>取得所有記憶碎片之後，終於打開囚禁<span class="global_name_span">奧利維爾</span>的通道，在眾人的合力下，加上<span class="global_name_span">悠絲緹亞</span>解放神劍［米斯特汀］的力量，影子<span class="global_name_span">卡爾利恩</span>被擊敗，<span class="global_name_span">奧利維爾</span>被順利救出。</p> <p>然而事情還沒有完結，<span class="global_name_span">阿札爾</span>已經順利取得肉身，如果不趁現在消滅他，日子一久就再難讓他露出破綻，此時<span class="global_name_span">拉爾德</span>、<span class="global_name_span">黎維塔</span>、<span class="global_name_span">布萊德</span>三人來到，並且表示將與眾人一起擊敗<span class="global_name_span">阿札爾</span>，雖然<span class="global_name_span">奧利維爾</span>十分抗拒這三個全身充滿［泰拉］的人，但<span class="global_name_span">悠絲緹亞</span>選擇相信他們，畢竟這段旅程中，遇過太多使用黑暗力量卻做著正義事情的夥伴。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH18%EF%BC%BB%E6%95%91%E8%B4%9603%EF%BC%BD%3A8?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">阿札爾</span>取得古代魔獸的力量，變身成龍型的怪物，強大的癒合能力無懼眾人的圍攻，於是<span class="global_name_span">拉爾德</span>與<span class="global_name_span">拉爾德166</span>合作淨化［黑羽毛］，並將它交還給<span class="global_name_span">奧利維爾</span>，取得完全女武神力量後，<span class="global_name_span">奧利維爾</span>親手擊碎<span class="global_name_span">阿札爾</span>的肉身，即便最後<span class="global_name_span">阿札爾</span>想吞噬<span class="global_name_span">奧利維爾</span>的肉體，但面對力量比自己強的存在，終究只能以失敗告終。</p> <p>最後的時刻，<span class="global_name_span">阿札爾</span>在精神世界中利用<span class="global_name_span">奧利維爾</span>對<span class="global_name_span">悠絲緹亞</span>的關心，讓<span class="global_name_span">奧利維爾</span>對<span class="global_name_span">黎維塔</span>三人產生負面情緒，更提到<span class="global_name_span">斯托拉斯</span>企圖將<span class="global_name_span">悠絲緹亞</span>拖入黑暗的深淵。</p> <p>為了保護女兒，<span class="global_name_span">奧利維爾</span>任由［泰拉］侵蝕自己化身為黑暗的外觀，原本該枯竭的生命又獲得強大力量。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH18%EF%BC%BB%E6%95%91%E8%B4%9604%EF%BC%BD%3A4?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>黑化的<span class="global_name_span">奧利維爾</span>將眾人打得毫無還手之力，這時半神<span class="global_name_span">艾達</span>連同<span class="global_name_span">葛蘭西特</span>出現，看著昔日摯友變成如今黑化的樣子，<span class="global_name_span">葛蘭西特</span>手下也不留情，與眾人一起合力將<span class="global_name_span">奧利維爾</span>擊敗。</p> <p><span class="global_name_span">艾達</span>趁機會淨化<span class="global_name_span">奧利維爾</span>身上的［泰拉］，原本生命已經走到盡頭的<span class="global_name_span">奧利維爾</span>在失去［泰拉］之後，等待她的只有消失的命運，最後在女兒的懷抱中安然逝去。</p> <p>至於<span class="global_name_span">奧利維爾</span>留下的［黑羽毛］，<span class="global_name_span">艾達</span>選擇交給<span class="global_name_span">拉爾德</span>保管，並且告知<span class="global_name_span">悠絲緹亞</span>有另外一場戰爭正等著他們，希望大家能與自己合作，一起救贖這個世界。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH18%EF%BC%BB%E6%95%91%E8%B4%9605%EF%BC%BD%3A3?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH18 救贖
  contentArr.push('<div class="title_text">CH19 被遺忘的戰爭</div> <p>在數百年前，眾神教導人類各種技術與知識，但人類不斷發展，過度消耗世界的魔力，於是為了阻止魔力消失，眾神決定不再照顧人類，部分對神不滿的人利用［古代魔法］也就是［黑魔法］企圖奪回神的力量，他們在整個［史貝倫大陸］地底聚集大量的［泰拉］，最終成為［夜世界］。</p> <p>之後發生了兩次［夜世界］與地上的戰爭，犧牲無數神、女武神、精靈、人類，最終半神<span class="global_name_span">艾達</span>耗盡力量成功封印［夜世界］通往地上的入口，並且消除一切相關的紀錄，避免有人企圖打開通往［夜世界］的大門，但自己也因此退化成小孩的模樣。</p> <p>但沒想到由［夜世界］之人戰死怨念凝聚而成的化身<span class="global_name_span">斯托拉斯</span>企圖解開封印，<span class="global_name_span">艾達</span>與<span class="global_name_span">葛蘭西特</span>多次想消滅他都被他躲開，於是帶著<span class="global_name_span">悠絲緹亞</span>一行人來到封印［夜世界］入口的島嶼，希望借眾人的力量阻止<span class="global_name_span">斯托拉斯</span>。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH19%EF%BC%BB%E8%A2%AB%E9%81%BA%E5%BF%98%E7%9A%84%E6%88%B0%E7%88%AD01%EF%BC%BD%3A8?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">悠絲緹亞</span>一行人前往島上的神殿，但因為島上濃烈的［泰拉］，導致<span class="global_name_span">莎赫拉查德</span>受到［泰拉］侵蝕汙染，雖然暫時得到壓制，但終究是無法根除。</p> <p>另外<span class="global_name_span">拉德爾166</span>本身就是屬於消耗品的［量產型血刻印］，雖然旅途中掌握了神聖力量的運用，但生命已經即將走到盡頭，為了不讓夥伴擔心，仍私下苦撐。</p> <p>在通往神殿的路上，有不少被［泰拉］污染的思念體，幸虧<span class="global_name_span">格雷</span>暗地裡向<span class="global_name_span">威廉明娜</span>求援，在［貝倫］的精銳部隊戰力下，成功驅散這些思念體，<span class="global_name_span">威廉明娜</span>還帶來［科庫托斯］失去<span class="global_name_span">阿札爾</span>之後，即將覆滅的消息。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH19%EF%BC%BB%E8%A2%AB%E9%81%BA%E5%BF%98%E7%9A%84%E6%88%B0%E7%88%AD02%EF%BC%BD%3Ab?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>在掃蕩［科庫托斯］的老巢時，曾經被奪走的聖物也被找回來，<span class="global_name_span">威廉明娜</span>拿出［羅坦］的國璽還給<span class="global_name_span">格雷</span>，在聖物的力量幫助下，眾人免於被［泰拉］影響。</p> <p>然而前進的過程中，一個強橫的黑翅膀女武神<span class="global_name_span">蘭</span>擋在眾人面前，她在尚未墮落之前，還曾教導過<span class="global_name_span">葛蘭西特</span>，為了讓大家順利前進，<span class="global_name_span">葛蘭西特</span>留下拖住<span class="global_name_span">蘭</span>，最終<span class="global_name_span">悠絲緹亞</span>一行人抵達神殿，遇到<span class="global_name_span">布萊德</span>。</p> <p>時間回到稍早<span class="global_name_span">斯托拉斯</span>四人抵達神殿時，<span class="global_name_span">斯托拉斯</span>透過［阿特拉蘇斯之眼］看到需要<span class="global_name_span">悠絲緹亞</span>一行人才能到達解開［夜世界］封印的未來，所以讓<span class="global_name_span">布萊德</span>前去為眾人引路。</p> <div class="global_ps_text"> <p>［阿特拉蘇斯之眼］能夠觀測所有可能發生的未來，並在其中自由選擇一個自己想要的未來實現，所以<span class="global_name_span">斯托拉斯</span>看似愚蠢的行為，其實是為了達到他所想要達到未來的手段，這在沒有［阿特拉蘇斯之眼］能力的其他人眼中是無法理解的。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH19%EF%BC%BB%E8%A2%AB%E9%81%BA%E5%BF%98%E7%9A%84%E6%88%B0%E7%88%AD03%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p><span class="global_name_span">斯托拉斯</span>看到的未來，是讓<span class="global_name_span">拉爾德</span>將<span class="global_name_span">悠絲緹亞</span>一行人全部吸收，在眾人來到之後，大戰一觸即發。</p> <p>化為怪物的<span class="global_name_span">斯托拉斯</span>與<span class="global_name_span">悠絲緹亞</span>僵持對戰，<span class="global_name_span">格雷</span>靠著聖物的力量，勉強跟<span class="global_name_span">布萊德</span>打個平手，但誰也傷不了誰，<span class="global_name_span">莎赫拉查德</span>則因為體內［泰拉］的反噬，根本無法全力對抗<span class="global_name_span">黎維塔</span>。</p> <p>至於本就快油盡燈枯的<span class="global_name_span">拉德爾166</span>在本尊面前更是毫無還手之力，但<span class="global_name_span">拉德爾</span>心中仍有疑慮，在<span class="global_name_span">拉德爾166</span>自願犧牲的提議下，<span class="global_name_span">拉德爾</span>將其吸收，重新取回自己對夥伴的情感力量。</p> <p>完整體的<span class="global_name_span">拉德爾</span>隨即調轉槍頭將<span class="global_name_span">斯托拉斯</span>消滅，並且吸收他取得巨大的黑暗力量與［阿特拉蘇斯之眼］，透過眼睛<span class="global_name_span">拉德爾</span>看到未來仍未改變，於是擊碎了封印，獨自前往［夜世界］，試圖改變眼中看到的未來。</p> <p>之後趕到的半神<span class="global_name_span">艾達</span>與她姐姐<span class="global_name_span">弗雷萊亞</span>勉強暫時封印［夜世界］入口，從她們口中得知有個強大的敵人［夢境之主］，是［夜世界］與地上的共同威脅，如今她們將擊敗這敵人的重任交託給<span class="global_name_span">悠絲緹亞</span>，因為必須前往［夜世界］，沒有［泰拉］或是神聖力量加護是沒辦法進入的，所以<span class="global_name_span">莎赫拉查德</span>、<span class="global_name_span">格雷</span>的冒險只能到此為止，<span class="global_name_span">黎維塔</span>與<span class="global_name_span">布萊德</span>則各懷心思與<span class="global_name_span">悠絲緹亞</span>一同前往。</p> <div class="global_ps_text"> <p>在活動劇情［Crossroads］描述中，在這之後<span class="global_name_span">莎赫拉查德</span>前往［魔塔］學習接納操控體內［泰拉］的方法，最終取得足以戰勝使者<span class="global_name_span">墨菲亞</span>的強大力量。<span class="global_name_span">格雷</span>則成為［羅坦］的王，與<span class="global_name_span">威廉明娜</span>協力促成［史貝倫聯邦］，為阻止未來可能發生的戰爭而準備。</p> </div> <div class="global_ps_text"> <p>［阿特拉蘇斯之眼］雖然能預測並選定未來，但對於比自己力量強大的存在是無法干預的，所以當<span class="global_name_span">拉德爾</span>吸收<span class="global_name_span">拉德爾166</span>後，力量強過<span class="global_name_span">斯托拉斯</span>，導致他沒能預見自己敗亡的命運。</p> </div> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH19%EF%BC%BB%E8%A2%AB%E9%81%BA%E5%BF%98%E7%9A%84%E6%88%B0%E7%88%AD04%EF%BC%BD%3Aa?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH19 被遺忘的戰爭
  contentArr.push('<div class="title_text">CH20 墬入深淵</div> <p><span class="global_name_span">悠絲緹亞</span>一行人來到［夜世界］的第一站是不死生物之地［塔洛斯］，這裡早已被［夢境之主］<span class="global_name_span">伊蓓羅雅</span>侵蝕，目前被其麾下的［十二個雷蓓莉絲］之一的<span class="global_name_span">帕萊特</span>控制，至於原本統治［塔洛斯］的王<span class="global_name_span">馬莫尼勒</span>則被封印在名叫［深淵之眼］的畫中。</p> <p><span class="global_name_span">悠絲緹亞</span>一行人為了打聽情報，讓<span class="global_name_span">黎維塔</span>對本來智商就不高的不死生物們一陣忽悠，順利進入［漆黑展覽館］，這裡陳列著有關［夜世界］與<span class="global_name_span">伊蓓羅雅</span>的畫作，皆出自<span class="global_name_span">帕萊特</span>之手，首先看到的是［夜世界五大王國的統治者］，當中赫然有<span class="global_name_span">伊柯利普斯</span>在其中，據畫作記載她為［魅魔之王］，是夢魔之地［利亞沙］曾經的統治者。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH20%EF%BC%BB%E5%A2%AC%E5%85%A5%E6%B7%B1%E6%B7%B501%EF%BC%BD%3A8?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>接著看到［十二個雷蓓莉絲］的作畫，但只有五個人有明確的形象，當中一個叫做<span class="global_name_span">達麗安</span>的就是<span class="global_name_span">布萊德</span>來到［夜世界］要復仇的對象。</p> <p><span class="global_name_span">悠絲緹亞</span>三人繼續探索，<span class="global_name_span">黎維塔</span>、<span class="global_name_span">布萊德</span>接連不慎被封印在［深淵之眼］的畫中，就連<span class="global_name_span">悠絲緹亞</span>也差點淪陷，幸虧一名叫做<span class="global_name_span">艾雅</span>的白髮小女兒解救她。</p> <p><span class="global_name_span">艾雅</span>擁有神奇的力量，不僅淨化<span class="global_name_span">悠絲緹亞</span>體內［泰拉］的暴走危險，還喚醒遭到［夢之侵蝕］的<span class="global_name_span">不死生物館長</span>，她原本是［塔洛斯］之王<span class="global_name_span">馬莫尼勒</span>的副官，為了救出自己的主君，決定向<span class="global_name_span">悠絲緹亞</span>告知關於［夢境之主］<span class="global_name_span">伊蓓羅雅</span>的情報。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH20%EF%BC%BB%E5%A2%AC%E5%85%A5%E6%B7%B1%E6%B7%B502%EF%BC%BD%3Ae?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>如今的［夜世界］瀰漫著名為［夢之侵蝕］的霧氣，它會導致接觸者神智被侵蝕，逐漸成為只忠於［夢境之主］<span class="global_name_span">伊蓓羅雅</span>的魁儡，只有擁有強大［泰拉］的人能倖免，但戰鬥力卻會因此大減。至於［十二個雷蓓莉絲］則是獲得<span class="global_name_span">伊蓓羅雅</span>加護的強者，她們能使用［侵蝕之力］，每個都是能與［夜世界五大王國的統治者］對抗的強者。</p> <p><span class="global_name_span">不死生物館長</span>透露，要將人從［深淵之眼］救出，必須先取得<span class="global_name_span">帕萊特</span>用來修改畫作的［白色顏料］。</p> <p>趁著<span class="global_name_span">帕萊特</span>全心全意做畫的空隙，<span class="global_name_span">悠絲緹亞</span>順利取得［白色顏料］，卻因為身上特殊的味道被<span class="global_name_span">帕萊特</span>發現，為了順利脫身，<span class="global_name_span">悠絲緹亞</span>只能學<span class="global_name_span">黎維塔</span>開始胡說八道，企圖將自己塑造成<span class="global_name_span">帕萊特</span>的粉絲，雖然話語笨拙，但不死生物本來智商就低，竟然順利矇混過關，只是熱情的<span class="global_name_span">帕萊特</span>硬是要邀請<span class="global_name_span">悠絲緹亞</span>來給自己的畫作建議。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH20%EF%BC%BB%E5%A2%AC%E5%85%A5%E6%B7%B1%E6%B7%B503%EF%BC%BD%3A0?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>本就對藝術沒有研究的<span class="global_name_span">悠絲緹亞</span>只能胡謅一通，這行為惹的<span class="global_name_span">帕萊特</span>不高興，將人趕走之後，自己又沉浸在創作中，但事後回想又覺得自己對待粉絲的態度實在太差，想親自跟<span class="global_name_span">悠絲緹亞</span>道歉，這下卻意外發現與<span class="global_name_span">悠絲緹亞</span>一起行動的<span class="global_name_span">艾雅</span>。</p> <p>原來<span class="global_name_span">艾雅</span>是從［夢境之主］<span class="global_name_span">伊蓓羅雅</span>創造的［樂園］中逃走的，<span class="global_name_span">帕萊特</span>卻誤以為<span class="global_name_span">悠絲緹亞</span>是綁走<span class="global_name_span">艾雅</span>嫌犯，於是雙方展開一場大戰，<span class="global_name_span">帕萊特</span>擁有強大的防禦力，要不是<span class="global_name_span">不死生物館長</span>趁機毀壞她的畫作轉移注意力，眾人根本找不到機會逃走。</p> <p>接著<span class="global_name_span">悠絲緹亞</span>順利救出<span class="global_name_span">黎維塔</span>與<span class="global_name_span">布萊德</span>，還有<span class="global_name_span">艾雅</span>的夥伴<span class="global_name_span">提爾</span>，本來接著就要解放<span class="global_name_span">馬莫尼勒</span>，但<span class="global_name_span">黎維塔</span>卻有別的心思，於是施展嘴遁想阻止<span class="global_name_span">悠絲緹亞</span>。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH20%EF%BC%BB%E5%A2%AC%E5%85%A5%E6%B7%B1%E6%B7%B504%EF%BC%BD%3A5?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p> <p>不過<span class="global_name_span">悠絲緹亞</span>並沒有受到影響，依舊遵守與<span class="global_name_span">不死生物館長</span>的約定，將<span class="global_name_span">馬莫尼勒</span>放了出來，大家聯手將<span class="global_name_span">帕萊特</span>擊敗，受不了失敗刺激的<span class="global_name_span">帕萊特</span>將自己關進［深淵之眼］畫中，事情似乎就此告一段落。</p> <p>這次的戰鬥中，讓<span class="global_name_span">馬莫尼勒</span>得知<span class="global_name_span">艾雅</span>擁有淨化［泰拉］與喚醒被［夢之侵蝕］的人能力後，認為這就是擊敗［夢境之主］<span class="global_name_span">伊蓓羅雅</span>的關鍵，並且建議眾人前往惡魔的國度［凱納爾］的競技場，在那將有機會遇到另一個［夜世界］的王<span class="global_name_span">萊維亞</span>，至於<span class="global_name_span">馬莫尼勒</span>自己則以［漆黑展覽館］為根據地，重新聚集不死生物，準備與<span class="global_name_span">伊蓓羅雅</span>的戰鬥。</p> <p>另一邊，本該被關在［深淵之眼］畫中的<span class="global_name_span">帕萊特</span>被<span class="global_name_span">達麗安</span>帶走。</p> <p>在野外，一道門橫空出世，［店長］來了。</p> <p><iframe id="odysee-iframe" style="width:80%; aspect-ratio:16 / 9;" src="https://odysee.com/%24/embed/%40%E7%A9%BF%E8%B6%8A%E6%99%82%E7%A9%BA%E7%9A%84%E8%B2%93%E6%94%AF%E7%B7%9A%E5%8A%87%E6%83%85%3Ad%2FCH20%EF%BC%BB%E5%A2%AC%E5%85%A5%E6%B7%B1%E6%B7%B505%EF%BC%BD%3A2?r=fmAkDE97HYuQUZFcjDdDgK3N3jtoSfmB" allowfullscreen></iframe></p>');//CH20 墬入深淵
